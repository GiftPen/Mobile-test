      coin:  () => { tone({ f: 1050, dur: 0.05, vol: 0.08, type: "triangle" });
                     tone({ f: 1560, dur: 0.09, vol: 0.07, type: "triangle", delay: 0.05 }); },
      bomb:  () => { noise({ f: 1800, f2: 120, dur: 0.34, vol: 0.34 });
                     tone({ f: 150, f2: 44, dur: 0.34, vol: 0.30, type: "sine" }); },
      line:  () => noise({ f: 500, f2: 4500, dur: 0.3, vol: 0.2, filter: "bandpass", q: 3 }),
      bird:  () => { tone({ f: 1500, f2: 2300, dur: 0.07, vol: 0.16, type: "triangle" });
                     tone({ f: 1900, f2: 2700, dur: 0.06, vol: 0.13, type: "triangle", delay: 0.08 }); },
      star:  () => PENTA.forEach((n, i) =>
                     tone({ f: hz(n) * 4, dur: 0.14, vol: 0.11, type: "sine", delay: i * 0.045 })),
      brick: () => noise({ f: 2600, f2: 700, dur: 0.1, vol: 0.22, filter: "highpass" }),
      stage: () => [0, 4, 7].forEach((n, i) =>
                     tone({ f: hz(n) * 2, dur: 0.2, vol: 0.2, type: "triangle", delay: i * 0.1 })),
      // a round is three stages of work, so it has to land bigger than a stage: the same run
      // up, then a chord that actually sustains under it instead of stopping dead
      round: () => {
        [0, 4, 7, 12].forEach((n, i) =>
          tone({ f: hz(n) * 2, dur: 0.28, vol: 0.24, type: "triangle", delay: i * 0.09 }));
        tone({ f: hz(0),      dur: 0.9, att: 0.03, vol: 0.17, type: "sine", delay: 0.34 });
        tone({ f: hz(7),      dur: 0.9, att: 0.03, vol: 0.12, type: "sine", delay: 0.36 });
        tone({ f: hz(12) * 2, dur: 0.8, att: 0.04, vol: 0.10, type: "sine", delay: 0.38 });
      },
      over:  () => [12, 7, 3].forEach((n, i) =>
                     tone({ f: hz(n), dur: 0.32, vol: 0.22, type: "triangle", delay: i * 0.15 })),
      danger:() => tone({ f: 150, f2: 105, dur: 0.28, vol: 0.2, type: "sawtooth" }),
      buy:   () => { tone({ f: 620, dur: 0.07, vol: 0.16, type: "triangle" });
                     tone({ f: 930, dur: 0.13, vol: 0.14, type: "triangle", delay: 0.06 }); },
      // a single swoosh read as wind. Rerolling is cards being riffled, so it is a run of
      // short clicks climbing in pitch, not one sweep.
      reroll:() => { for (let i = 0; i < 5; i++)
        noise({ f: 1300 + i * 480, dur: 0.032, vol: 0.14, filter: "bandpass", q: 6, delay: i * 0.036 }); },

      // A legendary showing up is a 1% event with a whole visual language of its own (§22)
      // and, until now, no sound at all -- the card blazed gold in total silence.
      // A slow detuned chime: the beating between the pairs is what makes it shimmer.
      legend: () => [0, 7, 12, 16].forEach((n, i) => {
        tone({ f: hz(n) * 2,         dur: 0.85, att: 0.025, vol: 0.15, type: "sine", delay: i * 0.1 });
        tone({ f: hz(n) * 2 * 1.005, dur: 0.85, att: 0.025, vol: 0.11, type: "sine", delay: i * 0.1 });
      }),
      trait: () => [0, 7, 12].forEach((n, i) =>
                     tone({ f: hz(n) * 3, dur: 0.18, vol: 0.13, type: "sine", delay: i * 0.06 })),
      graft: () => [0, 4, 7, 12, 16].forEach((n, i) =>
                     tone({ f: hz(n) * 4, dur: 0.2, vol: 0.12, type: "sine", delay: i * 0.05 })),
      expire:() => tone({ f: 400, f2: 190, dur: 0.22, vol: 0.16, type: "triangle" }),
    };

    function play(name, arg) { const f = S[name]; if (f && live()) f(arg); }
    function setMuted(v) {
      muted = !!v;
      try { localStorage.setItem("fs_mute", muted ? "1" : "0"); } catch (e) {}
      if (master) master.gain.value = muted ? 0 : volume;
    }
    function setVolume(v) {
      volume = Math.max(0, Math.min(1, v));
      try { localStorage.setItem("fs_vol", String(volume)); } catch (e) {}
      if (master && !muted) master.gain.value = volume;
    }
    function setPopStyle(k) {
      if (!POP_STYLES[k]) return;
      popStyle = k;
      try { localStorage.setItem("fs_pop", k); } catch (e) {}
    }
    return { play, unlock, setMuted, setVolume, names: Object.keys(S),
             POP_STYLES, POP_KEYS, setPopStyle, get popStyle() { return popStyle; },
             get voices() { return voices; }, get MAX_VOICES() { return MAX_VOICES; },
             get state() { return ctx ? ctx.state : "none"; },
             get muted() { return muted; }, get volume() { return volume; },
             get armed() { return armed; } };
  })();
  // TEMPORARY (?pop=1): the juice sound is the one thing that cannot be judged from code, so
  // it gets picked on a phone. Tapping a chip switches the style AND plays it across three
  // fruits, which is how you actually hear whether a cluster will sound right.
  if (/[?&]pop=1/.test(location.search)) {
    window.addEventListener("load", () => {
      const bar = document.createElement("div");
      bar.style.cssText = "position:fixed;left:0;right:0;bottom:0;z-index:99;display:flex;" +
        "gap:6px;justify-content:center;flex-wrap:wrap;padding:8px 10px;" +
        "background:rgba(8,9,15,.94);backdrop-filter:blur(6px)";
      const paint = () => {
        bar.textContent = "";
        for (const k of SFX.POP_KEYS) {
          const b = document.createElement("button");
          const on = k === SFX.popStyle;
          b.textContent = SFX.POP_STYLES[k].name;
          b.style.cssText = "font:800 13px/1 inherit;padding:10px 12px;border-radius:11px;" +
            "border:1px solid " + (on ? "#ffd23e" : "#2b3048") + ";" +
            "background:" + (on ? "#3a3316" : "#1c2032") + ";color:" + (on ? "#ffd23e" : "#8a93ad");
          b.addEventListener("click", () => {
            SFX.unlock(); SFX.setPopStyle(k); paint();
            [0, 4, 6].forEach((fruit, n) => setTimeout(() => SFX.play("pop", fruit), n * 110));
          });
          bar.appendChild(b);
        }
      };
      paint();
      document.body.appendChild(bar);
    });
  }

  // any first gesture wakes the context; harmless to fire more than once
  for (const ev of ["pointerdown", "touchstart", "keydown"])
    window.addEventListener(ev, () => SFX.unlock(), { passive: true });
  // one generic click for every button, in the capture phase so it lands before the handler
  // that may play a more specific sound (buy, reroll, ...) on top of it
  document.addEventListener("pointerdown", e => {
    const b = e.target && e.target.closest && e.target.closest("button");
    if (b && !b.disabled) SFX.play("tap");
  }, true);

  // ---- item shop: the coin sink both modes were missing ----
  // Arcade earned coins with nothing to spend them on; Star Rush had only relics, so coins
  // past the last shop were dead weight. Buying an item costs coins and NOT a touch -- the
  // same rule the game already uses for tapping an item that is already on the board.
  const ITEM_PRICES = { bird: 10, line: 15, bomb: 30, star: 70 };
  let armedItem = null, wasDanger = false;
  function canBuyItem(kind) {
    return running && !busy && !paused && ITEM_PRICES[kind] != null
           && coins >= ITEM_PRICES[kind] && emptyCells().length > 0;
  }
  function armItem(kind) {
    armedItem = armedItem === kind ? null : (canBuyItem(kind) ? kind : null);
    renderItemShop();
  }
  function placeBoughtItem(r, c) {
    const kind = armedItem;
    if (!kind || !canBuyItem(kind) || grid[r][c] !== -1) { armedItem = null; renderItemShop(); return false; }
    coins -= ITEM_PRICES[kind]; coinsShown = coins;
    SFX.play("buy");
    const color = pickColor();
    grid[r][c] = color; special[r][c] = kind;
    appear[r][c] = 1;
    armedItem = null;
    dirty = true; renderItemShop(); updateHUD();
    return true;
  }
  function renderItemShop() {
    const bar = document.getElementById("ishop");
    if (!bar) return;
    for (const b of bar.querySelectorAll(".ib")) {
      const kind = b.dataset.item;
      const affordable = canBuyItem(kind);
      b.disabled = !affordable && armedItem !== kind;
      b.classList.toggle("armed", armedItem === kind);
    }
    const h = document.getElementById("hint");
    if (armedItem) h.textContent = d("hintArmed");
    else if (h.textContent === d("hintArmed")) h.textContent = "";
  }
  for (const b of document.querySelectorAll("#ishop .ib"))
    b.addEventListener("click", () => armItem(b.dataset.item));

  // ---- test item dock: place items freely without spending a turn ----
  let selectedItem = null;
  function placeTestItem(r, c, item) {
    const color = pickColor();
    if (item === "brick") { grid[r][c] = BRICK; special[r][c] = null; hp[r][c] = 3; }
    else if (item === "line") { grid[r][c] = color; special[r][c] = randInt(2) ? "lineH" : "lineV"; }
    else if (item.startsWith("fruit")) {                  // plain fruit of a chosen color slot
      grid[r][c] = parseInt(item.slice(5), 10); special[r][c] = null;
    }
    else { grid[r][c] = color; special[r][c] = item; }   // bird / bomb / star
    appear[r][c] = 1; dirty = true; updateHUD();          // NO touchCount / spawn / pickNext / game-over
  }
  document.querySelectorAll(".dock-btn").forEach(b => b.addEventListener("click", () => {
    selectedItem = selectedItem === b.dataset.item ? null : b.dataset.item;
    document.querySelectorAll(".dock-btn").forEach(x => x.classList.toggle("sel", x.dataset.item === selectedItem));
    document.getElementById("hint").textContent = selectedItem ? d("hintTestDock") : "";
  }));
  // ---- the bloom burst ----
  // Rule 1: placing on empty bursts a (2R+1)x(2R+1) box around itself; same-color
  //         buds inside pop, and each popped bud re-bursts the same box (chain).
  // Rule 2: different colors are walls — the burst never pops or passes them.
  function plant(r0, c0, color) {
    touchCount++;
    SFX.play("plant");
    buzz(12);                              // the tick under your thumb
    grid[r0][c0] = color;            // the placed ball (removed later if it clears)
    special[r0][c0] = null;
    const R = BURST_RADIUS;
    const visited = Array.from({length: ROWS}, () => Array(COLS).fill(false));
    visited[r0][c0] = true;
    // frontier items {r,c,mode,color}: "color" = same-color flood, "blast" = item-cleared
    const frontier = seedsAround(r0, c0, R, color, visited).map(([r, c, d]) => ({ r, c, d, mode: "color", color }));
    // placing right next to an item detonates it too (the placement burst reaches it)
    for (let dr = -R; dr <= R; dr++)
      for (let dc = -R; dc <= R; dc++) {
        if (dr === 0 && dc === 0) continue;
        const nr = r0 + dr, nc = c0 + dc;
        if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS || visited[nr][nc]) continue;
        if (special[nr][nc]) { visited[nr][nc] = true; frontier.push({ r: nr, c: nc, d: Math.hypot(dr, dc), mode: "blast", color: grid[nr][nc] }); }
      }
    flashBox(r0, c0, R, color);
    runChain(r0, c0, color, visited, frontier, true);
  }

  // tap an existing item bud to trigger it directly (FREE: no touch count, no spawn — strategic)
  function tapItem(r0, c0) {
    const color = grid[r0][c0];
    SFX.play({ bomb: "bomb", lineH: "line", lineV: "line", lineX: "line",
               bird: "bird", star: "star" }[special[r0][c0]] || "tap");
    const visited = Array.from({length: ROWS}, () => Array(COLS).fill(false));
    runChain(r0, c0, color, visited, [{ r: r0, c: c0, d: 0, mode: "blast", color }], false);
  }

  // run the chain from an initial frontier; placement=true means a ball was placed
  function runChain(r0, c0, color, visited, initialFrontier, placement) {
    busy = true; dirty = true;
    const R = BURST_RADIUS;
    let frontier = initialFrontier;
    let popped = 0;          // total pops (for score)
    let chainPopped = 0;     // only your own color-chain pops (for item generation)
    let pointsPopped = 0;    // sum of FRUIT_POINTS of every popped fruit (for scoring)
    const hitBricks = new Map();   // brick key -> number of adjacent pops (1 HP each)
    let visualEnd = 0;             // timestamp the last staggered pop fires at
    function step() {
      if (!frontier.length) {
        let broke = 0;
        if (hitBricks.size) SFX.play("brick");
        hitBricks.forEach((dmg, key) => {
          const br = (key / COLS) | 0, bc = key % COLS;
          if (grid[br][bc] !== BRICK) return;   // already destroyed by a blast
          hp[br][bc] -= dmg;                    // one HP per adjacent pop
          glow[br][bc] = { c: 0, t: 0.9 };
          if (hp[br][bc] <= 0) { grid[br][bc] = -1; special[br][bc] = null; burst(br, bc, "#9aa0b5"); broke++; }
        });
        if (broke) addScore(broke * 30);
        finishBurst(r0, c0, color, popped, chainPopped, placement, pointsPopped, visualEnd);
        return;
      }
      const next = [];
      let maxD = 0;                  // furthest cell in this ring, for the settle time
      // Pop order has to radiate from whatever caused the ring. budsAround/lineCells collect
      // cells in dr/dc order, so a bomb used to wipe top-to-bottom instead of outward.
      frontier.sort((a, b) => (a.d || 0) - (b.d || 0));
      const ringAt = performance.now();
      for (const it of frontier) {
        const { r, c, mode } = it;
        const cellColor = grid[r][c];
        const sp = special[r][c];
        const vis = cellColor < 0 ? it.color : cellColor;
        grid[r][c] = -1; special[r][c] = null;   // logic clears immediately (game state stays correct)
        ghost[r][c] = vis;                       // ...but it stays on screen until its burst
        const carried = takeCoin(r, c);
        popped++;
        if (cellColor >= 0) {
          pointsPopped += fruitScoreAt(r, c, cellColor);
          if (zoneCoin && zoneAt(r, c)) addCoins(1, r, c);   // 금맥: the cell itself pays
        }
        // item reward = size of YOUR placed color group. Count color-flood pops AND any
        // same-color cell a bomb/line blast consumed mid-chain (incl. a same-color bomb itself),
        // so overlapping items no longer rob the count. (Star's board-wide sweep bypasses this
        // loop entirely -> still uncounted, preserving the anti-snowball rule.)
        if (mode === "color" || (placement && cellColor === color)) chainPopped++;
        // the visual pop is delayed by DISTANCE, so the blast ripples outward as one front
        const popAt = (it.d || 0) * POP_STAGGER_MS;
        if (popAt > maxD) maxD = popAt;
        setTimeout(() => {
          ghost[r][c] = null;                    // this cell's turn: fruit goes, particles fly
          burst(r, c, vis);
          popScoreText(r, c, cellColor, fruitScoreAt(r, c, cellColor));
          if (cellColor >= 0) SFX.play("pop", cellColor);
          if (cellColor >= 0) notify("onFruitPop", { r, c, color: cellColor });
          if (carried) addCoins(1, r, c);        // its coin flies when the fruit actually pops
          glow[r][c] = { c: vis, t: 1 };
          if (mode === "color") flashBox(r, c, R, vis);   // ripple its 3x3 burst range
          dirty = true;
        }, popAt);

        // neighbors: chip bricks, and trigger any adjacent item (any color) via this pop
        for (let dr = -1; dr <= 1; dr++)
          for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            const nr = r + dr, nc = c + dc;
            if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
            if (grid[nr][nc] === BRICK) { const k = nr * COLS + nc; hitBricks.set(k, (hitBricks.get(k) || 0) + 1); }
            else if (special[nr][nc] && !visited[nr][nc]) {   // adjacent item -> detonate it
              visited[nr][nc] = true;
              next.push({ r: nr, c: nc, d: Math.hypot(dr, dc), mode: "blast", color: grid[nr][nc] });
            }
          }

        // same-color flood continues through color-mode pops (matching this item's color)
        if (mode === "color")
          for (const [nr, nc, d] of seedsAround(r, c, R, it.color, visited))
            next.push({ r: nr, c: nc, d, mode: "color", color: it.color });

        // ---- item detonations (fire regardless of how this cell was popped) ----
        if (sp === "bomb") {                     // 5x5 blast, ignores color walls
          flashBox(r, c, bombRadius(), cellColor);
          const [fx, fy] = cellCenter(r, c);
          flares.push({ cx: fx, cy: fy, kind: cellColor < 0 ? it.color : cellColor, maxR: cell * 1.7, t: 0 });  // grow to ~3x3
          addShake(11);
          for (const [nr, nc, d] of budsAround(r, c, bombRadius(), visited))
            next.push({ r: nr, c: nc, d, mode: "blast", color: cellColor });
        } else if (sp === "lineH" || sp === "lineV" || sp === "lineX") { // row / column / both
          const arms = sp === "lineX" ? ["lineH", "lineV"] : [sp];
          for (const arm of arms) {
            flashLine(r, c, arm);
            waves.push({ type: arm === "lineH" ? "h" : "v",
                         fixed: arm === "lineH" ? r : c, origin: arm === "lineH" ? c : r,
                         color: cellColor < 0 ? it.color : cellColor, t: 0 });
            for (const [nr, nc, d] of lineCells(r, c, arm, visited))
              next.push({ r: nr, c: nc, d, mode: "blast", color: cellColor });
          }
          addShake(8);
        } else if (sp === "star") {           // COLOR BOMB: connect-the-dots, then clear them all
          flashBox(r, c, R, cellColor);
          addShake(5);
          const target = mode === "color" ? it.color : mostCommonColor();
          // collect same-color cells, clear them NOW (logic) but hold them as ghosts (visual)
          const tCells = [];
          if (target >= 0)
            for (let rr = 0; rr < ROWS; rr++)
              for (let cc = 0; cc < COLS; cc++)
                if (!visited[rr][cc] && grid[rr][cc] === target) {
                  visited[rr][cc] = true;
                  grid[rr][cc] = -1; special[rr][cc] = null; popped++;
                  pointsPopped += fruitScore(target);
                  tCells.push([rr, cc, takeCoin(rr, cc)]);
                  // chip bricks adjacent to each star-cleared cell (was missing)
                  for (let dr = -1; dr <= 1; dr++)
                    for (let dc = -1; dc <= 1; dc++) {
                      const br = rr + dr, bc = cc + dc;
                      if (br >= 0 && br < ROWS && bc >= 0 && bc < COLS && grid[br][bc] === BRICK)
                        { const k = br * COLS + bc; hitBricks.set(k, (hitBricks.get(k) || 0) + 1); }
                    }
                }
          // order nearest-neighbor from the star origin = a one-stroke path
          const path = [[r, c]];
          let cur = [r, c];
          while (tCells.length) {
            let bi = 0, bd = Infinity;
            for (let k = 0; k < tCells.length; k++) {
              const dr = tCells[k][0]-cur[0], dc = tCells[k][1]-cur[1], d = dr*dr+dc*dc;
              if (d < bd) { bd = d; bi = k; }
            }
            cur = tCells.splice(bi, 1)[0]; path.push(cur);
          }
          links.push({ nodes: path, color: target, prog: 0, reached: 0, done: false });
          // small local splash so the star itself pops immediately
          for (const [nr, nc, d] of budsAround(r, c, R, visited))
            next.push({ r: nr, c: nc, d, mode: "blast", color: grid[nr][nc] });
        } else if (sp === "bird") {
          for (let b = 0; b < birdFlock; b++) spawnBird(r, c);   // a flock, if a relic says so
        }
      }
      // when the outermost pop of this ring will have fired
      visualEnd = Math.max(visualEnd, ringAt + maxD);
      frontier = next;
      setTimeout(step, WAVE_STEP_MS);
    }
    step();
  }

  // same-color plain fruits within Chebyshev radius R (items are NOT color-matched)
  function seedsAround(r, c, R, color, visited) {
    const out = [];
    for (let dr = -R; dr <= R; dr++) {
      for (let dc = -R; dc <= R; dc++) {
        if (dr === 0 && dc === 0) continue;
        const nr = r + dr, nc = c + dc;
        if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS || visited[nr][nc]) continue;
        if (grid[nr][nc] === color && special[nr][nc] === null) {
          visited[nr][nc] = true; out.push([nr, nc, Math.hypot(dr, dc)]);
        }
      }
    }
    return out;
  }

  // ANY bud within R (used by bomb/star blast — ignores color walls)
  function budsAround(r, c, R, visited) {
    const out = [];
    for (let dr = -R; dr <= R; dr++) {
      for (let dc = -R; dc <= R; dc++) {
        if (dr === 0 && dc === 0) continue;
        const nr = r + dr, nc = c + dc;
        if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS || visited[nr][nc]) continue;
        if (grid[nr][nc] !== -1) { visited[nr][nc] = true; out.push([nr, nc, Math.hypot(dr, dc)]); }
      }
    }
    return out;
  }

  // all buds in the row (lineH) or column (lineV), marking them visited
  function lineCells(r, c, type, visited) {
    const out = [];
    if (type === "lineH") {
      for (let cc = 0; cc < COLS; cc++) {
        if (cc === c || visited[r][cc]) continue;
        if (grid[r][cc] !== -1) { visited[r][cc] = true; out.push([r, cc, Math.abs(cc - c)]); }
      }
    } else {
      for (let rr = 0; rr < ROWS; rr++) {
        if (rr === r || visited[rr][c]) continue;
        if (grid[rr][c] !== -1) { visited[rr][c] = true; out.push([rr, c, Math.abs(rr - r)]); }
      }
    }
    return out;
  }

  function flashLine(r, c, type) {
    if (type === "lineH") {
      for (let cc = 0; cc < COLS; cc++) if (grid[r][cc] === -1) glow[r][cc] = { c: 3, t: 0.8 };
    } else {
      for (let rr = 0; rr < ROWS; rr++) if (grid[rr][c] === -1) glow[rr][c] = { c: 3, t: 0.8 };
    }
  }

  // most abundant color currently on the board (-1 if empty)
  function mostCommonColor() {
    const cnt = new Array(COLORS.length).fill(0);
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++)
      if (grid[r][c] >= 0) cnt[grid[r][c]]++;
    let bi = -1, bv = 0;
    for (let k = 0; k < cnt.length; k++) if (cnt[k] > bv) { bv = cnt[k]; bi = k; }
    return bi;
  }

  // ---- bird (참새): flies to a random junk fruit and eats it ----
  const cellCenter = (r, c) => [pad + c * cell + cell / 2, pad + r * cell + cell / 2];

  function sameColorNeighbors(r, c) {
    const col = grid[r][c]; let n = 0;
    for (let dr = -1; dr <= 1; dr++)
      for (let dc = -1; dc <= 1; dc++) {
        if (dr === 0 && dc === 0) continue;
        const nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc] === col) n++;
      }
    return n;
  }

  // target priority: bricks first, then the most isolated junk fruit, else any fruit
  function chooseBirdTarget(exclude) {
    // priority: bricks -> plain fruits (junk first) -> items (last resort)
    const bricks = [], fruits = [], items = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (grid[r][c] === -1 || (exclude && exclude[r * COLS + c])) continue;
      if (grid[r][c] === BRICK) bricks.push([r, c]);
      else if (special[r][c]) items.push([r, c]);   // item bud
      else fruits.push([r, c]);                       // plain fruit
    }
    if (bricks.length) return bricks[randInt(bricks.length)];
    if (fruits.length) {
      const junk = fruits.filter(([r, c]) => sameColorNeighbors(r, c) === 0);
      const pool = junk.length ? junk : fruits;
      return pool[randInt(pool.length)];
    }
    if (items.length) return items[randInt(items.length)];   // only if nothing else left
    return null;
  }

  function spawnBird(fromR, fromC) {
    // exclude cells already targeted by in-flight birds so multiple birds pick different targets
    const exclude = {};
    for (const f of birds) exclude[f.tr * COLS + f.tc] = true;
    const t = chooseBirdTarget(exclude);
    if (!t) return false;
    birds.push({ sr: fromR, sc: fromC, tr: t[0], tc: t[1], t: 0, curve: Math.random() < 0.5 ? -1 : 1 });
    return true;
  }

  function flashBox(r0, c0, R, colorIdx) {
    for (let dr = -R; dr <= R; dr++)
      for (let dc = -R; dc <= R; dc++) {
        const rr = r0 + dr, cc = c0 + dc;
        if (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS && grid[rr][cc] === -1)
          glow[rr][cc] = { c: colorIdx < 0 ? 0 : colorIdx, t: 0.7 };
      }
  }

  function finishBurst(r0, c0, color, popped, chainPopped, placement, pointsPopped, visualEnd = 0) {
    // the tutorial waits for the burst to finish so the player sees the result of what they
    // did before the next instruction replaces it
    if (tut) setTimeout(nextTutStep, Math.max(700, visualEnd - performance.now() + 700));
    // the per-fruit numbers are still flying; hold the total until they have landed
    const totalAt = Math.max(0, visualEnd - performance.now());
    if (placement) {
      if (popped > 0) {
        grid[r0][c0] = -1;               // success -> placed ball consumed cleanly
        burst(r0, c0, color);
        streak++;
        const cleared = popped + 1;          // include the ball you placed
        const chainCount = chainPopped + 1;  // your color group size, inclusive
        // per-fruit points (placed ball + all popped) × chain-size bonus × streak
        const groupPts = (pointsPopped || 0) + fruitScore(color);
        const gained = scorePop(groupPts, cleared);
        notify("onPop", { r: r0, c: c0, color, cleared, chainCount, gained, placement: true });
        const sub = multLabel(chainBonus(cleared), streakMult());
        setTimeout(() => showGain(r0, c0, gained, POP_COLORS[color] || "#fff", sub), totalAt);
        addShake(Math.min(12, cleared * 0.7));

        // reward: item tier from YOUR color group only (chainCount), not item cascades.
        // items now sit on the board — tap them, or chain into them, to trigger.
        let itemMsg = "";
        if (chainCount >= itemNeed(STAR_THRESHOLD)) {
          grid[r0][c0] = color; special[r0][c0] = "star";
          itemMsg = d("itemStar");
        } else if (chainCount >= itemNeed(BOMB_THRESHOLD)) {
          grid[r0][c0] = color; special[r0][c0] = "bomb";
          itemMsg = d("itemBomb");
        } else if (chainCount >= itemNeed(LINE_THRESHOLD)) {
          grid[r0][c0] = color;
          special[r0][c0] = crossLine ? "lineX" : (randInt(2) ? "lineH" : "lineV");
          itemMsg = d("itemLine");
        } else if (chainCount >= itemNeed(BIRD_THRESHOLD)) {
          grid[r0][c0] = color; special[r0][c0] = "bird";
          itemMsg = d("itemBird");
        }
        if (itemMsg) { burst(r0, c0, color); document.getElementById("hint").textContent = itemMsg; }
      } else {
        streak = 0;                      // miss -> placed ball stays as junk, streak resets
      }
      if (grid[r0][c0] !== -1) appear[r0][c0] = 1;  // placed ball (junk/item) pops in too
    } else if (popped > 0) {
      // manual item tap: score the clears, no new item, keep the queued color
      const gained = scorePop(pointsPopped || 0, popped);
      notify("onPop", { r: r0, c: c0, color, cleared: popped, chainCount: popped, gained, placement: false });
      const sub = multLabel(chainBonus(popped), streakMult());
      setTimeout(() => showGain(r0, c0, gained, POP_COLORS[color] || "#fff", sub), totalAt);
      addShake(Math.min(12, popped * 0.7));
    }

    updateHUD();                 // score and streak land straight away
    dirty = true;

    // only a real PLACEMENT ends a turn (spawn + brick + game-over). A manual item tap is FREE.
    const endTurn = () => {
      if (placement) {
        spawnBuds(spawnCount());
        // staged gimmick: once bricks are unlocked, one spawns every few touches at current HP level
        const bLvl = brickHpLevel();
        if (bLvl >= 1 && touchCount % BRICK_EVERY === 0) spawnBrick(bLvl);
        pickNext();
        notify("onTurn", { touchCount, score });
        tickRelicLife("touches");
        if (rules().touchBudget) touchesLeft--;
        updateHUD();
        dirty = true;
      }

      // Meeting the quota does NOT end the stage. Forcing the jump threw away whatever
      // touches were left, cut a big chain's aftermath short, and took the decision away at
      // the moment you succeeded. The stage runs its full budget; clearing the quota just
      // turns the remaining touches into bonus scoring, with the board filling as the cost.
      const rush = rules().touchBudget;
      if (placement && emptyCells().length === 0) {
        // board is completely full -> let the spawned pieces pop in & be seen, then decide
        busy = true;
        setTimeout(() => closeStage("board"), 750);
      } else if (rush && touchesLeft <= 0) {
        busy = true;
        setTimeout(() => closeStage("touches"), 750);
      } else {
        busy = false;
        updateHUD();      // the "leave early" button needs !busy, which was still true above
      }
    };

    // The turn's new fruits used to land the instant the chain's LOGIC finished, dropping them
    // into cells still mid-explosion. Hold them until every staggered pop has fired, and keep
    // input blocked through the wait so it reads as part of the burst rather than a stall.
    if (placement) {
      busy = true;
      // The star holds every cell it cleared as a ghost fruit for the length of its
      // constellation draw (~0.7-1.5s), and links paint over the grid -- spawning into those
      // cells would put a new fruit under an old ghost. Wait the animation out.
      // links only drain inside draw(), so if rendering stalls -- a backgrounded tab, say --
      // this would wait forever and the turn would never end. Give up after a second and a half.
      const deadline = performance.now() + 1500;
      const whenSettled = () => {
        if (links.length && performance.now() < deadline) { setTimeout(whenSettled, 80); return; }
        endTurn();
      };
      setTimeout(whenSettled, Math.max(0, visualEnd - performance.now()) + SPAWN_SETTLE_MS);
    } else {
      endTurn();
    }
  }

  // Temporary relics are cheap because they run out. Their clock ticks in whichever unit
  // they were written in -- stages, or placements -- and they leave when it hits zero.
  const lifeUnitLabel = u => d(u === "touches" ? "unitTouch" : "unitStage");
  function tickRelicLife(unit) {
    let expired = null;
    for (const id of Object.keys(relicLife)) {
      const R = RELICS[id];
      if (!R || !R.life || R.life.unit !== unit) continue;
      relicLife[id] -= 1;
      if (relicLife[id] > 0) continue;
      delete relicLife[id];
      const at = relics.indexOf(id);
      if (at >= 0) relics.splice(at, 1);
      expired = R;
    }
    if (expired) {
      SFX.play("expire");
      applyRelics();
      document.getElementById("hint").textContent = d("expired", expired.icon, expired.name);
      updateHUD();
    }
  }

  // ---- between-stage shop ----
  const REROLL_COST = 3;
  // 4 + 안목 (1) + 접붙이기가 그 안목을 2배로 (1 더) = 6, the intended ceiling. 안목 was the
  // only unbounded stat on the board: it is not once-per-run, so a long run could take it
  // every round and walk the shelf past 10.
  const SHOP_OFFERS = 4;
  const SHOP_OFFERS_MAX = 6;  // the ceiling the numbers above are chosen to land on exactly
  let shopOffers = [], shopReroll = REROLL_COST;
  let shopSold = new Set();   // bought this visit: the card stays put and reads 품절
  const $sh = id => document.getElementById(id);

  // grade first, then a relic within that grade
  function rollOffers(n = 3) {
    const byTier = {};
    for (const t of TIER_KEYS) byTier[t] = [];
    for (const id of Object.keys(RELICS)) if (!relics.includes(id)) byTier[relicTier(RELICS[id])].push(id);
    const out = [];
    while (out.length < n) {
      const live = TIER_KEYS.filter(t => byTier[t].length);
      if (!live.length) break;
      let total = 0;
      for (const t of live) total += TIERS[t].odds;
      let r = Math.random() * total, pick = live[live.length - 1];
      for (const t of live) { r -= TIERS[t].odds; if (r < 0) { pick = t; break; } }
      const bucket = byTier[pick];
      out.push(bucket.splice(randInt(bucket.length), 1)[0]);
    }
    return out;
  }
  // one place decides how wide the shelf is, so the ceiling cannot be bypassed by a future
  // relic quietly adding to offerBonus
  const shelfSize = () => Math.min(SHOP_OFFERS_MAX, SHOP_OFFERS + offerBonus);

  // fires once per fresh shelf, after the cards are on screen so the chime lands with the
  // gold rather than before it. Only on a new draw -- buying does not re-announce.
  function announceOffers() {
    const has = shopOffers.some(id => RELICS[id] && relicTier(RELICS[id]) === "legend");
    // delayed so the chime lands with the gold rather than before it; returns the decision so
    // the choice is testable without waiting on a timer
    if (has) setTimeout(() => SFX.play("legend"), 180);
    return has;
  }

  function openShop() {
    SFX.play("trait");
    shopOffers = rollOffers(shelfSize());   // the 안목 trait widens it further
    shopSold = new Set();
    shopReroll = REROLL_COST;
    renderShop();
    $sh("shop").classList.remove("hidden");
    announceOffers();
  }
  function closeShop() {
    $sh("shop").classList.add("hidden");
    // a trait pick lands every couple of stages, right after the shop
    if (rules().touchBudget && stage > 1 && (stage - 1) % STAGES_PER_ROUND === 0) { openTraits(); return; }
    resumePlay();
  }
  function resumePlay() {
    busy = false; dirty = true;
    $sh("hint").textContent =
      d("hintStage", stageLabel(stage), rules().quota(stage), touchesLeft);
    rollZones();                 // a fresh map each stage
    notify("onStageStart", { stage });
    updateHUD();
  }
  function renderShop() {
    $sh("sh-stage").textContent = stageLabel(stage);
    $sh("sh-coin").textContent = fmtNum(coins);
    $sh("sh-slots").textContent = `${relics.length}/${relicCap()}`;
    $sh("sh-reroll-cost").textContent = shopReroll;
    $sh("sh-reroll").disabled = coins < shopReroll || !shopOffers.length;

    const wrap = $sh("sh-offers");
    wrap.textContent = "";
    if (!shopOffers.length) {
      const e = document.createElement("div");
      e.className = "shop-empty"; e.textContent = d("shopEmpty");
      wrap.appendChild(e);
      return;
    }
    const full = relics.length >= relicCap();
    for (const id of shopOffers) {
      const R = RELICS[id];
      const sold = shopSold.has(id);
      const poor = coins < R.price;
      const card = document.createElement("button");
      const grade = relicTier(R);
      card.className = "offer"
        + (sold ? " sold" : (poor || full ? " off" : ""))
        + (grade === "rare" || grade === "legend" ? " shine shine-" + grade : "");
      card.disabled = sold || poor || full;
      const tier = TIERS[relicTier(R)];
      card.style.borderColor = tier.color + "66";
      const gr = document.createElement("span");
      gr.className = "of-tier"; gr.textContent = tier.name; gr.style.color = tier.color;
      const nm = document.createElement("b"); nm.className = "of-name"; nm.textContent = R.name;
      const ic = document.createElement("span"); ic.className = "of-ic"; ic.textContent = R.icon;
      // the description always shows: you cannot decide what to sell without knowing what
      // you would be buying. The full shelf is said on the price line instead.
      const ds = document.createElement("span"); ds.className = "of-desc"; ds.textContent = R.desc;
      const pr = document.createElement("span");
      pr.className = "of-price" + (full ? " nofit" : "");
      const life = R.life ? ` · ${R.life.amount}${lifeUnitLabel(R.life.unit)}` : "";
      pr.textContent = sold ? d("soldOut") : full ? d("noRoom", R.price) : `🪙 ${R.price}${life}`;
      card.append(gr, nm, ic, ds, pr);
      card.addEventListener("click", () => buyRelic(id));
      wrap.appendChild(card);
    }
  }
  function buyRelic(id) {
    const R = RELICS[id];
    // the sold card stays on the shelf now, so "already owned" has to be refused here rather
    // than relying on the button being disabled
    if (!R || relics.includes(id) || coins < R.price || relics.length >= relicCap()) return;
    coins -= R.price; coinsShown = coins;
    SFX.play("buy");
    relics.push(id);
    if (R.life) relicLife[id] = R.life.amount;   // starts its clock on purchase
    applyRelics();                      // recompute, so buying mid-run matches a fresh run
    touchesLeft = Math.max(touchesLeft, stageTouches());   // a touch relic pays out this stage
    shopSold.add(id);                   // leave the card in place rather than reflowing the shop
    renderShop();
  }

  // ---- trait picks, every couple of stages ----
  // shop runs after every stage; traits only when a round has just ended (…-3 cleared)
  let traitOffers = [], graftArmed = false, traitRerolls = 0;

  function rollTraits(n = 3) {
    const owned = new Set(traits.map(t => t.id));
    const pool = Object.keys(TRAITS).filter(id => !(TRAITS[id].once && owned.has(id)));
    const out = [];
    while (out.length < n && pool.length) out.push(pool.splice(randInt(pool.length), 1)[0]);
    return out;
  }
  function openTraits() {
    traitOffers = rollTraits();
    // "다음 특성 선택을 2배로" promises it just happens, so a charge arrives armed. Starting
    // it off meant the doubling silently did nothing unless you found the button, which read
    // as the charge being broken. The toggle stays -- but now it is opting OUT to save the
    // charge for a better round, which is the decision actually worth making.
    graftArmed = doubles > 0;
    traitRerolls = 1;                   // one free look at a different three

    renderTraits();
    $sh("traits").classList.remove("hidden");
  }
  function renderTraits() {
    const rr = $sh("tr-reroll");
    rr.disabled = traitRerolls <= 0;
    rr.textContent = `🔄 ${traitRerolls}`;   // a count, like the shop's price -- "사용함" was blunt
    const btn = $sh("tr-double");
    // the charge only means anything if something on offer can actually be scaled
    const anyScalable = traitOffers.some(id => TRAITS[id].scalable);
    btn.classList.toggle("hidden", doubles <= 0);
    btn.disabled = !anyScalable;
    btn.classList.toggle("on", graftArmed);
    btn.title = anyScalable ? "" : d("noScalable");
    $sh("tr-double-n").textContent = doubles;

    const wrap = $sh("tr-offers");
    wrap.textContent = "";
    for (const id of traitOffers) {
      const T = TRAITS[id];
      const scaled = graftArmed && doubles > 0 && T.scalable;
      const eff = traitEffects(T, scaled ? 2 : 1);
      const b = document.createElement("button");
      b.className = "trait-row" + (scaled ? " boost" : "");
      const ic = document.createElement("span"); ic.className = "tr-ic"; ic.textContent = T.icon;
      const body = document.createElement("span"); body.className = "tr-body";
      const nm = document.createElement("b"); nm.textContent = T.name + (scaled ? "  " + d("doubled") : "");
      const ds = document.createElement("span"); ds.textContent = T.desc(eff);
      body.append(nm, ds);
      b.append(ic, body);
      b.addEventListener("click", () => pickTrait(id));
      wrap.appendChild(b);
    }
  }
  function pickTrait(id) {
    const T = TRAITS[id]; if (!T) return;
    SFX.play(graftArmed && doubles > 0 && T.scalable ? "graft" : "trait");
    // armed is a UI flag; the charge is the truth. Without the doubles check an armed flag
    // left over from a previous screen would double a trait for free.
    const scaled = graftArmed && doubles > 0 && T.scalable;
    if (scaled) doubles--;
    // These land ONCE, into accumulated state, because they act on what you have already
    // built. applyRelics ignores their stats, so recomputing can never re-apply them.
    for (const e of traitEffects(T, scaled ? 2 : 1)) {
      if (e.stat === "doubles") doubles += e.amount;
      else if (e.stat === "stackAll") for (let i = 0; i < fruitStack.length; i++) fruitStack[i] += e.amount;
      else if (e.stat === "boostBest") {
        let best = 0;
        for (let i = 1; i < FRUIT_POINTS.length; i++) if (fruitScore(i) > fruitScore(best)) best = i;
        fruitBoost[best] *= e.amount;
      }
    }
    traits.push({ id, amount: scaled ? 2 : 1 });
    applyRelics();
    touchesLeft = Math.max(touchesLeft, stageTouches());
    closeTraits();
  }
  function closeTraits() { $sh("traits").classList.add("hidden"); resumePlay(); }

  // ---- info popup: what I am carrying, and the odds as they stand ----
  const fruitName = i => (L("_fruit") || FRUIT_KO)[i];   // follows the language
  // slot order is historical (0체리 1오렌지 2키위 3레몬 …); the table reads better grouped by
  // points, so cherry and lemon sit together at 1점 and orange and kiwi at 2점
  const FRUIT_TABLE_ORDER = [0, 3, 1, 2, 4, 5, 6];
  function fruitIconEl(i) {                    // the real board art, not an emoji stand-in
    const im = document.createElement("img");
    im.className = "inf-fruit";
    im.src = `assets_new/fruit${i}.png`;
    im.onerror = () => { im.onerror = null; im.src = `assets/fruit${i}.png`; };
    im.alt = fruitName(i);
    return im;
  }
  let infoTab = "fruits";

  function renderInfo() {
    for (const b of document.querySelectorAll(".itab"))
      b.classList.toggle("on", b.dataset.tab === infoTab);
    const body = $sh("info-body");
    body.textContent = "";
    const row = (ic, name, desc, num, inert, action) => {
      const d = document.createElement("div");
      d.className = "inf-row" + (inert ? " inert" : "");
      let i;
      if (typeof ic === "string") { i = document.createElement("span"); i.className = "inf-ic"; i.textContent = ic; }
      else i = ic;
      const b = document.createElement("span"); b.className = "inf-body";
      const n = document.createElement("b"); n.textContent = name;
      const s2 = document.createElement("span"); s2.textContent = desc;
      b.append(n, s2);
      const v = document.createElement("span"); v.className = "inf-num"; v.textContent = num;
      d.append(i, b, v);
      if (action) d.appendChild(action);
      body.appendChild(d);
    };
    if (infoTab === "relics") {
      // the shelf count only existed in the shop, so a trait that widened it (넓은 주머니)
      // changed nothing you could see -- the shop had already closed by then
      const cnt = document.createElement("div");
      cnt.className = "inf-count";
      const capNow = relicCap();
      cnt.textContent = d("relicCount", relics.length, capNow);
      if (relics.length > capNow) cnt.textContent += d("relicOver", relics.length - capNow);
      body.appendChild(cnt);
      if (!relics.length) {
        const e = document.createElement("div");
        e.className = "inf-empty"; e.textContent = d("noRelics");
        body.appendChild(e);
        return;
      }
      // discarding is a shop decision: it frees a slot for something better, at half back
      const inShop = !$sh("shop").classList.contains("hidden");
      relics.forEach((id, i) => {
        const R = RELICS[id]; if (!R) return;
        const inert = i >= relicCap();
        let act = null;
        if (inShop) {
          act = document.createElement("button");
          act.className = "inf-drop";
          // "버리기 🪙5" read as though it cost 5. Say what actually happens: you sell it
          // and money comes back.
          act.textContent = d("sellFor", Math.floor(R.price / 2));
          act.addEventListener("click", e => { e.stopPropagation(); discardRelic(i); });
        }
        const left = relicLife[id];
        row(R.icon, R.name, inert ? d("relicOff") : R.desc,
            inert ? d("inactive") : (left ? d("lifeLeft", left, lifeUnitLabel(R.life.unit)) : ""),
            inert, act);
      });
    } else if (infoTab === "traits") {
      const standing = traits.filter(t => TRAITS[t.id] && !TRAITS[t.id].meta);
      if (!standing.length && doubles <= 0) {
        const e = document.createElement("div");
        e.className = "inf-empty"; e.textContent = d("noTraits");
        body.appendChild(e);
        return;
      }
      for (const t of standing) {
        const T = TRAITS[t.id];
        row(T.icon, T.name + (t.amount > 1 ? " " + d("doubled") : ""), T.desc(traitEffects(T, t.amount)), "", false);
      }
      if (doubles > 0) row("✨", TRAITS.graft.name, d("nextDouble"), d("charges", doubles), false);
    } else if (infoTab === "help") {
      // Reachable mid-run, because "what does this item do" is a question you have while
      // playing, not on a menu. Thresholds read from the live values, so the numbers here
      // cannot drift from the ones the game actually uses -- including when a relic eases them.
      const sec = key => { const h = document.createElement("div");
        h.className = "help-h"; h.textContent = d(key); body.appendChild(h); };
      const par = html => { const q = document.createElement("p");
        q.className = "help-p"; q.innerHTML = html; body.appendChild(q); };
      sec("helpRules");
      par(d("helpRule1")); par(d("helpRule2")); par(d("helpRule3"));
      sec("helpItems");
      par(d("helpBird", itemNeed(BIRD_THRESHOLD)));
      par(d("helpLine", itemNeed(LINE_THRESHOLD)));
      par(d("helpBomb", itemNeed(BOMB_THRESHOLD), bombRadius() * 2 + 1));
      par(d("helpStar", itemNeed(STAR_THRESHOLD)));
      par(d("helpItemFire"));
      sec("helpRun");
      par(d("helpRun1", STAGES_PER_ROUND));
      par(d("helpRun2")); par(d("helpRun3"));
    } else {
      // the fruit table is where a relic's "1만큼 더" turns into a number you can read
      // a proper table: the score column is the number that actually applies, multiplier
      // already folded in, so nothing has to be worked out in your head
      const p = colorOdds();
      const head = document.createElement("div");
      head.className = "ftab-row ftab-head";
      for (const t of ["", d("colFruit"), d("colScore"), d("colOdds")]) {
        const c = document.createElement("span"); c.textContent = t; head.appendChild(c);
      }
      body.appendChild(head);
      for (const i of FRUIT_TABLE_ORDER) {
        if (i >= p.length) continue;           // arcade runs fewer colours
        const pts = fruitScore(i);
        const m = pts / (FRUIT_POINTS[i] || 1);   // above 1 means something raised it
        const d = document.createElement("div"); d.className = "ftab-row";
        const nm = document.createElement("span"); nm.className = "ft-name"; nm.textContent = fruitName(i);
        const sc = document.createElement("span");
        sc.className = "ft-score" + (Math.abs(m - 1) > 0.001 ? " up" : "");
        sc.textContent = String(L("points") instanceof Function ? L("points")(pts) : pts);
        const od = document.createElement("span");
        od.className = "ft-odds" + (oddsMult[i] > 0 ? " up" : "");
        od.textContent = `${p[i].toFixed(1)}%`;
        d.append(fruitIconEl(i), nm, sc, od);
        body.appendChild(d);
      }
    }
  }
  function discardRelic(i) {
    const id = relics[i], R = RELICS[id];
    if (!R || $sh("shop").classList.contains("hidden")) return;
    relics.splice(i, 1);
    delete relicLife[id];
    coins += Math.floor(R.price / 2);          // half back -- never enough to churn for profit
    coinsShown = coins;
    applyRelics();
    renderInfo();
    renderShop();
  }
  // the fade is only honest if it tracks the actual scroll position
  function syncInfoFade() {
    const body = document.getElementById("info-body");
    const wrap = body.parentElement;
    const more = body.scrollHeight - body.scrollTop - body.clientHeight > 4;
    wrap.classList.toggle("more", more);
  }
  function openInfo(tab) {
    if (tab) infoTab = tab;
    renderInfo();
    $sh("info").classList.remove("hidden");
    document.getElementById("info-body").scrollTop = 0;
    // synchronously: renderInfo() has already put the content in, so scrollHeight is correct,
    // and rAF never fires in a headless check (same trap as the render loop)
    syncInfoFade();
  }
  function closeInfo() { $sh("info").classList.add("hidden"); }

  // Leaving early trades score for coins: the touches you did not spend come back as
  // currency. Half rate, or rushing the quota would beat playing on for score every time.
  const leftoverCoins = () => Math.floor(Math.max(0, touchesLeft) * COIN_PER_LEFTOVER);
  function endStageEarly() {
    if (!rules().touchBudget || !running || busy) return;
    if (stageScore < rules().quota(stage)) return;
    busy = true;
    addCoins(leftoverCoins(), (ROWS - 1) / 2, (COLS - 1) / 2);
    touchesLeft = 0;
    document.getElementById("rush-next").classList.add("hidden");
    updateHUD();
    setTimeout(stageClear, 560);
  }

  // The verdict has to be reached when the board is actually still, not when it was queued.
  // A bird is in the air for ~880ms after the turn ends and still scores and still eats a
  // fruit when it lands -- so a last touch could hit the quota exactly, or free the cell that
  // filled the board, after the loss had already been decided.
  function closeStage(reason, deadline) {
    if (!running) return;
    deadline = deadline || performance.now() + 2500;
    if (birds.length && performance.now() < deadline) {     // let them land first
      setTimeout(() => closeStage(reason, deadline), 100);
      return;
    }
    if (rules().touchBudget && stageScore >= rules().quota(stage)) { stageClear(); return; }
    if (reason === "board" && emptyCells().length > 0) {    // a bird ate one: play on
      const outOfTouches = rules().touchBudget && touchesLeft <= 0;
      if (!outOfTouches) { busy = false; updateHUD(); return; }
      gameOver("touches");
      return;
    }
    gameOver(reason);
  }

  // ---- Star Rush: quota met -> next stage ----
  // The board deliberately carries over. Touch pressure plus a filling board is the
  // dual tension the design leans on (doc 8); a fresh board would remove half of it.
  function stageClear() {
    // fly the payout from the middle of the board -- awarding it position-less meant the
    // counter just ticked up silently, which read as "the coin effect isn't working"
    SFX.play(stage % STAGES_PER_ROUND === 0 ? "round" : "stage");
    recordStage();                       // reaching it counts even if the run is abandoned
    tickRelicLife("stages");             // the stage that just ended counts against them
    addCoins(Math.round(COIN_PAYOUT(stage) * payoutMult), (ROWS - 1) / 2, (COLS - 1) / 2);
    stage++;
    stageScore = 0;
    touchesLeft = stageTouches();
    flash = Math.max(flash, 0.5); addShake(7);
    document.getElementById("hint").textContent =
      d("hintStage", stageLabel(stage), rules().quota(stage), touchesLeft);
    updateHUD();
    dirty = true;
    setTimeout(openShop, 700);          // let the payout coins fly first; busy stays true
  }

  function gameOver(reason) {
    running = false; busy = false;
    SFX.play("over");
    buzz([30, 60, 30]);
    recordStage();
    const why = reason === "touches" ? d("overTouches") : reason === "board" ? d("overFull") : "";
    document.getElementById("ov-msg").innerHTML = rules().touchBudget
      ? d("reachedStage", stageLabel(stage), fmtNum(score)) +
        `<br><span class="ov-best">${d("bestLine", stageLabel(bestStage || 1), fmtNum(best))}</span>` +
        (why ? `<br><span class="ov-why">${why}</span>` : "")
      : d("scoreBest", `<b>${fmtNum(score)}</b>`, `<b>${fmtNum(best)}</b>`);
    document.getElementById("menu").classList.add("hidden");     // show the game-over view
    document.getElementById("gameover").classList.remove("hidden");
    document.getElementById("overlay").classList.remove("hidden");
    mfxStop();   // canvas lives inside #menu (now hidden) — stop the ambient loop
  }
  function showMenu() {
    document.getElementById("gameover").classList.add("hidden");
    document.getElementById("menu").classList.remove("hidden");
    document.getElementById("overlay").classList.remove("hidden");
    document.getElementById("menu-msg").textContent = "";
    mfxStart();
  }

  // ---- juice: particles + combo popup ----
  // Score text keeps each fruit's hue but lifted toward white: banana (#00b4d8) and orange
  // (#f45b00) are too dark to read against the board at their true colour.
  const lift = (hex, amt) => {
    const n = parseInt(hex.slice(1), 16);
    const mix = v => Math.round(v + (255 - v) * amt);
    return `rgb(${mix(n >> 16 & 255)},${mix(n >> 8 & 255)},${mix(n & 255)})`;
  };
  const POP_COLORS = COLORS.map(h => lift(h, 0.45));

  // a fruit's own points, at its own cell, in its own colour -- the "ingredients" beat.
  // The multiplied total lands separately once the whole chain has finished.
  function popScoreText(r, c, colorIdx, pts) {
    if (!(colorIdx >= 0)) return;
    floats.push({
      x: pad + c * cell + cell / 2, y: pad + r * cell + cell / 2,
      text: fmtShort(pts == null ? fruitScore(colorIdx) : pts),  // the number that actually scores
      color: POP_COLORS[colorIdx] || "#fff", t: 0,
    });
  }

  // ⭐ the star's signature: every fruit its constellation clears drops a coin (doc 4-0).
  // `coins` moves immediately so nothing can desync; the flight and the ticking counter are
  // decoration layered on top of a value that is already correct.
  // Three income streams stack (clear payout + coin fruit + banked touches). Measured over a
  // 7-stage run they paid roughly double what the relics cost, so all five could be bought
  // with change to spare and the build stopped being a choice. Trimmed to bring purchases
  // back toward the design's one-relic-per-two-stages.
  const COIN_PAYOUT = st => 3 + st;         // coins for clearing stage `st`
  const COIN_FRUIT_CHANCE = 0.06;           // a spawned fruit carries a coin this often
  const COIN_PER_LEFTOVER = 0.5;            // coins per touch banked by leaving a stage early
  // takes the coin off a cell as it is cleared; returns whether there was one
  function takeCoin(r, c) {
    if (!coinCell || !coinCell[r][c]) return 0;
    coinCell[r][c] = 0;
    return 1;
  }
  function addCoins(n, r, c) {
    if (!(n > 0)) return;
    coins += n;
    SFX.play("coin");
    if (r != null) for (let i = 0; i < n && coinFly.length < 60; i++)
      coinFly.push({ sx: pad + c * cell + cell / 2, sy: pad + r * cell + cell / 2,
                     t: -i * 0.05, lift: 0.5 + Math.random() * 0.7 });
    dirty = true;
  }
  // where the coins fly to: the HUD coin chip, mapped into board space
  function coinTargetX() {
    const chip = document.getElementById(rules().touchBudget ? "rs-coin" : "st-coin");
    if (!chip) return boardPx / 2;
    const a = chip.getBoundingClientRect(), b = canvas.getBoundingClientRect();
    if (!a.width) return boardPx / 2;
    return a.left + a.width / 2 - b.left;
  }

  function burst(r, c, color) {
    const col = typeof color === "number" ? (COLORS[color] || "#fff") : (color || "#fff");
    const cx = pad + c * cell + cell / 2;
    const cy = pad + r * cell + cell / 2;
    // splash ring
    particles.push({ type: "ring", x: cx, y: cy, life: 1, color: col, rad: cell * 0.12 });
    // juice droplets (spray up, then gravity pulls them down)
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * PI2, sp = 1 + Math.random() * 3.2;
      particles.push({
        x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1,
        life: 0.8 + Math.random() * 0.4, color: col, r: cell * (0.04 + Math.random() * 0.09)
      });
    }
  }

  // floating "+N" that rises from the cell you acted on (colored by fruit)
  // which multipliers turned the ingredients into the total
  // "덩어리" -- what this multiplier measures is the size of the connected same-colour group
  // you popped, not a sequence of anything. 연쇄/체인 both promise a cascade this game does
  // not have, and it maps 1:1 to "cluster", already the standard term in English match-3.
  function multLabel(cb, sm) {
    const p = [];
    if (cb > 1.001) p.push(["gp-chain", `×${+cb.toFixed(1)} ${d("cluster")}`]);
    if (sm > 1.001) p.push(["gp-combo", `×${+sm.toFixed(1)} ${d("combo")}`]);
    return p;
  }
  function showGain(r, c, gained, colorIdx, sub) {
    if (!gained || gained <= 0) return;
    SFX.play("gain", (sub && sub.length) ? 12 : 4);
    if (sub && sub.length) buzz(24);       // only the big ones, or it is a constant hum
    const wrap = document.getElementById("stage-wrap");
    const el = document.createElement("div");
    el.className = "gain-pop";
    el.textContent = "+" + fmtNum(gained);
    // the total is the payoff, so it has to outweigh the per-fruit numbers (~20px) -- and it
    // grows with the hit, so a big chain is felt before it is read. sqrt keeps 350 from
    // dwarfing 50 the way a linear scale would.
    el.style.fontSize = Math.round(Math.max(30, Math.min(54, 30 + (Math.sqrt(gained) - 3) * 2))) + "px";
    if (sub && sub.length) {
      const s2 = document.createElement("span");
      s2.className = "gp-sub";
      for (const [cls, txt] of sub) {
        const b = document.createElement("b"); b.className = cls; b.textContent = txt;
        s2.appendChild(b);
      }
      el.appendChild(s2);
    }
    el.style.color = (typeof colorIdx === "number" ? COLORS[colorIdx] : colorIdx) || "#fff";
    el.style.top = (pad + r * cell + cell / 2) + "px";
    el.style.left = (pad + c * cell + cell / 2) + "px";
    wrap.appendChild(el);
    // the multiplier pills are wide; keep the whole pop inside the board or a pop in
    // column 0 or 7 gets clipped by the viewport
    let w = el.offsetWidth;
    if (w > boardPx - 8) {                     // 7-digit totals outgrew the board
      el.style.fontSize = (parseFloat(el.style.fontSize) * (boardPx - 8) / w) + "px";
      w = el.offsetWidth;
    }
    if (w) {
      const cx = pad + c * cell + cell / 2;
      el.style.left = Math.max(w / 2 + 4, Math.min(boardPx - w / 2 - 4, cx)) + "px";
    }
    // hold at full opacity in the middle instead of fading the whole way -- the old curve
    // was only fully visible for an instant, which is why the multipliers went unread
    const a = el.animate(
      [ {opacity:0, transform:"translate(-50%,-30%) scale(.7)"},
        {opacity:1, transform:"translate(-50%,-88%) scale(1.12)", offset:.16},
        {opacity:1, transform:"translate(-50%,-98%) scale(1)",    offset:.62},
        {opacity:0, transform:"translate(-50%,-140%) scale(.98)"} ],
      { duration: 1250, easing: "cubic-bezier(.2,.8,.2,1)" });
    a.onfinish = () => el.remove();
  }
  // persistent streak badge near the score; pulses on gain, hides at ×1
  function updateStreakBadge() {
    const mult = streakMult();
    // one badge per top-bar variant; whichever box is visible shows it
    for (const id of ["streak-badge", "streak-badge2"]) {
      const b = document.getElementById(id);
      if (!b) continue;
      if (mult > 1) {
        b.textContent = `🔥 ×${mult.toFixed(1)}`;
        b.classList.add("on");
        b.animate([{transform:"scale(1.35)"},{transform:"scale(1)"}], {duration:180, easing:"ease-out"});
      } else {
        b.textContent = "";
        b.classList.remove("on");
      }
    }
  }

  // ---- render loop ----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  // ---- fruit art (each color index = a distinct fruit silhouette) ----
  function leaf(lx, ly, s, rot) {
    ctx.save();
    ctx.translate(lx, ly); ctx.rotate(rot);
    ctx.fillStyle = "#4bbf6b";
    ctx.beginPath(); ctx.ellipse(0, 0, s, s * 0.5, 0, 0, PI2); ctx.fill();
    ctx.restore();
  }
  function gloss(cx, cy, rad) {
    ctx.save();
    ctx.globalAlpha = 0.35; ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.ellipse(cx - rad*0.32, cy - rad*0.34, rad*0.34, rad*0.22, -0.6, 0, PI2); ctx.fill();
    ctx.restore();
  }
  function stem(cx, cy, rad) {
    ctx.strokeStyle = "#7a5b3a"; ctx.lineWidth = rad*0.16; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(cx, cy - rad*0.85); ctx.lineTo(cx + rad*0.05, cy - rad*1.15); ctx.stroke();
  }
  function drawStar(x, y, r, col) {
    ctx.save();
    ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = r * 1.4;
    ctx.beginPath();
    for (let k = 0; k < 5; k++) {
      const a = -Math.PI/2 + k * PI2/5, a2 = a + PI2/10;
      ctx.lineTo(x + Math.cos(a)*r, y + Math.sin(a)*r);
      ctx.lineTo(x + Math.cos(a2)*r*0.45, y + Math.sin(a2)*r*0.45);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // ---- art -> sprite cache. PNG in assets/ wins; falls back to the inline SVG ----
  function svgDataURL(svg) {
    return "data:image/svg+xml," + encodeURIComponent(svg.replace('width="100%" height="100%"', 'width="256" height="256"'));
  }
  // try assets_new/<file> first, then assets/<file>, then the inline SVG fallback
  function loadArtImg(file, svg, onReady) {
    const img = new Image();
    let stage = 0;
    const tryNext = () => {
      stage++;
      if (stage === 1) img.src = "assets_new/" + file;
      else if (stage === 2) img.src = "assets/" + file;
      else { img.onerror = null; img.src = svgDataURL(svg); }
    };
    img.onload = onReady;
    img.onerror = tryNext;
    tryNext();
    return img;
  }
  function loadFruits() {   // (re)load the active fruit set into sprite cache
    fruitImg.length = 0; fruitSprite = [];
    for (let i = 0; i < FRUIT_SVG.length; i++) {
      if (!FRUIT_SVG[i]) continue;
      fruitImg[i] = loadArtImg(`fruit${i}.png`, FRUIT_SVG[i], () => { buildFruitSprite(i); dirty = true; });
    }
    dirty = true;
  }
  function loadFruitArt() {
    loadFruits();
    birdImg = loadArtImg("bird.png", SPARROW_SVG, () => { dirty = true; });
    bombImg = loadArtImg("bomb.png", BOMB_SVG, () => { dirty = true; });
    lineImg = loadArtImg("line.png", LINE_SVG, () => { dirty = true; });
    starImg = loadArtImg("star.png", STAR_SVG, () => { dirty = true; });
    [[1, BRICK1_SVG], [2, BRICK2_SVG], [3, BRICK3_SVG]].forEach(([hpv, svg]) => {
      brickImg[hpv] = loadArtImg(`brick${hpv}.png`, svg, () => { dirty = true; });
    });
  }
  const birdReady = () => birdImg && birdImg.complete && birdImg.naturalWidth;
  const bombReady = () => bombImg && bombImg.complete && bombImg.naturalWidth;
  const lineReady = () => lineImg && lineImg.complete && lineImg.naturalWidth;
  const starReady = () => starImg && starImg.complete && starImg.naturalWidth;
  function buildFruitSprite(i) {
    const img = fruitImg[i];
    if (!img || !img.complete || !img.naturalWidth || !cell) return;
    const S = Math.max(1, Math.round(cell * dpr));
    const cv = document.createElement("canvas");
    cv.width = S; cv.height = S;
    cv.getContext("2d").drawImage(img, 0, 0, S, S);
    fruitSprite[i] = cv;
    drawNextPreview();   // refresh preview if the queued fruit just got its art
  }
  function rebuildSprites() { for (let i = 0; i < FRUIT_SVG.length; i++) buildFruitSprite(i); }

  // draw a fruit filling a box of side S — uses cached SVG sprite if present, else procedural
  function fruitVisual(kind, cx, cy, S) {
    const sp = fruitSprite[kind];
    if (sp) ctx.drawImage(sp, cx - S/2, cy - S/2, S, S);
    else drawFruit(kind, cx, cy, S * 0.34);   // procedural draws ~0.34*box radius
  }

  function drawFruit(kind, cx, cy, rad) {
    const col = COLORS[kind] || "#fff";
    ctx.save();
    ctx.fillStyle = col;

    if (kind === 0) {                     // cherry — two berries + stems
      ctx.strokeStyle = "#7a5b3a"; ctx.lineWidth = rad*0.12; ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(cx, cy - rad*0.9);
      ctx.quadraticCurveTo(cx - rad*0.5, cy - rad*0.5, cx - rad*0.45, cy - rad*0.05);
      ctx.moveTo(cx, cy - rad*0.9);
      ctx.quadraticCurveTo(cx + rad*0.5, cy - rad*0.5, cx + rad*0.45, cy - rad*0.05);
      ctx.stroke();
      ctx.fillStyle = col;
      const rr = rad*0.52;
      ctx.beginPath(); ctx.arc(cx - rad*0.42, cy + rad*0.35, rr, 0, PI2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + rad*0.42, cy + rad*0.35, rr, 0, PI2); ctx.fill();
      ctx.shadowBlur = 0;
      gloss(cx - rad*0.42, cy + rad*0.35, rr); gloss(cx + rad*0.42, cy + rad*0.35, rr);
    } else if (kind === 1) {              // blueberry — round + calyx star
      ctx.beginPath(); ctx.arc(cx, cy, rad, 0, PI2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = "rgba(0,0,0,.28)"; ctx.lineWidth = rad*0.08; ctx.lineCap = "round";
      for (let k = 0; k < 5; k++) {
        const a = -Math.PI/2 + k * PI2/5;
        ctx.beginPath(); ctx.moveTo(cx, cy - rad*0.3);
        ctx.lineTo(cx + Math.cos(a)*rad*0.42, cy - rad*0.3 + Math.sin(a)*rad*0.18); ctx.stroke();
      }
      gloss(cx, cy, rad);
    } else if (kind === 2) {              // pear — teardrop + stem/leaf
      ctx.beginPath();
      ctx.moveTo(cx, cy - rad);
      ctx.bezierCurveTo(cx - rad*0.55, cy - rad*0.75, cx - rad*0.72, cy + rad*0.35, cx, cy + rad);
      ctx.bezierCurveTo(cx + rad*0.72, cy + rad*0.35, cx + rad*0.55, cy - rad*0.75, cx, cy - rad);
      ctx.fill();
      ctx.shadowBlur = 0;
      stem(cx, cy - rad*0.05, rad); leaf(cx + rad*0.35, cy - rad*0.95, rad*0.38, 0.5);
      gloss(cx, cy + rad*0.1, rad*0.9);
    } else if (kind === 3) {              // lemon — pointed ellipse
      ctx.beginPath(); ctx.ellipse(cx, cy, rad*1.05, rad*0.74, 0, 0, PI2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx - rad*1.02, cy, rad*0.12, 0, PI2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + rad*1.02, cy, rad*0.12, 0, PI2); ctx.fill();
      ctx.shadowBlur = 0; gloss(cx, cy, rad);
    } else if (kind === 4) {              // grapes — cluster
      const rr = rad*0.4;
      const pts = [[0,-0.6],[-0.5,-0.15],[0.5,-0.15],[-0.25,0.35],[0.25,0.35],[0,0.85]];
      for (const [dx, dy] of pts) { ctx.beginPath(); ctx.arc(cx+dx*rad, cy+dy*rad, rr, 0, PI2); ctx.fill(); }
      ctx.shadowBlur = 0; leaf(cx + rad*0.1, cy - rad*0.95, rad*0.4, -0.3);
      gloss(cx - rad*0.25, cy - rad*0.15, rr);
    } else if (kind === 5) {              // plum/gem — rounded diamond
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.PI/4);
      roundRect(-rad*0.72, -rad*0.72, rad*1.44, rad*1.44, rad*0.4); ctx.fill();
      ctx.restore();
      ctx.shadowBlur = 0; gloss(cx, cy, rad*0.95);
    } else {                              // orange — citrus + leaf + navel
      ctx.beginPath(); ctx.arc(cx, cy, rad, 0, PI2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = "rgba(0,0,0,.18)"; ctx.lineWidth = rad*0.06;
      for (let k = 0; k < 6; k++) {
        const a = k * PI2/6;
        ctx.beginPath(); ctx.moveTo(cx + rad*0.9*Math.cos(a), cy + rad*0.9*Math.sin(a));
        ctx.lineTo(cx + rad*0.98*Math.cos(a), cy + rad*0.98*Math.sin(a)); ctx.stroke();
      }
      leaf(cx, cy - rad*0.95, rad*0.4, 0.2); gloss(cx, cy, rad);
    }
    ctx.restore();
  }

  function draw() {
    if (!grid || !glow) { requestAnimationFrame(draw); return; } // not started yet

    // idle-skip: when nothing is animating and no change is pending, don't redraw (saves heat)
    let live = particles.length || birds.length || flares.length || waves.length || links.length
             || floats.length || coinFly.length || coinsShown !== coins
             || shake > 0.3 || flash > 0.01;
    if (!live) for (let r = 0; r < ROWS && !live; r++) for (let c = 0; c < COLS; c++)
      if (glow[r][c] || appear[r][c] > 0 || special[r][c] === "bomb") { live = true; break; }
    if (!dirty && !live) { requestAnimationFrame(draw); return; }
    frame++;   // advance idle-animation clock only while actually drawing
    tickCoins();

    // clear the whole canvas in raw pixels (so shake leaves no smear), keep dpr transform
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.restore();

    // screen shake
    let ox = 0, oy = 0;
    if (shake > 0.3) { ox = (Math.random() - .5) * shake; oy = (Math.random() - .5) * shake; shake *= 0.86; }
    else shake = 0;
    ctx.save(); ctx.translate(ox, oy);

    // board bg
    ctx.fillStyle = "#171a26";
    roundRect(0, 0, boardPx, boardH, 18); ctx.fill();

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const x = pad + c * cell, y = pad + r * cell;
        const g = boardPx * 0.006;
        // empty cell
        ctx.fillStyle = "#262a3d";
        roundRect(x + g, y + g, cell - g*2, cell - g*2, cell*0.22); ctx.fill();

        // bonus zone — drawn on the empty cell, under the fruit, so it reads as the board
        // being marked rather than as another piece sitting on it
        if (zoneCells.size && zoneAt(r, c)) {
          ctx.save();
          const pulse = 0.5 + 0.5 * Math.sin(frame * 0.05 + (r * 3 + c * 5));
          ctx.fillStyle = zoneCoin ? "#c9a227" : "#3fae6a";
          ctx.globalAlpha = 0.20 + 0.10 * pulse;
          roundRect(x + g, y + g, cell - g*2, cell - g*2, cell*0.22); ctx.fill();
          ctx.globalAlpha = 0.55 + 0.25 * pulse;
          ctx.strokeStyle = zoneCoin ? "#ffd23e" : "#6ee7a0";
          ctx.lineWidth = Math.max(1, cell * 0.045);
          roundRect(x + g*1.6, y + g*1.6, cell - g*3.2, cell - g*3.2, cell*0.20); ctx.stroke();
          ctx.restore();
        }

        // glow (wave passing)
        const gl = glow[r][c];
        if (gl) {
          ctx.save();
          ctx.globalAlpha = gl.t * 0.5;
          ctx.fillStyle = COLORS[gl.c];
          roundRect(x + g, y + g, cell - g*2, cell - g*2, cell*0.22); ctx.fill();
          ctx.restore();
          gl.t -= 0.048;
          if (gl.t <= 0) glow[r][c] = null;
        }

        // a cleared-but-not-yet-popped fruit still sits here
        if (grid[r][c] === -1 && ghost[r][c] !== null && ghost[r][c] >= 0)
          fruitVisual(ghost[r][c], x + cell/2, y + cell/2, cell * 0.88);

        // pop-in animation for newly spawned buds/bricks (scale small -> full)
        let apScale = 1;
        if (appear[r][c] > 0) {
          const a = appear[r][c];
          apScale = 1 - a * a * 0.85;                  // eased grow from ~0.15 to 1
          appear[r][c] = Math.max(0, a - 0.071);
        }

        // brick (wall) — art swaps by HP: 3 full, 2 damaged, 1 nearly broken
        if (grid[r][c] === BRICK) {
          const h = Math.max(1, Math.min(3, hp[r][c]));
          const bim = brickImg[h];
          const S = cell * apScale;
          const cxb = x + cell/2, cyb = y + cell/2;
          if (bim && bim.complete && bim.naturalWidth) {
            ctx.drawImage(bim, cxb - S/2, cyb - S/2, S, S);
          } else {                                       // fallback gray block
            ctx.save();
            ctx.fillStyle = h >= 3 ? "#5b6178" : h === 2 ? "#6a5a52" : "#7a4a4a";
            roundRect(x + g, y + g, cell - g*2, cell - g*2, cell*0.16); ctx.fill();
            ctx.restore();
          }
          continue;
        }

        // fruit / item
        const v = grid[r][c];
        if (v !== -1) {
          const cx = x + cell/2, cy = y + cell/2, rad = cell*0.34 * apScale;
          const sp = special[r][c];
          if (sp === "bird") {           // bird item = just a bird, no fruit under it
            const S = cell * apScale;
            if (birdReady()) ctx.drawImage(birdImg, cx - S/2, cy - S/2, S, S);
            else { ctx.save(); ctx.font = `${cell*0.62*apScale}px serif`; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("🐦", cx, cy); ctx.restore(); }
            continue;
          }
          if (sp === "bomb") {                  // fruit bomb: fruit + lit fuse, wiggling like it'll pop
            const ph = frame * 0.22 + (r * 7 + c * 13);       // per-cell phase offset
            const wob = Math.sin(ph);
            const sc = 1 + 0.06 * wob;                        // squishy scale pulse
            const rot = 0.08 * Math.sin(ph * 0.9 + 1);        // little wobble
            ctx.save();
            ctx.translate(cx, cy); ctx.rotate(rot); ctx.scale(sc, sc); ctx.translate(-cx, -cy);
            fruitVisual(v, cx, cy, cell * apScale);
            ctx.strokeStyle = "#6e4722"; ctx.lineWidth = cell*0.05; ctx.lineCap = "round";
            const fx = cx + rad*0.2, fy = cy - rad*0.78;
            ctx.beginPath(); ctx.moveTo(fx, fy);
            ctx.quadraticCurveTo(fx + rad*0.3, fy - rad*0.5, fx + rad*0.55, fy - rad*0.72); ctx.stroke();
            const sxp = fx + rad*0.55, syp = fy - rad*0.72;
            const spk = cell * 0.12 * (0.8 + 0.35 * Math.abs(wob));  // flickering spark
            drawStar(sxp, syp, spk, "#ffd000");
            ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(sxp, syp, cell*0.035, 0, PI2); ctx.fill();
            ctx.restore();
            continue;
          }
          if ((sp === "lineH" || sp === "lineV" || sp === "lineX") && lineReady()) {
            const S = cell * apScale;
            ctx.save(); ctx.translate(cx, cy);
            if (sp === "lineV") ctx.rotate(Math.PI / 2);
            ctx.drawImage(lineImg, -S/2, -S/2, S, S);
            ctx.restore();
            continue;
          }
          if (sp === "star" && starReady()) {    // golden star icon
            const S = cell * apScale;
            ctx.drawImage(starImg, cx - S/2, cy - S/2, S, S);
            continue;
          }
          ctx.save();
          fruitVisual(v, cx, cy, cell * apScale);    // SVG sprite if available, else procedural
          if (sp === "lineH" || sp === "lineV" || sp === "lineX") {
            // white bars showing the clear direction
            ctx.strokeStyle = "#fff"; ctx.lineWidth = cell*0.07; ctx.lineCap = "round";
            for (const off of [-rad*0.4, 0, rad*0.4]) {
              ctx.beginPath();
              if (sp === "lineH") { ctx.moveTo(cx - rad*0.7, cy + off); ctx.lineTo(cx + rad*0.7, cy + off); }
              else                { ctx.moveTo(cx + off, cy - rad*0.7); ctx.lineTo(cx + off, cy + rad*0.7); }
              ctx.stroke();
            }
          } else if (sp === "star") {
            // white star overlay = the star (constellation) item
            drawStar(cx, cy, rad * 0.7, "#fff");
          }
          ctx.restore();
        }

        // a fruit that spawned carrying a coin wears it on its lower-right
        if (coinCell[r][c] && grid[r][c] >= 0) {
          const bx = x + cell * 0.76, by = y + cell * 0.76, br = cell * 0.15;
          ctx.save();
          ctx.fillStyle = "rgba(0,0,0,.45)";
          ctx.beginPath(); ctx.arc(bx, by, br * 1.28, 0, PI2); ctx.fill();
          ctx.fillStyle = "#ffd23e";
          ctx.beginPath(); ctx.arc(bx, by, br, 0, PI2); ctx.fill();
          ctx.fillStyle = "#fff3b0";
          ctx.beginPath(); ctx.arc(bx - br * 0.26, by - br * 0.3, br * 0.42, 0, PI2); ctx.fill();
          ctx.restore();
        }
      }
    }

    // particles (juice droplets + splash rings)
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      if (p.type === "ring") {
        p.rad += cell * 0.060; p.life -= 0.048;
        if (p.life <= 0) { particles.splice(i,1); continue; }
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life) * 0.6;
        ctx.strokeStyle = p.color; ctx.lineWidth = cell * 0.05 * p.life + 0.5;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.rad, 0, PI2); ctx.stroke();
        ctx.restore();
        continue;
      }
      p.x += p.vx; p.y += p.vy; p.vy += 0.120; p.vx *= 0.99; p.life -= 0.026;
      if (p.life <= 0) { particles.splice(i,1); continue; }
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r || cell*0.08, 0, PI2); ctx.fill();
      ctx.restore();
    }

    // coins arcing from the cell that dropped them up toward the HUD chip
    if (coinFly.length) {
      const tx = coinTargetX(), ty = -cell * 0.15;
      ctx.save();
      for (let i = coinFly.length - 1; i >= 0; i--) {
        const cf = coinFly[i];
        cf.t += 0.028;
        if (cf.t >= 1) { coinFly.splice(i, 1); continue; }
        if (cf.t <= 0) continue;                                  // staggered start
        const e = cf.t * cf.t * (3 - 2 * cf.t);                   // smoothstep
        const x = cf.sx + (tx - cf.sx) * e;
        const y = cf.sy + (ty - cf.sy) * e - Math.sin(e * Math.PI) * cell * cf.lift;
        const rad = cell * 0.15 * (1 - e * 0.35);
        ctx.globalAlpha = cf.t > 0.82 ? (1 - cf.t) / 0.18 : 1;
        ctx.fillStyle = "#ffd23e";
        ctx.beginPath(); ctx.arc(x, y, rad, 0, PI2); ctx.fill();
        ctx.fillStyle = "#fff3b0";
        ctx.beginPath(); ctx.arc(x - rad * 0.25, y - rad * 0.28, rad * 0.42, 0, PI2); ctx.fill();
      }
      ctx.restore();
    }

    // tutorial spotlight: dim the board, then cut a bright ring around the one cell that
    // will respond. Drawn here rather than as DOM so it tracks the grid at any board size.
    if (tut && tut.target) {
      const [tr, tc] = tut.target;
      ctx.save();
      ctx.fillStyle = "rgba(8,9,15,.62)";
      roundRect(0, 0, boardPx, boardH, 18); ctx.fill();
      const x = pad + tc * cell, y = pad + tr * cell, g = boardPx * 0.006;
      ctx.globalCompositeOperation = "destination-out";
      roundRect(x + g, y + g, cell - g*2, cell - g*2, cell*0.22); ctx.fill();
      ctx.globalCompositeOperation = "source-over";
      const pulse = 0.5 + 0.5 * Math.sin(frame * 0.09);
      ctx.strokeStyle = "#ffd23e";
      ctx.globalAlpha = 0.65 + 0.35 * pulse;
      ctx.lineWidth = Math.max(2, cell * 0.06);
      roundRect(x + g, y + g, cell - g*2, cell - g*2, cell*0.22); ctx.stroke();
      ctx.restore();
      dirty = true;                        // keep the pulse alive
    }

    // per-fruit score pops
    if (floats.length) {
      ctx.save();
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.font = `800 ${Math.round(cell * 0.42)}px Maplestory, system-ui, sans-serif`;
      ctx.lineJoin = "round";
      for (let i = floats.length - 1; i >= 0; i--) {
        const fl2 = floats[i];
        fl2.t += 0.030;
        if (fl2.t >= 1) { floats.splice(i, 1); continue; }
        const rise = -cell * 0.6 * (1 - (1 - fl2.t) * (1 - fl2.t));   // ease-out drift up
        const grow = Math.min(1, fl2.t * 6);
        ctx.globalAlpha = fl2.t < 0.10 ? fl2.t / 0.10 : Math.max(0, (1 - (fl2.t - 0.10) / 0.90) ** 0.6);
        ctx.save();
        ctx.translate(fl2.x, fl2.y + rise);
        ctx.scale(0.7 + 0.4 * grow, 0.7 + 0.4 * grow);
        ctx.lineWidth = cell * 0.09; ctx.strokeStyle = "rgba(0,0,0,.6)";
        ctx.strokeText(fl2.text, 0, 0);                                // dark outline for contrast
        ctx.fillStyle = fl2.color; ctx.fillText(fl2.text, 0, 0);
        ctx.restore();
      }
      ctx.restore();
    }

    // line-clear waves — a ripple rolls out from the item along the row/col
    for (let i = waves.length - 1; i >= 0; i--) {
      const w = waves[i]; w.t += 0.019;            // roll
      if (w.t >= 1) { waves.splice(i, 1); continue; }
      const span = w.type === "h" ? COLS : ROWS;   // cells this ripple travels across
      const front = w.t * (span + 3);              // wave front distance from origin
      ctx.save();
      ctx.fillStyle = COLORS[w.color] || "#fff";
      for (let k = 0; k < span; k++) {
        const dist = Math.abs(k - w.origin);
        const behind = front - dist;               // how long since front passed this cell
        if (behind <= 0) continue;
        const amp = Math.max(0, 1 - behind * 0.26); // longer wave train
        if (amp <= 0) continue;
        const off = Math.sin(behind * 1.5) * cell * 0.45 * amp;  // taller, longer ripple
        let x, y;
        if (w.type === "h") { const p = cellCenter(w.fixed, k); x = p[0]; y = p[1] + off; }
        else                { const p = cellCenter(k, w.fixed); x = p[0] + off; y = p[1]; }
        ctx.globalAlpha = amp * 0.85;
        ctx.beginPath(); ctx.arc(x, y, cell * 0.36 * amp, 0, PI2); ctx.fill();
      }
      ctx.restore();
    }

    // item flares — fruit silhouette pops to full fast, HOLDS, then fades; ring expands out
    for (let i = flares.length - 1; i >= 0; i--) {
      const fl = flares[i]; fl.t += 0.019;
      if (fl.t >= 1) { flares.splice(i, 1); continue; }
