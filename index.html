<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Bloom — 번짐</title>
<style>
  :root {
    --bg: #0f1018;
    --panel: #171a26;
    --cell: #1e2130;
    --text: #e8eaf2;
    --muted: #8b90a6;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: radial-gradient(120% 100% at 50% 0%, #1a1d2e 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    overflow: hidden; user-select: none;
    display: flex; flex-direction: column; align-items: center;
  }
  #top {
    width: 100%; max-width: 520px; padding: 14px 18px 6px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .score-box { display: flex; flex-direction: column; }
  .score-label { font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  .score-val { font-size: 26px; font-weight: 800; line-height: 1; margin-top: 2px; }
  #next-wrap { display: flex; flex-direction: column; align-items: center; }
  #next-dot {
    width: 34px; height: 34px; border-radius: 50%; margin-top: 4px;
    box-shadow: 0 0 16px currentColor; transition: color .2s, background .2s;
  }
  #stats {
    width: 100%; max-width: 520px; padding: 4px 18px 0;
    display: flex; align-items: center; gap: 8px;
  }
  .chip {
    background: var(--panel); border-radius: 999px; padding: 4px 10px;
    font-size: 12px; color: var(--muted); white-space: nowrap;
  }
  .chip b { color: var(--text); font-weight: 800; }
  #danger-label { margin-left: auto; font-size: 12px; font-weight: 800; color: #ff5a5f; }
  #dangerbar {
    width: 100%; max-width: 520px; padding: 0; height: 8px; margin: 6px auto 0;
    background: #1e2130; border-radius: 999px; overflow: hidden;
  }
  #dangerfill { height: 100%; width: 0%; background: #43d17a;
    border-radius: 999px; transition: width .25s, background .25s; }
  #stage-wrap { position: relative; margin-top: 8px; }
  canvas { display: block; border-radius: 18px; touch-action: none; }
  #combo {
    position: absolute; left: 50%; top: 42%; transform: translate(-50%,-50%);
    font-size: 40px; font-weight: 900; pointer-events: none; opacity: 0;
    text-shadow: 0 2px 20px rgba(0,0,0,.6);
  }
  #hint { color: var(--muted); font-size: 13px; margin-top: 10px; height: 16px; }
  #overlay {
    position: fixed; inset: 0; background: rgba(10,11,18,.82); backdrop-filter: blur(6px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center; padding: 24px; z-index: 10;
  }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: 44px; margin: 0; font-weight: 900; letter-spacing: -1px;
    background: linear-gradient(90deg,#ff5a7a,#ffc93c,#43d17a,#4d8bff);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  #overlay p { margin: 0; color: var(--muted); max-width: 300px; line-height: 1.5; font-size: 14px; }
  #overlay .big { font-size: 20px; color: var(--text); font-weight: 700; }
  button {
    margin-top: 8px; padding: 14px 34px; font-size: 17px; font-weight: 800;
    border: none; border-radius: 999px; color: #12131a; cursor: pointer;
    background: linear-gradient(90deg,#ffc93c,#43d17a);
    box-shadow: 0 8px 24px rgba(67,209,122,.35);
  }
  button:active { transform: scale(.97); }
</style>
</head>
<body>
  <div id="top">
    <div class="score-box">
      <span class="score-label">점수</span>
      <span class="score-val" id="score">0</span>
    </div>
    <div class="score-box" style="text-align:right">
      <span class="score-label">최고</span>
      <span class="score-val" id="best" style="font-size:20px;color:var(--muted)">0</span>
    </div>
    <div id="next-wrap">
      <span class="score-label">다음 색</span>
      <div id="next-dot"></div>
    </div>
  </div>

  <div id="stats">
    <span class="chip">👆 <b id="st-touch">0</b></span>
    <span class="chip">⬜ <b id="st-empty">64</b></span>
    <span class="chip">➕ <b id="st-spawn">2</b></span>
    <span id="danger-label"></span>
  </div>
  <div id="dangerbar"><div id="dangerfill"></div></div>

  <div id="stage-wrap">
    <canvas id="game"></canvas>
    <div id="combo"></div>
  </div>
  <div id="hint">빈 칸을 탭해 색을 퍼뜨리세요</div>

  <div id="overlay">
    <h1>Bloom</h1>
    <p><b>빈 칸</b>에 다음 색을 놓으면 <b>주변 3×3</b>이 터집니다.<br/>
       같은 색이 맞붙어 있으면 <b>연쇄</b>로 우르르! 다른 색은 벽이에요.<br/>
       연속으로 성공할수록 점수 <b>배수</b>가 올라갑니다. 헛방이면 리셋!<br/>
       터뜨린 개수로 아이템: <b>4</b>🐦 · <b>5</b>↔️ · <b>6</b>💣 · <b>7</b>🌟<br/>
       아이템 봉오리는 <b>탭</b>하거나 <b>주변이 터지면</b> 발동!</p>
    <div class="big" id="ov-msg"></div>
    <button id="start-btn">시작하기</button>
  </div>

<script>
(() => {
  "use strict";

  // ---- config ----
  const N = 8;                 // grid size
  // full palette (7). Only the first activeColors() are in play, growing with score.
  const COLORS = ["#ff5a7a", "#4d8bff", "#43d17a", "#ffc93c", "#a66cff", "#2ee6d6", "#ff8a3c"];
  const BASE_COLORS = 4;       // colors in play at score 0
  const MAX_COLORS = 7;        // cap
  const START_BUDS = 10;
  const SPAWN_BASE = 2;        // buds spawned per move at score 0
  const SPAWN_MAX = 5;         // cap
  // one staged difficulty step per MILESTONE_STEP points, cycling:
  //   brick(+HP) -> +1 color -> +1 spawn -> brick(+HP) -> ...
  const MILESTONE_STEP = 2000; // TEST value; raise (e.g. 8000) for release
  const WAVE_STEP_MS = 70;     // time between chain steps
  const PI2 = Math.PI * 2;
  const SHAKE_MAX = 16;        // screen-shake cap (px)
  const BURST_RADIUS = 1;      // 1 = 3x3 burst (Chebyshev). items can raise this later
  const MAX_MULT = 5;          // streak multiplier cap
  const BIRD_THRESHOLD = 4;    // pop this many (but < line) -> a bird
  const LINE_THRESHOLD = 5;    // -> a line bud (clears a row/col)
  const BOMB_THRESHOLD = 6;    // -> a bomb bud (5x5 blast)
  const BOMB_RADIUS = 2;       // bomb blast = 5x5 (Chebyshev 2)
  const STAR_THRESHOLD = 7;    // -> a star bud (color bomb + constellation)
  const BIRD_SCORE = 20;       // score for each fruit a bird eats
  const BRICK = -2;            // grid value for a brick (wall; only items can clear it)
  const BRICK_EVERY = 5;       // one brick spawns every N touches once unlocked

  // ---- state ----
  let grid;                    // grid[r][c] = colorIndex | -1 (empty) | BRICK
  let nextColor;
  let score, best, streak;     // streak = consecutive successful taps
  let touchCount;              // total taps this game
  let running = false;
  let busy = false;            // wave animating -> block input
  let particles = [];
  let birds = [];             // {sr,sc,tr,tc,t} bird flies to a junk fruit and eats it
  let flares = [];            // {cx,cy,kind,maxR,t} item explosion: growing fruit silhouette
  let waves = [];             // {type:'h'|'v', fixed, origin, color, t} line-clear ripple wave
  let links = [];             // {nodes,color,prog,reached,done} star one-stroke constellation
  let shake = 0;              // screen-shake magnitude
  let flash = 0;              // white screen flash (0..1) for the star 팡
  let dirty = true;           // redraw needed; when idle we skip drawing to save battery/heat
  let glow;                    // glow[r][c] = {c: colorIdx, t: 0..1}
  let special;                 // special[r][c] = null | "bomb" | "lineH" | "lineV" | "star"
  let hp;                      // hp[r][c] = brick health (only when grid === BRICK)
  let appear;                  // appear[r][c] = 1..0 pop-in animation for newly spawned cells

  // ---- canvas / layout ----
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  let cell, pad, dpr, boardPx;

  function layout() {
    const maxW = Math.min(window.innerWidth - 24, 520, window.innerHeight - 220);
    boardPx = Math.max(260, maxW);
    dpr = Math.min(2, window.devicePixelRatio || 1);  // cap DPR -> fewer pixels, less heat
    dirty = true;
    canvas.style.width = boardPx + "px";
    canvas.style.height = boardPx + "px";
    canvas.width = boardPx * dpr;
    canvas.height = boardPx * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    pad = boardPx * 0.02;
    cell = (boardPx - pad * 2) / N;
  }
  window.addEventListener("resize", layout);

  // ---- helpers ----
  const best0 = () => { best = +(localStorage.getItem("bloom_best") || 0); };
  best0();
  best = +(localStorage.getItem("bloom_best") || 0);

  function emptyGrid() {
    grid = Array.from({length: N}, () => Array(N).fill(-1));
    glow = Array.from({length: N}, () => Array(N).fill(null));
    special = Array.from({length: N}, () => Array(N).fill(null)); // item type per cell
    hp = Array.from({length: N}, () => Array(N).fill(0));         // brick health
    appear = Array.from({length: N}, () => Array(N).fill(0));     // spawn pop-in
  }
  function randInt(n) { return Math.floor(Math.random() * n); }
  // staged difficulty: milestone m unlocks, in order, brick / color / spawn (cycling)
  function milestone() { return Math.floor(score / MILESTONE_STEP); }
  function brickHpLevel() { return Math.min(3, Math.floor((milestone() + 2) / 3)); } // 0 = none, else 1..3
  function activeColors() { return Math.min(MAX_COLORS, BASE_COLORS + Math.floor((milestone() + 1) / 3)); }
  function spawnCount() { return Math.min(SPAWN_MAX, SPAWN_BASE + Math.floor(milestone() / 3)); }
  function addShake(a) { shake = Math.min(SHAKE_MAX, shake + a); }

  function emptyCells() {
    const out = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++)
      if (grid[r][c] === -1) out.push([r, c]);
    return out;
  }
  function filledCount() {
    let n = 0;
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (grid[r][c] !== -1) n++;
    return n;
  }

  function spawnBuds(k) {
    for (let i = 0; i < k; i++) {
      const e = emptyCells();
      if (!e.length) return;
      const [r, c] = e[randInt(e.length)];
      grid[r][c] = randInt(activeColors()); appear[r][c] = 1;
    }
  }

  function spawnBrick(level) {
    const e = emptyCells();
    if (!e.length) return;
    const [r, c] = e[randInt(e.length)];
    grid[r][c] = BRICK; special[r][c] = null; hp[r][c] = level; appear[r][c] = 1;
  }

  function pickNext() {
    nextColor = randInt(activeColors());
    const dot = document.getElementById("next-dot");
    dot.style.background = COLORS[nextColor];
    dot.style.color = COLORS[nextColor];
  }

  // ---- game start ----
  function start() {
    emptyGrid();
    score = 0; streak = 0; touchCount = 0; particles = []; birds = []; flares = []; waves = []; links = []; shake = 0; flash = 0; dirty = true;
    spawnBuds(START_BUDS);
    pickNext();
    updateHUD();
    running = true; busy = false;
    document.getElementById("overlay").classList.add("hidden");
    document.getElementById("hint").textContent = "같은 색 봉오리 옆(3×3)에 놓아 터뜨리세요";
  }

  function updateHUD() {
    document.getElementById("score").textContent = score;
    document.getElementById("best").textContent = best;
    document.getElementById("st-touch").textContent = touchCount;
    document.getElementById("st-empty").textContent = emptyCells().length;
    document.getElementById("st-spawn").textContent = spawnCount();
    const ratio = filledCount() / (N * N);          // fill vs the whole board
    const fill = document.getElementById("dangerfill");
    fill.style.width = (ratio * 100).toFixed(0) + "%";
    fill.style.background = ratio < 0.7 ? "#43d17a" : ratio < 0.88 ? "#ffc93c" : "#ff5a5f";
    document.getElementById("danger-label").textContent = ratio >= 0.88 ? "⚠️ 아웃 위험!" : "";
  }

  // ---- input ----
  function cellFromEvent(ev) {
    const rect = canvas.getBoundingClientRect();
    const x = (ev.clientX - rect.left - pad) / cell;
    const y = (ev.clientY - rect.top - pad) / cell;
    const c = Math.floor(x), r = Math.floor(y);
    if (r < 0 || r >= N || c < 0 || c >= N) return null;
    return [r, c];
  }

  canvas.addEventListener("pointerdown", (ev) => {
    ev.preventDefault();
    if (!running || busy) return;
    const rc = cellFromEvent(ev);
    if (!rc) return;
    const [r, c] = rc;
    if (grid[r][c] === -1) plant(r, c, nextColor);        // empty -> place next color
    else if (special[r][c]) tapItem(r, c);                // item bud -> trigger it
    // normal fruit or brick -> nothing
  });

  // ---- the bloom burst ----
  // Rule 1: placing on empty bursts a (2R+1)x(2R+1) box around itself; same-color
  //         buds inside pop, and each popped bud re-bursts the same box (chain).
  // Rule 2: different colors are walls — the burst never pops or passes them.
  function plant(r0, c0, color) {
    touchCount++;
    grid[r0][c0] = color;            // the placed ball (removed later if it clears)
    special[r0][c0] = null;
    const R = BURST_RADIUS;
    const visited = Array.from({length: N}, () => Array(N).fill(false));
    visited[r0][c0] = true;
    // frontier items {r,c,mode,color}: "color" = same-color flood, "blast" = item-cleared
    const frontier = seedsAround(r0, c0, R, color, visited).map(([r, c]) => ({ r, c, mode: "color", color }));
    flashBox(r0, c0, R, color);
    runChain(r0, c0, color, visited, frontier, true);
  }

  // tap an existing item bud to trigger it directly (counts as a turn)
  function tapItem(r0, c0) {
    touchCount++;
    const color = grid[r0][c0];
    const visited = Array.from({length: N}, () => Array(N).fill(false));
    runChain(r0, c0, color, visited, [{ r: r0, c: c0, mode: "blast", color }], false);
  }

  // run the chain from an initial frontier; placement=true means a ball was placed
  function runChain(r0, c0, color, visited, initialFrontier, placement) {
    busy = true; dirty = true;
    const R = BURST_RADIUS;
    let frontier = initialFrontier;
    let popped = 0;          // total pops (for score)
    let chainPopped = 0;     // only your own color-chain pops (for item generation)
    const hitBricks = new Set();   // bricks adjacent to a pop -> chip 1 HP
    function step() {
      if (!frontier.length) {
        let broke = 0;
        hitBricks.forEach(key => {
          const br = (key / N) | 0, bc = key % N;
          if (grid[br][bc] !== BRICK) return;   // already destroyed by a blast
          hp[br][bc]--;
          glow[br][bc] = { c: 0, t: 0.9 };
          if (hp[br][bc] <= 0) { grid[br][bc] = -1; special[br][bc] = null; burst(br, bc, "#9aa0b5"); broke++; }
        });
        if (broke) score += broke * 15;
        finishBurst(r0, c0, color, popped, chainPopped, placement);
        return;
      }
      const next = [];
      for (const it of frontier) {
        const { r, c, mode } = it;
        const cellColor = grid[r][c];
        const sp = special[r][c];
        const vis = cellColor < 0 ? it.color : cellColor;
        grid[r][c] = -1; special[r][c] = null;
        popped++;
        if (mode === "color") chainPopped++;   // items only reward your own matching
        burst(r, c, vis);
        glow[r][c] = { c: vis, t: 1 };

        // neighbors: chip bricks, and trigger any adjacent item (any color) via this pop
        for (let dr = -1; dr <= 1; dr++)
          for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            const nr = r + dr, nc = c + dc;
            if (nr < 0 || nr >= N || nc < 0 || nc >= N) continue;
            if (grid[nr][nc] === BRICK) hitBricks.add(nr * N + nc);
            else if (special[nr][nc] && !visited[nr][nc]) {   // adjacent item -> detonate it
              visited[nr][nc] = true;
              next.push({ r: nr, c: nc, mode: "blast", color: grid[nr][nc] });
            }
          }

        // same-color flood continues through color-mode pops (matching this item's color)
        if (mode === "color")
          for (const [nr, nc] of seedsAround(r, c, R, it.color, visited))
            next.push({ r: nr, c: nc, mode: "color", color: it.color });

        // ---- item detonations (fire regardless of how this cell was popped) ----
        if (sp === "bomb") {                     // 5x5 blast, ignores color walls
          flashBox(r, c, BOMB_RADIUS, cellColor);
          const [fx, fy] = cellCenter(r, c);
          flares.push({ cx: fx, cy: fy, kind: cellColor < 0 ? it.color : cellColor, maxR: cell * 2.8, t: 0 });
          addShake(11);
          for (const [nr, nc] of budsAround(r, c, BOMB_RADIUS, visited))
            next.push({ r: nr, c: nc, mode: "blast", color: cellColor });
        } else if (sp === "lineH" || sp === "lineV") { // clears whole row / column
          flashLine(r, c, sp);
          waves.push({ type: sp === "lineH" ? "h" : "v",
                       fixed: sp === "lineH" ? r : c, origin: sp === "lineH" ? c : r,
                       color: cellColor < 0 ? it.color : cellColor, t: 0 });
          addShake(8);
          for (const [nr, nc] of lineCells(r, c, sp, visited))
            next.push({ r: nr, c: nc, mode: "blast", color: cellColor });
        } else if (sp === "star") {           // COLOR BOMB: connect-the-dots then 팡
          flashBox(r, c, R, cellColor);
          addShake(5);
          const target = mode === "color" ? it.color : mostCommonColor();
          // collect same-color cells, clear them NOW (logic) but hold them as ghosts (visual)
          const tCells = [];
          if (target >= 0)
            for (let rr = 0; rr < N; rr++)
              for (let cc = 0; cc < N; cc++)
                if (!visited[rr][cc] && grid[rr][cc] === target) {
                  visited[rr][cc] = true;
                  grid[rr][cc] = -1; special[rr][cc] = null; popped++;
                  tCells.push([rr, cc]);
                }
          // order nearest-neighbor from the star origin = a one-stroke path
          const path = [[r, c]];
          let cur = [r, c];
          while (tCells.length) {
            let bi = 0, bd = Infinity;
            for (let k = 0; k < tCells.length; k++) {
              const dr = tCells[k][0]-cur[0], dc = tCells[k][1]-cur[1], d = dr*dr+dc*dc;
              if (d < bd) { bd = d; bi = k; }
            }
            cur = tCells.splice(bi, 1)[0]; path.push(cur);
          }
          links.push({ nodes: path, color: target, prog: 0, reached: 0, done: false });
          // small local splash so the star itself pops immediately
          for (const [nr, nc] of budsAround(r, c, R, visited))
            next.push({ r: nr, c: nc, mode: "blast", color: grid[nr][nc] });
        } else if (sp === "bird") {
          spawnBird(r, c);          // bird flies off from here to a target
        }
      }
      frontier = next;
      setTimeout(step, WAVE_STEP_MS);
    }
    step();
  }

  // same-color plain fruits within Chebyshev radius R (items are NOT color-matched)
  function seedsAround(r, c, R, color, visited) {
    const out = [];
    for (let dr = -R; dr <= R; dr++) {
      for (let dc = -R; dc <= R; dc++) {
        if (dr === 0 && dc === 0) continue;
        const nr = r + dr, nc = c + dc;
        if (nr < 0 || nr >= N || nc < 0 || nc >= N || visited[nr][nc]) continue;
        if (grid[nr][nc] === color && special[nr][nc] === null) {
          visited[nr][nc] = true; out.push([nr, nc]);
        }
      }
    }
    return out;
  }

  // ANY bud within R (used by bomb/star blast — ignores color walls)
  function budsAround(r, c, R, visited) {
    const out = [];
    for (let dr = -R; dr <= R; dr++) {
      for (let dc = -R; dc <= R; dc++) {
        if (dr === 0 && dc === 0) continue;
        const nr = r + dr, nc = c + dc;
        if (nr < 0 || nr >= N || nc < 0 || nc >= N || visited[nr][nc]) continue;
        if (grid[nr][nc] !== -1) { visited[nr][nc] = true; out.push([nr, nc]); }
      }
    }
    return out;
  }

  // all buds in the row (lineH) or column (lineV), marking them visited
  function lineCells(r, c, type, visited) {
    const out = [];
    if (type === "lineH") {
      for (let cc = 0; cc < N; cc++) {
        if (cc === c || visited[r][cc]) continue;
        if (grid[r][cc] !== -1) { visited[r][cc] = true; out.push([r, cc]); }
      }
    } else {
      for (let rr = 0; rr < N; rr++) {
        if (rr === r || visited[rr][c]) continue;
        if (grid[rr][c] !== -1) { visited[rr][c] = true; out.push([rr, c]); }
      }
    }
    return out;
  }

  function flashLine(r, c, type) {
    if (type === "lineH") {
      for (let cc = 0; cc < N; cc++) if (grid[r][cc] === -1) glow[r][cc] = { c: 3, t: 0.8 };
    } else {
      for (let rr = 0; rr < N; rr++) if (grid[rr][c] === -1) glow[rr][c] = { c: 3, t: 0.8 };
    }
  }

  // most abundant color currently on the board (-1 if empty)
  function mostCommonColor() {
    const cnt = new Array(COLORS.length).fill(0);
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++)
      if (grid[r][c] >= 0) cnt[grid[r][c]]++;
    let bi = -1, bv = 0;
    for (let k = 0; k < cnt.length; k++) if (cnt[k] > bv) { bv = cnt[k]; bi = k; }
    return bi;
  }

  // ---- bird (참새): flies to a random junk fruit and eats it ----
  const cellCenter = (r, c) => [pad + c * cell + cell / 2, pad + r * cell + cell / 2];

  function sameColorNeighbors(r, c) {
    const col = grid[r][c]; let n = 0;
    for (let dr = -1; dr <= 1; dr++)
      for (let dc = -1; dc <= 1; dc++) {
        if (dr === 0 && dc === 0) continue;
        const nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < N && nc >= 0 && nc < N && grid[nr][nc] === col) n++;
      }
    return n;
  }

  // target priority: bricks first, then the most isolated junk fruit, else any fruit
  function chooseBirdTarget(exclude) {
    const bricks = [], buds = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      if (grid[r][c] === -1 || (exclude && exclude[r * N + c])) continue;
      if (grid[r][c] === BRICK) bricks.push([r, c]);
      else buds.push([r, c]);
    }
    if (bricks.length) return bricks[randInt(bricks.length)];   // clear obstacles first
    if (!buds.length) return null;
    const junk = buds.filter(([r, c]) => sameColorNeighbors(r, c) === 0);
    const pool = junk.length ? junk : buds;
    return pool[randInt(pool.length)];
  }

  function spawnBird(fromR, fromC) {
    const t = chooseBirdTarget(null);
    if (!t) return false;
    birds.push({ sr: fromR, sc: fromC, tr: t[0], tc: t[1], t: 0, curve: Math.random() < 0.5 ? -1 : 1 });
    return true;
  }

  function flashBox(r0, c0, R, colorIdx) {
    for (let dr = -R; dr <= R; dr++)
      for (let dc = -R; dc <= R; dc++) {
        const rr = r0 + dr, cc = c0 + dc;
        if (rr >= 0 && rr < N && cc >= 0 && cc < N && grid[rr][cc] === -1)
          glow[rr][cc] = { c: colorIdx < 0 ? 0 : colorIdx, t: 0.7 };
      }
  }

  function finishBurst(r0, c0, color, popped, chainPopped, placement) {
    if (placement) {
      if (popped > 0) {
        grid[r0][c0] = -1;               // success -> placed ball consumed cleanly
        burst(r0, c0, color);
        streak++;
        const cleared = popped + 1;          // include the ball you placed
        const chainCount = chainPopped + 1;  // your color group size, inclusive
        const mult = Math.min(1 + (streak - 1) * 0.5, MAX_MULT);
        const gained = Math.round((cleared * 10 + (cleared - 1) * (cleared - 1) * 5) * mult);
        score += gained;
        showCombo(cleared, gained, mult);
        addShake(Math.min(12, cleared * 0.7));

        // reward: item tier from YOUR color group only (chainCount), not item cascades.
        // items now sit on the board — tap them, or chain into them, to trigger.
        let itemMsg = "";
        if (chainCount >= STAR_THRESHOLD) {
          grid[r0][c0] = color; special[r0][c0] = "star";
          itemMsg = "🌟 별! 탭하거나 주변 폭발로 발동 — 같은 색 별자리 팡";
        } else if (chainCount >= BOMB_THRESHOLD) {
          grid[r0][c0] = color; special[r0][c0] = "bomb";
          itemMsg = "💣 폭탄! 탭하거나 주변 폭발로 발동 — 5×5 대폭발";
        } else if (chainCount >= LINE_THRESHOLD) {
          grid[r0][c0] = color; special[r0][c0] = randInt(2) ? "lineH" : "lineV";
          itemMsg = "↔️ 라인! 탭하거나 주변 폭발로 발동 — 한 줄 청소";
        } else if (chainCount >= BIRD_THRESHOLD) {
          grid[r0][c0] = color; special[r0][c0] = "bird";
          itemMsg = "🐦 참새! 탭하거나 주변 폭발로 발동 — 방해물로 날아가요";
        }
        if (itemMsg) { burst(r0, c0, color); document.getElementById("hint").textContent = itemMsg; }
      } else {
        streak = 0;                      // miss -> placed ball stays as junk, streak resets
      }
      if (grid[r0][c0] !== -1) appear[r0][c0] = 1;  // placed ball (junk/item) pops in too
    } else if (popped > 0) {
      // manual item tap: score the clears, no new item, keep the queued color
      const mult = Math.min(1 + (streak - 1) * 0.5, MAX_MULT);
      const gained = Math.round((popped * 10 + (popped - 1) * (popped - 1) * 5) * mult);
      score += gained;
      showCombo(popped, gained, mult);
      addShake(Math.min(12, popped * 0.7));
    }

    spawnBuds(spawnCount());
    // staged gimmick: once bricks are unlocked, one spawns every few touches at current HP level
    const bLvl = brickHpLevel();
    if (bLvl >= 1 && touchCount % BRICK_EVERY === 0) spawnBrick(bLvl);
    if (placement) pickNext();           // a tap-trigger keeps the queued next color
    if (score > best) { best = score; localStorage.setItem("bloom_best", best); }
    updateHUD();
    dirty = true;

    if (emptyCells().length === 0) {
      // board is completely full -> let the spawned pieces pop in & be seen, then over
      busy = true;
      setTimeout(gameOver, 750);
    } else {
      busy = false;
    }
  }

  function gameOver() {
    running = false; busy = false;
    const ov = document.getElementById("overlay");
    document.getElementById("ov-msg").innerHTML =
      `점수 <b>${score}</b> · 최고 <b>${best}</b>`;
    document.querySelector("#overlay h1").textContent = "게임 오버";
    document.querySelector("#overlay p").innerHTML =
      "판이 가득 찼어요! 색을 잘 배치해 봉오리를 더 많이 터뜨려 보세요.";
    document.getElementById("start-btn").textContent = "다시 하기";
    ov.classList.remove("hidden");
  }

  // ---- juice: particles + combo popup ----
  function burst(r, c, color) {
    const col = typeof color === "number" ? (COLORS[color] || "#fff") : (color || "#fff");
    const cx = pad + c * cell + cell / 2;
    const cy = pad + r * cell + cell / 2;
    // splash ring
    particles.push({ type: "ring", x: cx, y: cy, life: 1, color: col, rad: cell * 0.12 });
    // juice droplets (spray up, then gravity pulls them down)
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * PI2, sp = 1 + Math.random() * 3.2;
      particles.push({
        x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1,
        life: 0.8 + Math.random() * 0.4, color: col, r: cell * (0.04 + Math.random() * 0.09)
      });
    }
  }

  function showCombo(cleared, gained, mult) {
    const el = document.getElementById("combo");
    el.textContent = mult > 1 ? `COMBO ×${mult}   +${gained}` : `+${gained}`;
    el.style.color = "#fff";
    el.animate(
      [ {opacity:0, transform:"translate(-50%,-50%) scale(.6)"},
        {opacity:1, transform:"translate(-50%,-60%) scale(1.15)", offset:.3},
        {opacity:0, transform:"translate(-50%,-80%) scale(1)"} ],
      { duration: 900, easing: "ease-out" });
  }

  // ---- render loop ----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  // ---- fruit art (each color index = a distinct fruit silhouette) ----
  function leaf(lx, ly, s, rot) {
    ctx.save();
    ctx.translate(lx, ly); ctx.rotate(rot);
    ctx.fillStyle = "#4bbf6b";
    ctx.beginPath(); ctx.ellipse(0, 0, s, s * 0.5, 0, 0, PI2); ctx.fill();
    ctx.restore();
  }
  function gloss(cx, cy, rad) {
    ctx.save();
    ctx.globalAlpha = 0.35; ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.ellipse(cx - rad*0.32, cy - rad*0.34, rad*0.34, rad*0.22, -0.6, 0, PI2); ctx.fill();
    ctx.restore();
  }
  function stem(cx, cy, rad) {
    ctx.strokeStyle = "#7a5b3a"; ctx.lineWidth = rad*0.16; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(cx, cy - rad*0.85); ctx.lineTo(cx + rad*0.05, cy - rad*1.15); ctx.stroke();
  }
  function drawStar(x, y, r, col) {
    ctx.save();
    ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = r * 1.4;
    ctx.beginPath();
    for (let k = 0; k < 5; k++) {
      const a = -Math.PI/2 + k * PI2/5, a2 = a + PI2/10;
      ctx.lineTo(x + Math.cos(a)*r, y + Math.sin(a)*r);
      ctx.lineTo(x + Math.cos(a2)*r*0.45, y + Math.sin(a2)*r*0.45);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawFruit(kind, cx, cy, rad) {
    const col = COLORS[kind] || "#fff";
    ctx.save();
    ctx.fillStyle = col;

    if (kind === 0) {                     // cherry — two berries + stems
      ctx.strokeStyle = "#7a5b3a"; ctx.lineWidth = rad*0.12; ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(cx, cy - rad*0.9);
      ctx.quadraticCurveTo(cx - rad*0.5, cy - rad*0.5, cx - rad*0.45, cy - rad*0.05);
      ctx.moveTo(cx, cy - rad*0.9);
      ctx.quadraticCurveTo(cx + rad*0.5, cy - rad*0.5, cx + rad*0.45, cy - rad*0.05);
      ctx.stroke();
      ctx.fillStyle = col;
      const rr = rad*0.52;
      ctx.beginPath(); ctx.arc(cx - rad*0.42, cy + rad*0.35, rr, 0, PI2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + rad*0.42, cy + rad*0.35, rr, 0, PI2); ctx.fill();
      ctx.shadowBlur = 0;
      gloss(cx - rad*0.42, cy + rad*0.35, rr); gloss(cx + rad*0.42, cy + rad*0.35, rr);
    } else if (kind === 1) {              // blueberry — round + calyx star
      ctx.beginPath(); ctx.arc(cx, cy, rad, 0, PI2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = "rgba(0,0,0,.28)"; ctx.lineWidth = rad*0.08; ctx.lineCap = "round";
      for (let k = 0; k < 5; k++) {
        const a = -Math.PI/2 + k * PI2/5;
        ctx.beginPath(); ctx.moveTo(cx, cy - rad*0.3);
        ctx.lineTo(cx + Math.cos(a)*rad*0.42, cy - rad*0.3 + Math.sin(a)*rad*0.18); ctx.stroke();
      }
      gloss(cx, cy, rad);
    } else if (kind === 2) {              // pear — teardrop + stem/leaf
      ctx.beginPath();
      ctx.moveTo(cx, cy - rad);
      ctx.bezierCurveTo(cx - rad*0.55, cy - rad*0.75, cx - rad*0.72, cy + rad*0.35, cx, cy + rad);
      ctx.bezierCurveTo(cx + rad*0.72, cy + rad*0.35, cx + rad*0.55, cy - rad*0.75, cx, cy - rad);
      ctx.fill();
      ctx.shadowBlur = 0;
      stem(cx, cy - rad*0.05, rad); leaf(cx + rad*0.35, cy - rad*0.95, rad*0.38, 0.5);
      gloss(cx, cy + rad*0.1, rad*0.9);
    } else if (kind === 3) {              // lemon — pointed ellipse
      ctx.beginPath(); ctx.ellipse(cx, cy, rad*1.05, rad*0.74, 0, 0, PI2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx - rad*1.02, cy, rad*0.12, 0, PI2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + rad*1.02, cy, rad*0.12, 0, PI2); ctx.fill();
      ctx.shadowBlur = 0; gloss(cx, cy, rad);
    } else if (kind === 4) {              // grapes — cluster
      const rr = rad*0.4;
      const pts = [[0,-0.6],[-0.5,-0.15],[0.5,-0.15],[-0.25,0.35],[0.25,0.35],[0,0.85]];
      for (const [dx, dy] of pts) { ctx.beginPath(); ctx.arc(cx+dx*rad, cy+dy*rad, rr, 0, PI2); ctx.fill(); }
      ctx.shadowBlur = 0; leaf(cx + rad*0.1, cy - rad*0.95, rad*0.4, -0.3);
      gloss(cx - rad*0.25, cy - rad*0.15, rr);
    } else if (kind === 5) {              // plum/gem — rounded diamond
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.PI/4);
      roundRect(-rad*0.72, -rad*0.72, rad*1.44, rad*1.44, rad*0.4); ctx.fill();
      ctx.restore();
      ctx.shadowBlur = 0; gloss(cx, cy, rad*0.95);
    } else {                              // orange — citrus + leaf + navel
      ctx.beginPath(); ctx.arc(cx, cy, rad, 0, PI2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = "rgba(0,0,0,.18)"; ctx.lineWidth = rad*0.06;
      for (let k = 0; k < 6; k++) {
        const a = k * PI2/6;
        ctx.beginPath(); ctx.moveTo(cx + rad*0.9*Math.cos(a), cy + rad*0.9*Math.sin(a));
        ctx.lineTo(cx + rad*0.98*Math.cos(a), cy + rad*0.98*Math.sin(a)); ctx.stroke();
      }
      leaf(cx, cy - rad*0.95, rad*0.4, 0.2); gloss(cx, cy, rad);
    }
    ctx.restore();
  }

  function draw() {
    if (!grid || !glow) { requestAnimationFrame(draw); return; } // not started yet

    // idle-skip: when nothing is animating and no change is pending, don't redraw (saves heat)
    let live = particles.length || birds.length || flares.length || waves.length || links.length
             || shake > 0.3 || flash > 0.01;
    if (!live) for (let r = 0; r < N && !live; r++) for (let c = 0; c < N; c++)
      if (glow[r][c] || appear[r][c] > 0) { live = true; break; }
    if (!dirty && !live) { requestAnimationFrame(draw); return; }

    // clear the whole canvas in raw pixels (so shake leaves no smear), keep dpr transform
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.restore();

    // screen shake
    let ox = 0, oy = 0;
    if (shake > 0.3) { ox = (Math.random() - .5) * shake; oy = (Math.random() - .5) * shake; shake *= 0.86; }
    else shake = 0;
    ctx.save(); ctx.translate(ox, oy);

    // board bg
    ctx.fillStyle = "#171a26";
    roundRect(0, 0, boardPx, boardPx, 18); ctx.fill();

    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const x = pad + c * cell, y = pad + r * cell;
        const g = boardPx * 0.006;
        // empty cell
        ctx.fillStyle = "#262a3d";
        roundRect(x + g, y + g, cell - g*2, cell - g*2, cell*0.22); ctx.fill();

        // glow (wave passing)
        const gl = glow[r][c];
        if (gl) {
          ctx.save();
          ctx.globalAlpha = gl.t * 0.5;
          ctx.fillStyle = COLORS[gl.c];
          roundRect(x + g, y + g, cell - g*2, cell - g*2, cell*0.22); ctx.fill();
          ctx.restore();
          gl.t -= 0.06;
          if (gl.t <= 0) glow[r][c] = null;
        }

        // pop-in animation for newly spawned buds/bricks (scale small -> full)
        let apScale = 1;
        if (appear[r][c] > 0) {
          const a = appear[r][c];
          apScale = 1 - a * a * 0.85;                  // eased grow from ~0.15 to 1
          appear[r][c] = Math.max(0, a - 0.09);
        }

        // brick (wall) — chipped by adjacent pops, destroyed instantly by items
        if (grid[r][c] === BRICK) {
          ctx.save();
          const cxb = x + cell/2, cyb = y + cell/2;
          ctx.translate(cxb, cyb); ctx.scale(apScale, apScale); ctx.translate(-cxb, -cyb);
          const h = hp[r][c];                          // remaining HP (1..3)
          ctx.fillStyle = h >= 3 ? "#5b6178" : h === 2 ? "#6a5a52" : "#7a4a4a";
          roundRect(x + g, y + g, cell - g*2, cell - g*2, cell*0.16); ctx.fill();
          ctx.strokeStyle = "#33384a"; ctx.lineWidth = cell*0.05;
          const m = cell*0.5;
          ctx.beginPath(); ctx.moveTo(x+g, y+m); ctx.lineTo(x+cell-g, y+m); // brick seams
          ctx.moveTo(x+m, y+g); ctx.lineTo(x+m, y+m); ctx.stroke();
          ctx.fillStyle = "#e8eaf2";                    // remaining HP number
          ctx.font = `bold ${cell*0.32}px sans-serif`;
          ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.fillText(hp[r][c], x + cell/2, y + cell*0.5 + cell*0.02);
          ctx.restore();
          continue;
        }

        // fruit / item
        const v = grid[r][c];
        if (v !== -1) {
          const cx = x + cell/2, cy = y + cell/2, rad = cell*0.34 * apScale;
          const sp = special[r][c];
          if (sp === "bird") {           // bird item = just a bird, no fruit under it
            ctx.save();
            ctx.font = `${cell * 0.62 * apScale}px serif`;
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText("🐦", cx, cy);
            ctx.restore();
            continue;
          }
          ctx.save();
          drawFruit(v, cx, cy, rad);
          if (sp === "bomb") {
            // bold white ring + dark core so it reads as "charged"
            ctx.lineWidth = cell*0.09; ctx.strokeStyle = "#fff";
            ctx.beginPath(); ctx.arc(cx, cy, rad*0.62, 0, PI2); ctx.stroke();
            ctx.fillStyle = "#12131a";
            ctx.beginPath(); ctx.arc(cx, cy, rad*0.3, 0, PI2); ctx.fill();
          } else if (sp === "lineH" || sp === "lineV") {
            // white bars showing the clear direction
            ctx.strokeStyle = "#fff"; ctx.lineWidth = cell*0.07; ctx.lineCap = "round";
            for (const off of [-rad*0.4, 0, rad*0.4]) {
              ctx.beginPath();
              if (sp === "lineH") { ctx.moveTo(cx - rad*0.7, cy + off); ctx.lineTo(cx + rad*0.7, cy + off); }
              else                { ctx.moveTo(cx + off, cy - rad*0.7); ctx.lineTo(cx + off, cy + rad*0.7); }
              ctx.stroke();
            }
          } else if (sp === "star") {
            // white star overlay = the star (constellation) item
            drawStar(cx, cy, rad * 0.7, "#fff");
          }
          ctx.restore();
        }
      }
    }

    // particles (juice droplets + splash rings)
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      if (p.type === "ring") {
        p.rad += cell * 0.07; p.life -= 0.06;
        if (p.life <= 0) { particles.splice(i,1); continue; }
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life) * 0.6;
        ctx.strokeStyle = p.color; ctx.lineWidth = cell * 0.05 * p.life + 0.5;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.rad, 0, PI2); ctx.stroke();
        ctx.restore();
        continue;
      }
      p.x += p.vx; p.y += p.vy; p.vy += 0.14; p.vx *= 0.99; p.life -= 0.03;
      if (p.life <= 0) { particles.splice(i,1); continue; }
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r || cell*0.08, 0, PI2); ctx.fill();
      ctx.restore();
    }

    // line-clear waves — a ripple rolls out from the item along the row/col
    for (let i = waves.length - 1; i >= 0; i--) {
      const w = waves[i]; w.t += 0.024;            // slower roll
      if (w.t >= 1) { waves.splice(i, 1); continue; }
      const front = w.t * (N + 3);                 // wave front distance from origin
      ctx.save();
      ctx.fillStyle = COLORS[w.color] || "#fff";
      for (let k = 0; k < N; k++) {
        const dist = Math.abs(k - w.origin);
        const behind = front - dist;               // how long since front passed this cell
        if (behind <= 0) continue;
        const amp = Math.max(0, 1 - behind * 0.26); // longer wave train
        if (amp <= 0) continue;
        const off = Math.sin(behind * 1.5) * cell * 0.45 * amp;  // taller, longer ripple
        let x, y;
        if (w.type === "h") { const p = cellCenter(w.fixed, k); x = p[0]; y = p[1] + off; }
        else                { const p = cellCenter(k, w.fixed); x = p[0] + off; y = p[1]; }
        ctx.globalAlpha = amp * 0.85;
        ctx.beginPath(); ctx.arc(x, y, cell * 0.36 * amp, 0, PI2); ctx.fill();
      }
      ctx.restore();
    }

    // item flares — fruit silhouette pops to full fast, HOLDS, then fades; ring expands out
    for (let i = flares.length - 1; i >= 0; i--) {
      const fl = flares[i]; fl.t += 0.025;
      if (fl.t >= 1) { flares.splice(i, 1); continue; }
      const grow = Math.min(1, fl.t * 2.4);            // reach full size by ~40%
      const fruitR = fl.maxR * 0.6 * grow * (2 - grow);
      const fade = fl.t < 0.45 ? 1 : (1 - fl.t) / 0.55; // hold bright, then fade
      const ringR = fl.maxR * (fl.t * (2 - fl.t));     // shockwave keeps expanding
      ctx.save();
      ctx.globalAlpha = (1 - fl.t) * 0.5;
      ctx.strokeStyle = COLORS[fl.kind] || "#fff"; ctx.lineWidth = cell * 0.14 * (1 - fl.t) + 0.5;
      ctx.beginPath(); ctx.arc(fl.cx, fl.cy, ringR, 0, PI2); ctx.stroke();
      ctx.restore();
      ctx.save();
      ctx.globalAlpha = fade * 0.9;
      drawFruit(fl.kind, fl.cx, fl.cy, fruitR);
      ctx.restore();
    }

    // star constellation — one-stroke path links same-color fruits, then 팡
    for (let i = links.length - 1; i >= 0; i--) {
      const L = links[i];
      L.prog += 0.28;                                  // nodes traversed per frame
      const nodes = L.nodes, maxIdx = nodes.length - 1;
      const p = Math.min(L.prog, maxIdx);              // continuous position along path
      // pop fruits as the stroke reaches each node (juice)
      while (L.reached < Math.floor(p)) {
        L.reached++;
        const nd = nodes[L.reached];
        if (nd) burst(nd[0], nd[1], L.color);
      }
      const seg = Math.floor(p), frac = p - seg;
      const C = (n) => cellCenter(n[0], n[1]);
      // one-stroke line up to current progress
      ctx.save();
      ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.lineWidth = cell * 0.09;
      ctx.shadowBlur = cell * 0.3;
      ctx.beginPath();
      const [px0, py0] = C(nodes[0]); ctx.moveTo(px0, py0);
      for (let s = 1; s <= seg; s++) { const [nx, ny] = C(nodes[s]); ctx.lineTo(nx, ny); }
      if (seg < maxIdx) {                              // partial current segment
        const [ax, ay] = C(nodes[seg]), [bx, by] = C(nodes[seg+1]);
        ctx.lineTo(ax + (bx-ax)*frac, ay + (by-ay)*frac);
      }
      ctx.strokeStyle = "#fff"; ctx.shadowColor = COLORS[L.color] || "#fff";
      ctx.globalAlpha = 0.95; ctx.stroke();
      ctx.restore();
      // ghost fruits (not yet reached) + stars (reached)
      for (let j = 1; j <= maxIdx; j++) {
        const [nx, ny] = C(nodes[j]);
        if (j <= p) drawStar(nx, ny, cell * 0.2, "#fff");
        else { ctx.save(); ctx.globalAlpha = 0.9; drawFruit(L.color, nx, ny, cell*0.3); ctx.restore(); }
      }
      drawStar(px0, py0, cell * 0.24, "#fff");         // bright origin
      // completion -> 팡
      if (!L.done && L.prog >= maxIdx) { L.done = true; flash = 0.55; addShake(15); }
      if (L.prog >= maxIdx + 6) links.splice(i, 1);    // linger briefly after the 팡
    }

    // birds (참새) swooping along a curved path to their target fruit
    for (let i = birds.length - 1; i >= 0; i--) {
      const f = birds[i];
      f.t += 0.025;   // slower, more graceful swoop
      const tt = Math.min(1, f.t);
      const [sx, sy] = cellCenter(f.sr, f.sc);
      const [tx, ty] = cellCenter(f.tr, f.tc);
      const dx = tx - sx, dy = ty - sy, len = Math.hypot(dx, dy) || 1;
      const mx = (sx + tx) / 2, my = (sy + ty) / 2;
      const cpx = mx + (-dy / len) * len * 0.45 * f.curve;      // perpendicular swoop
      const cpy = my + ( dx / len) * len * 0.45 * f.curve - len * 0.2;
      const bez = (u) => { const v = 1 - u; return [v*v*sx + 2*v*u*cpx + u*u*tx, v*v*sy + 2*v*u*cpy + u*u*ty]; };
      const ease = (u) => u < 0.5 ? 2*u*u : 1 - Math.pow(-2*u+2, 2) / 2;  // ease-in-out
      const e = ease(tt);
      const pos = bez(e);
      const x = pos[0], y = pos[1] + Math.sin(tt * Math.PI * 7) * cell * 0.05;  // wing bob
      const p0 = bez(Math.max(0, e - 0.02)), p1 = bez(Math.min(1, e + 0.02));
      const faceRight = (p1[0] - p0[0]) >= 0;
      const bank = Math.max(-0.5, Math.min(0.5, (p1[1] - p0[1]) * 0.04));
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(faceRight ? -1 : 1, 1);          // 🐦 faces left by default -> flip when going right
      ctx.rotate((faceRight ? -1 : 1) * bank);
      ctx.font = `${cell * 0.62}px serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.globalAlpha = 0.22; ctx.fillText("🐦", cell * 0.28, 0);   // whoosh trail
      ctx.globalAlpha = 0.45; ctx.fillText("🐦", cell * 0.14, 0);
      ctx.globalAlpha = 1;    ctx.fillText("🐦", 0, 0);
      ctx.restore();
      if (f.t >= 1) {
        if (grid[f.tr][f.tc] !== -1) {           // eat the target fruit
          const col = grid[f.tr][f.tc];
          grid[f.tr][f.tc] = -1; special[f.tr][f.tc] = null;
          burst(f.tr, f.tc, col);
          score += BIRD_SCORE; dirty = true;
          if (score > best) { best = score; localStorage.setItem("bloom_best", best); }
          updateHUD();
        }
        birds.splice(i, 1);
      }
    }

    // star 팡 — white screen flash
    if (flash > 0.01) {
      ctx.save();
      ctx.globalAlpha = flash;
      ctx.fillStyle = "#fff";
      roundRect(0, 0, boardPx, boardPx, 18); ctx.fill();
      ctx.restore();
      flash *= 0.82;
    } else flash = 0;

    ctx.restore();   // end screen-shake transform
    dirty = false;
    requestAnimationFrame(draw);
  }

  // ---- boot ----
  document.getElementById("start-btn").addEventListener("click", () => {
    document.querySelector("#overlay h1").textContent = "Bloom";
    document.querySelector("#overlay p").innerHTML =
      "<b>빈 칸</b>에 다음 색을 놓으면 <b>주변 3×3</b>이 터집니다.<br/>같은 색 <b>연쇄</b> + 연속 <b>배수</b>! 아이템: 4🐦 · 5↔️ · 6💣 · 7🌟";
    start();
  });

  layout();
  emptyGrid();      // init grid/glow so the render loop is safe before "시작하기"
  updateHUD();
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
