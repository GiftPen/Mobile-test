<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Fruit Star</title>
<style>
  :root {
    --bg: #0f1018;
    --panel: #171a26;
    --cell: #1e2130;
    --text: #e8eaf2;
    --muted: #8b90a6;
  }
  @font-face { font-family: 'Maplestory'; font-weight: 700; font-style: normal; font-display: swap;
    src: url('https://cdn.jsdelivr.net/gh/fonts-archive/Maplestory/Maplestory-Bold.woff2') format('woff2'); }
  @font-face { font-family: 'Maplestory'; font-weight: 400; font-style: normal; font-display: swap;
    src: url('https://cdn.jsdelivr.net/gh/fonts-archive/Maplestory/Maplestory-Light.woff2') format('woff2'); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: radial-gradient(120% 100% at 50% 0%, #1a1d2e 0%, var(--bg) 60%);
    color: var(--text);
    font-family: 'Maplestory', -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    overflow: hidden; user-select: none;
    display: flex; flex-direction: column; align-items: center;
  }
  #top {
    width: 100%; max-width: 520px; padding: 14px 18px 6px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .score-box { display: flex; flex-direction: column; }
  .score-box.center { flex: 1 1 auto; align-items: center; text-align: center; }
  .score-label { font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  .score-val { font-size: 34px; font-weight: 700; line-height: 1; }
  .best-line { font-size: 12px; color: var(--muted); margin-top: 4px; letter-spacing: .5px; }
  .best-line b { color: var(--text); font-weight: 700; }
  #next-wrap { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 3px;
    padding: 5px 7px; background: var(--cell); border-radius: 16px; overflow: hidden; }
  #np-now  { width: 50px; height: 50px; display: block; }
  #np-next { width: 32px; height: 32px; display: block; opacity: .72; }
  #stats {
    width: 100%; max-width: 520px; padding: 4px 18px 0;
    display: flex; align-items: center; gap: 8px;
  }
  .chip {
    background: var(--panel); border-radius: 999px; padding: 4px 10px;
    font-size: 12px; color: var(--muted); white-space: nowrap;
  }
  .chip b { color: var(--text); font-weight: 800; }
  #danger-label { margin-left: auto; font-size: 12px; font-weight: 800; color: #ff5a5f; }
  #dangerbar {
    width: 100%; max-width: 520px; padding: 0; height: 8px; margin: 6px auto 0;
    background: #1e2130; border-radius: 999px; overflow: hidden;
  }
  #dangerfill { height: 100%; width: 0%; background: #43d17a;
    border-radius: 999px; transition: width .25s, background .25s; }
  #stage-wrap { position: relative; margin-top: 8px; }
  canvas { display: block; border-radius: 18px; touch-action: none; }
  #combo {
    position: absolute; left: 50%; top: 42%; transform: translate(-50%,-50%);
    font-size: 40px; font-weight: 900; pointer-events: none; opacity: 0;
    text-shadow: 0 2px 20px rgba(0,0,0,.6);
  }
  #hint { color: var(--muted); font-size: 13px; margin-top: 10px; height: 16px; }
  #dock {
    display: flex; align-items: center; flex-wrap: wrap; justify-content: center;
    gap: 6px; margin-top: 10px; max-width: 520px;
    padding: 8px 10px; background: var(--panel); border-radius: 14px;
  }
  .dock-label { font-size: 11px; color: var(--muted); margin-right: 2px; width: 100%; text-align: center; }
  .dock-btn {
    margin: 0; padding: 5px 9px; font-size: 20px; line-height: 1;
    background: #1e2130; color: #fff; border-radius: 10px; box-shadow: none;
  }
  .dock-btn.fruit { padding: 4px; }
  .dock-btn.fruit img { width: 26px; height: 26px; display: block; }
  .dock-btn.sel { background: linear-gradient(90deg,#ffc93c,#43d17a); color: #12131a; transform: scale(1.08); }
  #overlay {
    position: fixed; inset: 0;
    background: radial-gradient(120% 90% at 50% 0%, #1a1d2e 0%, #0f1018 62%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center; padding: 24px; z-index: 10; overflow: hidden;
    font-family: 'Maplestory', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  }
  #overlay.hidden { display: none; }
  #menu.hidden, #gameover.hidden { display: none; }
  #overlay .big { font-size: 20px; color: var(--text); font-weight: 700; }
  button {
    margin-top: 8px; padding: 14px 34px; font-size: 17px; font-weight: 800;
    border: none; border-radius: 999px; color: #12131a; cursor: pointer;
    background: linear-gradient(90deg,#ffc93c,#43d17a);
    box-shadow: 0 8px 24px rgba(67,209,122,.35);
  }
  button:active { transform: scale(.97); }

  /* ---- main menu ---- */
  #menu { position: relative; z-index: 1; width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; }
  #hero { position: relative; width: 100%; height: 46vh; min-height: 300px; max-height: 430px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .burst { position: absolute; left: 4%; top: 3%; width: 92%; height: 94%; z-index: 0;
    filter: drop-shadow(0 12px 26px rgba(0,0,0,.45)); }
  /* layering inside #menu: burst(0) < fruits(1) < title & buttons(2). fruits float in FRONT of the burst backdrop */
  #menufx { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  #menu > .mode-btn, #menu > .menu-icons, #menu > #menu-msg, #menu > .ver { position: relative; z-index: 2; }
  .rr { position: relative; }
  /* star sitting INSIDE the R's counter (the empty loop/hole), not above the letter */
  .rr .d-star { position: absolute; top: 9px; left: 6px; width: 27px; height: 27px; transform: rotate(15deg); z-index: 3;
    pointer-events: none; filter: drop-shadow(0 2px 3px rgba(0,0,0,.5)); }
  .title { position: relative; z-index: 2; line-height: .92; }
  .title .t1, .title .t2 { font-size: 58px; font-weight: 700; text-shadow: 0 4px 0 rgba(0,0,0,.4); }
  .title .t1 { letter-spacing: 2px; }
  .title .t2 { letter-spacing: 5px; color: #ffffff; }
  .tagline { position: relative; z-index: 2; color: var(--muted); font-size: 14px; margin: 16px 0 0; }
  .mode-btn { width: 100%; max-width: 320px; margin-top: 14px; padding: 18px; font-size: 20px; font-weight: 800;
    border: none; border-radius: 18px; color: #fff; cursor: pointer; }
  .mode-btn.arcade { background: #e5484d; box-shadow: 0 6px 0 #a3282c; }
  .mode-btn.challenge { background: #7c5cff; box-shadow: 0 6px 0 #503aa8; opacity: .82; }
  .mode-btn:active { transform: translateY(3px); box-shadow: none; }
  .menu-icons { display: flex; gap: 34px; margin-top: 42px; }
  .icon-btn { background: none; box-shadow: none; margin: 0; padding: 0; display: flex; flex-direction: column;
    align-items: center; gap: 6px; color: var(--muted); }
  .icon-btn .ic { width: 56px; height: 56px; border-radius: 50%; background: #1e2130; font-size: 24px;
    display: flex; align-items: center; justify-content: center; }
  .icon-btn .lb { font-size: 12px; }
  #menu-msg { min-height: 18px; margin-top: 16px; color: #ffd23e; font-size: 13px; font-weight: 700; }
  .ver { position: fixed; bottom: 14px; left: 0; right: 0; color: #555; font-size: 12px; }
  /* ---- game over ---- */
  #gameover { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .go-title { font-size: 40px; margin: 0; font-weight: 900;
    background: linear-gradient(90deg,#ff5a7a,#ffc93c,#43d17a,#4d8bff);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .ghost-btn { background: #1e2130 !important; color: var(--text) !important; box-shadow: none !important; }
  /* ---- in-game pause ---- */
  #pause-btn { flex: 0 0 auto; width: 42px; height: 42px;
    margin: 0; padding: 0; border-radius: 12px; background: #1e2130; color: var(--text);
    font-size: 18px; box-shadow: none; }
  #pause { position: fixed; inset: 0; z-index: 11; background: rgba(10,11,18,.85); backdrop-filter: blur(6px);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  #pause.hidden { display: none; }
  #pause h2 { color: var(--text); font-size: 30px; margin: 0 0 6px; font-weight: 900; }
  #pause button { width: 220px; }
</style>
</head>
<body>
  <div id="pause" class="hidden">
    <h2>일시정지</h2>
    <button id="btn-resume">계속하기</button>
    <button id="btn-tomain" class="ghost-btn">메인으로</button>
  </div>
  <div id="top">
    <button id="pause-btn" aria-label="일시정지">⏸</button>
    <div class="score-box center">
      <span class="score-val" id="score">0</span>
      <span class="best-line">최고 <b id="best">0</b></span>
    </div>
    <div id="next-wrap">
      <canvas id="np-now"  width="128" height="128"></canvas>
      <canvas id="np-next" width="128" height="128"></canvas>
    </div>
  </div>

  <div id="stats">
    <span class="chip">👆 <b id="st-touch">0</b></span>
    <span class="chip">⬜ <b id="st-empty">64</b></span>
    <span class="chip">➕ <b id="st-spawn">2</b></span>
    <span id="danger-label"></span>
  </div>
  <div id="dangerbar"><div id="dangerfill"></div></div>

  <div id="stage-wrap">
    <canvas id="game"></canvas>
    <div id="combo"></div>
  </div>
  <div id="hint">빈 칸을 탭해 과일을 놓으세요</div>

  <div id="dock">
    <span class="dock-label">테스트</span>
    <button class="dock-btn fruit" data-item="fruit0"><img src="assets_new/fruit0.png" onerror="this.onerror=null;this.src='assets/fruit0.png'" alt="체리"></button>
    <button class="dock-btn fruit" data-item="fruit1"><img src="assets_new/fruit1.png" onerror="this.onerror=null;this.src='assets/fruit1.png'" alt="오렌지"></button>
    <button class="dock-btn fruit" data-item="fruit2"><img src="assets_new/fruit2.png" onerror="this.onerror=null;this.src='assets/fruit2.png'" alt="키위"></button>
    <button class="dock-btn fruit" data-item="fruit3"><img src="assets_new/fruit3.png" onerror="this.onerror=null;this.src='assets/fruit3.png'" alt="레몬"></button>
    <button class="dock-btn fruit" data-item="fruit4"><img src="assets_new/fruit4.png" onerror="this.onerror=null;this.src='assets/fruit4.png'" alt="포도"></button>
    <button class="dock-btn fruit" data-item="fruit5"><img src="assets_new/fruit5.png" onerror="this.onerror=null;this.src='assets/fruit5.png'" alt="복숭아"></button>
    <button class="dock-btn fruit" data-item="fruit6"><img src="assets_new/fruit6.png" onerror="this.onerror=null;this.src='assets/fruit6.png'" alt="바나나"></button>
    <button class="dock-btn" data-item="bird">🐦</button>
    <button class="dock-btn" data-item="line">↔️</button>
    <button class="dock-btn" data-item="bomb">💣</button>
    <button class="dock-btn" data-item="star">🌟</button>
    <button class="dock-btn" data-item="brick">🧱</button>
  </div>

  <div id="overlay">
    <div id="menu">
      <canvas id="menufx" aria-hidden="true"></canvas>
      <div id="hero">
        <svg class="burst" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <polygon points="50.0,0.0 57.6,16.9 71.7,5.0 71.2,23.4 89.1,18.8 80.6,35.2 98.7,38.9 84.0,50.0 98.7,61.1 80.6,64.8 89.1,81.2 71.2,76.6 71.7,95.0 57.6,83.1 50.0,100.0 42.4,83.1 28.3,95.0 28.8,76.6 10.9,81.2 19.4,64.8 1.3,61.1 16.0,50.0 1.3,38.9 19.4,35.2 10.9,18.8 28.8,23.4 28.3,5.0 42.4,16.9" fill="#242838"/>
        </svg>
        <div class="title">
          <div class="t1"><span style="color:#ff5a7a">F</span><span style="color:#f45b00">R</span><span style="color:#43d17a">U</span><span style="color:#ffc93c">I</span><span style="color:#4d8bff">T</span></div>
          <div class="t2">STA<span class="rr">R<img class="d-star" src="assets_new/star.png" onerror="this.onerror=null;this.src='assets/star.png'" alt=""></span></div>
        </div>
        <p class="tagline">톡! 터뜨리는 상쾌한 과일 퍼즐</p>
      </div>
      <button id="btn-arcade" class="mode-btn arcade">아케이드 모드</button>
      <button id="btn-challenge" class="mode-btn challenge">🔒 챌린지 모드</button>
      <div class="menu-icons">
        <button class="icon-btn" id="btn-settings"><span class="ic">⚙️</span><span class="lb">설정</span></button>
        <button class="icon-btn" id="btn-ranking"><span class="ic">🏆</span><span class="lb">랭킹</span></button>
      </div>
      <div id="menu-msg"></div>
      <div class="ver">v0.3.0</div>
    </div>
    <div id="gameover" class="hidden">
      <h1 class="go-title">게임 오버</h1>
      <div class="big" id="ov-msg"></div>
      <button id="start-btn">다시 하기</button>
      <button id="btn-menu" class="ghost-btn">메인으로</button>
    </div>
  </div>

<script>
(() => {
  "use strict";

  // ---- config ----
  const N = 8;                 // grid size
  // full palette (7). Only the first activeColors() are in play, growing with score.
  const COLORS = ["#ff5a7a", "#f45b00", "#43d17a", "#ffc93c", "#a66cff", "#ffab8f", "#00b4d8"];
  const BASE_COLORS = 4;       // colors in play at score 0
  const MAX_COLORS = 7;        // cap
  const START_BUDS = 10;
  const SPAWN_BASE = 1;        // buds spawned per move at score 0
  const SPAWN_MAX = 4;         // cap
  // one staged difficulty step per MILESTONE_STEP points, cycling:
  //   brick(+HP) -> +1 color -> +1 spawn -> brick(+HP) -> ...
  const MILESTONE_STEP = 2000; // TEST value; raise (e.g. 8000) for release
  const WAVE_STEP_MS = 87;     // time between chain steps (rings)
  const POP_STAGGER_MS = 37;   // extra micro-delay per cell within a ring (ripple feel)
  const PI2 = Math.PI * 2;
  const SHAKE_MAX = 16;        // screen-shake cap (px)
  const BURST_RADIUS = 1;      // 1 = 3x3 burst (Chebyshev). items can raise this later
  const MAX_MULT = 5;          // streak multiplier cap
  const BIRD_THRESHOLD = 4;    // group size 4      -> a bird
  const LINE_THRESHOLD = 5;    // group size 5–6    -> a line bud (clears a row/col)
  const BOMB_THRESHOLD = 7;    // group size 7–9    -> a bomb bud (5x5 blast)
  const BOMB_RADIUS = 2;       // bomb blast = 5x5 (Chebyshev 2)
  const STAR_THRESHOLD = 10;   // group size 10+    -> a star bud (color bomb + constellation)
  const BIRD_SCORE = 20;       // score for each fruit a bird eats
  const BRICK = -2;            // grid value for a brick (wall; only items can clear it)
  const BRICK_EVERY = 5;       // one brick spawns every N touches once unlocked

  // ---- optional custom fruit art (SVG string). null = use built-in procedural drawing ----
  const CHERRY_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>

  <g><circle cx="64" cy="69" r="17.5" fill="url(#cherryRight)" />
    <ellipse cx="64" cy="55" rx="5" ry="2.2" fill="url(#dimpleShade)" />

</svg>`;
  const ORANGE_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="orangeSphere" cx="34%" cy="32%" r="68%">

  </g>
  <g>
    <ellipse cx="37" cy="42" rx="6.5" ry="11" transform="rotate(-30, 37, 42)" fill="#ffffff" opacity="0.65" />

</svg>`;
  const LEMON_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="lemonBody" cx="36%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fffb7d" /><stop offset="35%" stop-color="#ffea00" /><stop offset="75%" stop-color="#ffc300" /><stop offset="100%" stop-color="#cc8500" />

  // ---- state ----

  // ---- input ----
  function cellFromEvent(ev) {

  function plant(r0, c0, color) {

    special[r0][c0] = null;

  // tap an existing item bud to trigger it directly (counts as a turn)
  function tapItem(r0, c0) {

  // run the chain from an initial frontier; placement=true means a ball was placed
  function runChain(r0, c0, color, visited, initialFrontier, placement) {
    busy = true; dirty = true;
    const R = BURST_RADIUS;
    let frontier = initialFrontier;
    let popped = 0;          // total pops (for score)
    let chainPopped = 0;     // only your own color-chain pops (for item generation)
    const hitBricks = new Map();   // brick key -> number of adjacent pops (1 HP each)

            else if (special[nr][nc] && !visited[nr][nc]) {   // adjacent item -> detonate it

          flashBox(r, c, BOMB_RADIUS, cellColor);
          const [fx, fy] = cellCenter(r, c);
          flares.push({ cx: fx, cy: fy, kind: cellColor < 0 ? it.color : cellColor, maxR: cell * 1.7, t: 0 });  // grow to ~3x3
          addShake(11);
          for (const [nr, nc] of budsAround(r, c, BOMB_RADIUS, visited))
            next.push({ r: nr, c: nc, mode: "blast", color: cellColor });
        } else if (sp === "lineH" || sp === "lineV") { // clears whole row / column
          flashLine(r, c, sp);
          waves.push({ type: sp === "lineH" ? "h" : "v",
                       fixed: sp === "lineH" ? r : c, origin: sp === "lineH" ? c : r,
                       color: cellColor < 0 ? it.color : cellColor, t: 0 });
          addShake(8);
          for (const [nr, nc] of lineCells(r, c, sp, visited))
            next.push({ r: nr, c: nc, mode: "blast", color: cellColor });
        } else if (sp === "star") {           // COLOR BOMB: connect-the-dots then 팡
          flashBox(r, c, R, cellColor);
          addShake(5);
          const target = mode === "color" ? it.color : mostCommonColor();
          // collect same-color cells, clear them NOW (logic) but hold them as ghosts (visual)
          const tCells = [];
          if (target >= 0)

                  grid[rr][cc] = -1; special[rr][cc] = null; popped++;
                  tCells.push([rr, cc]);

                  for (let dr = -1; dr <= 1; dr++)
                    for (let dc = -1; dc <= 1; dc++) {

                      if (br >= 0 && br < N && bc >= 0 && bc < N && grid[br][bc] === BRICK)

            cur = tCells.splice(bi, 1)[0]; path.push(cur);

          links.push({ nodes: path, color: target, prog: 0, reached: 0, done: false });

          for (const [nr, nc] of budsAround(r, c, R, visited))

  // same-color plain fruits within Chebyshev radius R (items are NOT color-matched)
  function seedsAround(r, c, R, color, visited) {
    const out = [];
    for (let dr = -R; dr <= R; dr++) {
      for (let dc = -R; dc <= R; dc++) {
        if (dr === 0 && dc === 0) continue;
        const nr = r + dr, nc = c + dc;
        if (nr < 0 || nr >= N || nc < 0 || nc >= N || visited[nr][nc]) continue;
        if (grid[nr][nc] === color && special[nr][nc] === null) {

        }
      }
    }
    return out;
  }

  // ANY bud within R (used by bomb/star blast — ignores color walls)
  function budsAround(r, c, R, visited) {
    const out = [];
    for (let dr = -R; dr <= R; dr++) {
      for (let dc = -R; dc <= R; dc++) {
        if (dr === 0 && dc === 0) continue;
        const nr = r + dr, nc = c + dc;
        if (nr < 0 || nr >= N || nc < 0 || nc >= N || visited[nr][nc]) continue;
        if (grid[nr][nc] !== -1) { visited[nr][nc] = true; out.push([nr, nc]); }
      }
    }
    return out;
  }

  // all buds in the row (lineH) or column (lineV), marking them visited
  function lineCells(r, c, type, visited) {
    const out = [];
    if (type === "lineH") {
      for (let cc = 0; cc < N; cc++) {
        if (cc === c || visited[r][cc]) continue;
        if (grid[r][cc] !== -1) { visited[r][cc] = true; out.push([r, cc]); }
      }
    } else {
      for (let rr = 0; rr < N; rr++) {
        if (rr === r || visited[rr][c]) continue;
        if (grid[rr][c] !== -1) { visited[rr][c] = true; out.push([rr, c]); }
      }
    }
    return out;
  }

  function flashLine(r, c, type) {
    if (type === "lineH") {
      for (let cc = 0; cc < N; cc++) if (grid[r][cc] === -1) glow[r][cc] = { c: 3, t: 0.8 };
    } else {
      for (let rr = 0; rr < N; rr++) if (grid[rr][c] === -1) glow[rr][c] = { c: 3, t: 0.8 };
    }
  }

  // most abundant color currently on the board (-1 if empty)
  function mostCommonColor() {
    const cnt = new Array(COLORS.length).fill(0);
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++)
      if (grid[r][c] >= 0) cnt[grid[r][c]]++;
    let bi = -1, bv = 0;
    for (let k = 0; k < cnt.length; k++) if (cnt[k] > bv) { bv = cnt[k]; bi = k; }
    return bi;
  }

  // ---- bird (참새): flies to a random junk fruit and eats it ----
  const cellCenter = (r, c) => [pad + c * cell + cell / 2, pad + r * cell + cell / 2];

  function sameColorNeighbors(r, c) {
    const col = grid[r][c]; let n = 0;
    for (let dr = -1; dr <= 1; dr++)
      for (let dc = -1; dc <= 1; dc++) {
        if (dr === 0 && dc === 0) continue;
        const nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < N && nc >= 0 && nc < N && grid[nr][nc] === col) n++;
      }
    return n;
  }

  // target priority: bricks first, then the most isolated junk fruit, else any fruit
  function chooseBirdTarget(exclude) {
    // priority: bricks -> plain fruits (junk first) -> items (last resort)
    const bricks = [], fruits = [], items = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      if (grid[r][c] === -1 || (exclude && exclude[r * N + c])) continue;
      if (grid[r][c] === BRICK) bricks.push([r, c]);
      else if (special[r][c]) items.push([r, c]);   // item bud
      else fruits.push([r, c]);                       // plain fruit
    }
    if (bricks.length) return bricks[randInt(bricks.length)];
    if (fruits.length) {
      const junk = fruits.filter(([r, c]) => sameColorNeighbors(r, c) === 0);
      const pool = junk.length ? junk : fruits;
      return pool[randInt(pool.length)];
    }
    if (items.length) return items[randInt(items.length)];   // only if nothing else left
    return null;
  }

  function spawnBird(fromR, fromC) {
    // exclude cells already targeted by in-flight birds so multiple birds pick different targets
    const exclude = {};
    for (const f of birds) exclude[f.tr * N + f.tc] = true;
    const t = chooseBirdTarget(exclude);
    if (!t) return false;
    birds.push({ sr: fromR, sc: fromC, tr: t[0], tc: t[1], t: 0, curve: Math.random() < 0.5 ? -1 : 1 });
    return true;
  }

  function flashBox(r0, c0, R, colorIdx) {
    for (let dr = -R; dr <= R; dr++)
      for (let dc = -R; dc <= R; dc++) {
        const rr = r0 + dr, cc = c0 + dc;
        if (rr >= 0 && rr < N && cc >= 0 && cc < N && grid[rr][cc] === -1)
          glow[rr][cc] = { c: colorIdx < 0 ? 0 : colorIdx, t: 0.7 };
      }
  }

  function finishBurst(r0, c0, color, popped, chainPopped, placement) {
    if (placement) {
      if (popped > 0) {
        grid[r0][c0] = -1;               // success -> placed ball consumed cleanly
        burst(r0, c0, color);
        streak++;
        const cleared = popped + 1;          // include the ball you placed
        const chainCount = chainPopped + 1;  // your color group size, inclusive
        const mult = Math.min(1 + (streak - 1) * 0.5, MAX_MULT);
        const gained = Math.round((cleared * 10 + (cleared - 1) * (cleared - 1) * 5) * mult);
        score += gained;
        showCombo(cleared, gained, mult);
        addShake(Math.min(12, cleared * 0.7));

        // reward: item tier from YOUR color group only (chainCount), not item cascades.
        // items now sit on the board — tap them, or chain into them, to trigger.
        let itemMsg = "";
        if (chainCount >= STAR_THRESHOLD) {
          grid[r0][c0] = color; special[r0][c0] = "star";
          itemMsg = "🌟 별! 탭하거나 주변 폭발로 발동 — 같은 색 별자리 팡";
        } else if (chainCount >= BOMB_THRESHOLD) {
          grid[r0][c0] = color; special[r0][c0] = "bomb";
          itemMsg = "💣 폭탄! 탭하거나 주변 폭발로 발동 — 5×5 대폭발";
        } else if (chainCount >= LINE_THRESHOLD) {
          grid[r0][c0] = color; special[r0][c0] = randInt(2) ? "lineH" : "lineV";
          itemMsg = "↔️ 라인! 탭하거나 주변 폭발로 발동 — 한 줄 청소";
        } else if (chainCount >= BIRD_THRESHOLD) {
          grid[r0][c0] = color; special[r0][c0] = "bird";
          itemMsg = "🐦 참새! 탭하거나 주변 폭발로 발동 — 벽돌·걸리는 과일을 쪼아 없애요";
        }
        if (itemMsg) { burst(r0, c0, color); document.getElementById("hint").textContent = itemMsg; }
      } else {
        streak = 0;                      // miss -> placed ball stays as junk, streak resets
      }
      if (grid[r0][c0] !== -1) appear[r0][c0] = 1;  // placed ball (junk/item) pops in too
    } else if (popped > 0) {
      // manual item tap: score the clears, no new item, keep the queued color
      const mult = Math.min(1 + (streak - 1) * 0.5, MAX_MULT);
      const gained = Math.round((popped * 10 + (popped - 1) * (popped - 1) * 5) * mult);
      score += gained;
      showCombo(popped, gained, mult);
      addShake(Math.min(12, popped * 0.7));
    }

    spawnBuds(spawnCount());
    // staged gimmick: once bricks are unlocked, one spawns every few touches at current HP level
    const bLvl = brickHpLevel();
    if (bLvl >= 1 && touchCount % BRICK_EVERY === 0) spawnBrick(bLvl);
    if (placement) pickNext();           // a tap-trigger keeps the queued next color
    if (score > best) { best = score; localStorage.setItem("bloom_best", best); }
    updateHUD();
    dirty = true;

    if (emptyCells().length === 0) {
      // board is completely full -> let the spawned pieces pop in & be seen, then over
      busy = true;
      setTimeout(gameOver, 750);
    } else {
      busy = false;
    }
  }

  function gameOver() {
    running = false; busy = false;
    document.getElementById("ov-msg").innerHTML = `점수 <b>${score}</b> · 최고 <b>${best}</b>`;
    document.getElementById("menu").classList.add("hidden");     // show the game-over view
    document.getElementById("gameover").classList.remove("hidden");
    document.getElementById("overlay").classList.remove("hidden");
    mfxStop();   // canvas lives inside #menu (now hidden) — stop the ambient loop
  }
  function showMenu() {
    document.getElementById("gameover").classList.add("hidden");
    document.getElementById("menu").classList.remove("hidden");
    document.getElementById("overlay").classList.remove("hidden");
    document.getElementById("menu-msg").textContent = "";
    mfxStart();
  }

  // ---- juice: particles + combo popup ----
  function burst(r, c, color) {
    const col = typeof color === "number" ? (COLORS[color] || "#fff") : (color || "#fff");
    const cx = pad + c * cell + cell / 2;
    const cy = pad + r * cell + cell / 2;
    // splash ring
    particles.push({ type: "ring", x: cx, y: cy, life: 1, color: col, rad: cell * 0.12 });
    // juice droplets (spray up, then gravity pulls them down)
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * PI2, sp = 1 + Math.random() * 3.2;
      particles.push({
        x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1,
        life: 0.8 + Math.random() * 0.4, color: col, r: cell * (0.04 + Math.random() * 0.09)
      });
    }
  }

  function showCombo(cleared, gained, mult) {
    const el = document.getElementById("combo");
    el.textContent = mult > 1 ? `COMBO ×${mult}   +${gained}` : `+${gained}`;
    el.style.color = "#fff";
    el.animate(
      [ {opacity:0, transform:"translate(-50%,-50%) scale(.6)"},
        {opacity:1, transform:"translate(-50%,-60%) scale(1.15)", offset:.3},
        {opacity:0, transform:"translate(-50%,-80%) scale(1)"} ],
      { duration: 900, easing: "ease-out" });
  }

  // ---- render loop ----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  // ---- fruit art (each color index = a distinct fruit silhouette) ----
  function leaf(lx, ly, s, rot) {
    ctx.save();
    ctx.translate(lx, ly); ctx.rotate(rot);
    ctx.fillStyle = "#4bbf6b";
    ctx.beginPath(); ctx.ellipse(0, 0, s, s * 0.5, 0, 0, PI2); ctx.fill();
    ctx.restore();
  }
  function gloss(cx, cy, rad) {
    ctx.save();
    ctx.globalAlpha = 0.35; ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.ellipse(cx - rad*0.32, cy - rad*0.34, rad*0.34, rad*0.22, -0.6, 0, PI2); ctx.fill();
    ctx.restore();
  }
  function stem(cx, cy, rad) {
    ctx.strokeStyle = "#7a5b3a"; ctx.lineWidth = rad*0.16; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(cx, cy - rad*0.85); ctx.lineTo(cx + rad*0.05, cy - rad*1.15); ctx.stroke();
  }
  function drawStar(x, y, r, col) {
    ctx.save();
    ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = r * 1.4;
    ctx.beginPath();
    for (let k = 0; k < 5; k++) {
      const a = -Math.PI/2 + k * PI2/5, a2 = a + PI2/10;
      ctx.lineTo(x + Math.cos(a)*r, y + Math.sin(a)*r);
      ctx.lineTo(x + Math.cos(a2)*r*0.45, y + Math.sin(a2)*r*0.45);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // ---- art -> sprite cache. PNG in assets/ wins; falls back to the inline SVG ----
  function svgDataURL(svg) {
    return "data:image/svg+xml," + encodeURIComponent(svg.replace('width="100%" height="100%"', 'width="256" height="256"'));
  }
  // try assets_new/<file> first, then assets/<file>, then the inline SVG fallback
  function loadArtImg(file, svg, onReady) {
    const img = new Image();
    let stage = 0;
    const tryNext = () => {
      stage++;
      if (stage === 1) img.src = "assets_new/" + file;
      else if (stage === 2) img.src = "assets/" + file;
      else { img.onerror = null; img.src = svgDataURL(svg); }
    };
    img.onload = onReady;
    img.onerror = tryNext;
    tryNext();
    return img;
  }
  function loadFruits() {   // (re)load the active fruit set into sprite cache
    fruitImg.length = 0; fruitSprite = [];
    for (let i = 0; i < FRUIT_SVG.length; i++) {
      if (!FRUIT_SVG[i]) continue;
      fruitImg[i] = loadArtImg(`fruit${i}.png`, FRUIT_SVG[i], () => { buildFruitSprite(i); dirty = true; });
    }
    dirty = true;
  }
  function loadFruitArt() {
    loadFruits();
    birdImg = loadArtImg("bird.png", SPARROW_SVG, () => { dirty = true; });
    bombImg = loadArtImg("bomb.png", BOMB_SVG, () => { dirty = true; });
    lineImg = loadArtImg("line.png", LINE_SVG, () => { dirty = true; });
    starImg = loadArtImg("star.png", STAR_SVG, () => { dirty = true; });
    [[1, BRICK1_SVG], [2, BRICK2_SVG], [3, BRICK3_SVG]].forEach(([hpv, svg]) => {
      brickImg[hpv] = loadArtImg(`brick${hpv}.png`, svg, () => { dirty = true; });
    });
  }
  const birdReady = () => birdImg && birdImg.complete && birdImg.naturalWidth;
  const bombReady = () => bombImg && bombImg.complete && bombImg.naturalWidth;
  const lineReady = () => lineImg && lineImg.complete && lineImg.naturalWidth;
  const starReady = () => starImg && starImg.complete && starImg.naturalWidth;
  function buildFruitSprite(i) {
    const img = fruitImg[i];
    if (!img || !img.complete || !img.naturalWidth || !cell) return;
    const S = Math.max(1, Math.round(cell * dpr));
    const cv = document.createElement("canvas");
    cv.width = S; cv.height = S;
    cv.getContext("2d").drawImage(img, 0, 0, S, S);
    fruitSprite[i] = cv;
    drawNextPreview();   // refresh preview if the queued fruit just got its art
  }
  function rebuildSprites() { for (let i = 0; i < FRUIT_SVG.length; i++) buildFruitSprite(i); }

  // draw a fruit filling a box of side S — uses cached SVG sprite if present, else procedural
  function fruitVisual(kind, cx, cy, S) {
    const sp = fruitSprite[kind];
    if (sp) ctx.drawImage(sp, cx - S/2, cy - S/2, S, S);
    else drawFruit(kind, cx, cy, S * 0.34);   // procedural draws ~0.34*box radius
  }

  function drawFruit(kind, cx, cy, rad) {
    const col = COLORS[kind] || "#fff";
    ctx.save();
    ctx.fillStyle = col;

    if (kind === 0) {                     // cherry — two berries + stems
      ctx.strokeStyle = "#7a5b3a"; ctx.lineWidth = rad*0.12; ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(cx, cy - rad*0.9);
      ctx.quadraticCurveTo(cx - rad*0.5, cy - rad*0.5, cx - rad*0.45, cy - rad*0.05);
      ctx.moveTo(cx, cy - rad*0.9);
      ctx.quadraticCurveTo(cx + rad*0.5, cy - rad*0.5, cx + rad*0.45, cy - rad*0.05);
      ctx.stroke();
      ctx.fillStyle = col;
      const rr = rad*0.52;
      ctx.beginPath(); ctx.arc(cx - rad*0.42, cy + rad*0.35, rr, 0, PI2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + rad*0.42, cy + rad*0.35, rr, 0, PI2); ctx.fill();
      ctx.shadowBlur = 0;
      gloss(cx - rad*0.42, cy + rad*0.35, rr); gloss(cx + rad*0.42, cy + rad*0.35, rr);
    } else if (kind === 1) {              // blueberry — round + calyx star
      ctx.beginPath(); ctx.arc(cx, cy, rad, 0, PI2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = "rgba(0,0,0,.28)"; ctx.lineWidth = rad*0.08; ctx.lineCap = "round";
      for (let k = 0; k < 5; k++) {
        const a = -Math.PI/2 + k * PI2/5;
        ctx.beginPath(); ctx.moveTo(cx, cy - rad*0.3);
        ctx.lineTo(cx + Math.cos(a)*rad*0.42, cy - rad*0.3 + Math.sin(a)*rad*0.18); ctx.stroke();
      }
      gloss(cx, cy, rad);
    } else if (kind === 2) {              // pear — teardrop + stem/leaf
      ctx.beginPath();
      ctx.moveTo(cx, cy - rad);
      ctx.bezierCurveTo(cx - rad*0.55, cy - rad*0.75, cx - rad*0.72, cy + rad*0.35, cx, cy + rad);
      ctx.bezierCurveTo(cx + rad*0.72, cy + rad*0.35, cx + rad*0.55, cy - rad*0.75, cx, cy - rad);
      ctx.fill();
      ctx.shadowBlur = 0;
      stem(cx, cy - rad*0.05, rad); leaf(cx + rad*0.35, cy - rad*0.95, rad*0.38, 0.5);
      gloss(cx, cy + rad*0.1, rad*0.9);
    } else if (kind === 3) {              // lemon — pointed ellipse
      ctx.beginPath(); ctx.ellipse(cx, cy, rad*1.05, rad*0.74, 0, 0, PI2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx - rad*1.02, cy, rad*0.12, 0, PI2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + rad*1.02, cy, rad*0.12, 0, PI2); ctx.fill();
      ctx.shadowBlur = 0; gloss(cx, cy, rad);
    } else if (kind === 4) {              // grapes — cluster
      const rr = rad*0.4;
      const pts = [[0,-0.6],[-0.5,-0.15],[0.5,-0.15],[-0.25,0.35],[0.25,0.35],[0,0.85]];
      for (const [dx, dy] of pts) { ctx.beginPath(); ctx.arc(cx+dx*rad, cy+dy*rad, rr, 0, PI2); ctx.fill(); }
      ctx.shadowBlur = 0; leaf(cx + rad*0.1, cy - rad*0.95, rad*0.4, -0.3);
      gloss(cx - rad*0.25, cy - rad*0.15, rr);
    } else if (kind === 5) {              // plum/gem — rounded diamond
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.PI/4);
      roundRect(-rad*0.72, -rad*0.72, rad*1.44, rad*1.44, rad*0.4); ctx.fill();
      ctx.restore();
      ctx.shadowBlur = 0; gloss(cx, cy, rad*0.95);
    } else {                              // orange — citrus + leaf + navel
      ctx.beginPath(); ctx.arc(cx, cy, rad, 0, PI2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = "rgba(0,0,0,.18)"; ctx.lineWidth = rad*0.06;
      for (let k = 0; k < 6; k++) {
        const a = k * PI2/6;
        ctx.beginPath(); ctx.moveTo(cx + rad*0.9*Math.cos(a), cy + rad*0.9*Math.sin(a));
        ctx.lineTo(cx + rad*0.98*Math.cos(a), cy + rad*0.98*Math.sin(a)); ctx.stroke();
      }
      leaf(cx, cy - rad*0.95, rad*0.4, 0.2); gloss(cx, cy, rad);
    }
    ctx.restore();
  }

  function draw() {
    if (!grid || !glow) { requestAnimationFrame(draw); return; } // not started yet

    // idle-skip: when nothing is animating and no change is pending, don't redraw (saves heat)
    let live = particles.length || birds.length || flares.length || waves.length || links.length
             || shake > 0.3 || flash > 0.01;
    if (!live) for (let r = 0; r < N && !live; r++) for (let c = 0; c < N; c++)
      if (glow[r][c] || appear[r][c] > 0 || special[r][c] === "bomb") { live = true; break; }
    if (!dirty && !live) { requestAnimationFrame(draw); return; }
    frame++;   // advance idle-animation clock only while actually drawing

    // clear the whole canvas in raw pixels (so shake leaves no smear), keep dpr transform
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.restore();

    // screen shake
    let ox = 0, oy = 0;
    if (shake > 0.3) { ox = (Math.random() - .5) * shake; oy = (Math.random() - .5) * shake; shake *= 0.86; }
    else shake = 0;
    ctx.save(); ctx.translate(ox, oy);

    // board bg
    ctx.fillStyle = "#171a26";
    roundRect(0, 0, boardPx, boardPx, 18); ctx.fill();

    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const x = pad + c * cell, y = pad + r * cell;
        const g = boardPx * 0.006;
        // empty cell
        ctx.fillStyle = "#262a3d";
        roundRect(x + g, y + g, cell - g*2, cell - g*2, cell*0.22); ctx.fill();

        // glow (wave passing)
        const gl = glow[r][c];
        if (gl) {
          ctx.save();
          ctx.globalAlpha = gl.t * 0.5;
          ctx.fillStyle = COLORS[gl.c];
          roundRect(x + g, y + g, cell - g*2, cell - g*2, cell*0.22); ctx.fill();
          ctx.restore();
          gl.t -= 0.046;
          if (gl.t <= 0) glow[r][c] = null;
        }

        // pop-in animation for newly spawned buds/bricks (scale small -> full)
        let apScale = 1;
        if (appear[r][c] > 0) {
          const a = appear[r][c];
          apScale = 1 - a * a * 0.85;                  // eased grow from ~0.15 to 1
          appear[r][c] = Math.max(0, a - 0.068);
        }

        // brick (wall) — art swaps by HP: 3 full, 2 damaged, 1 nearly broken
        if (grid[r][c] === BRICK) {
          const h = Math.max(1, Math.min(3, hp[r][c]));
          const bim = brickImg[h];
          const S = cell * apScale;
          const cxb = x + cell/2, cyb = y + cell/2;
          if (bim && bim.complete && bim.naturalWidth) {
            ctx.drawImage(bim, cxb - S/2, cyb - S/2, S, S);
          } else {                                       // fallback gray block
            ctx.save();
            ctx.fillStyle = h >= 3 ? "#5b6178" : h === 2 ? "#6a5a52" : "#7a4a4a";
            roundRect(x + g, y + g, cell - g*2, cell - g*2, cell*0.16); ctx.fill();
            ctx.restore();
          }
          continue;
        }

        // fruit / item
        const v = grid[r][c];
        if (v !== -1) {
          const cx = x + cell/2, cy = y + cell/2, rad = cell*0.34 * apScale;
          const sp = special[r][c];
          if (sp === "bird") {           // bird item = just a bird, no fruit under it
            const S = cell * apScale;
            if (birdReady()) ctx.drawImage(birdImg, cx - S/2, cy - S/2, S, S);
            else { ctx.save(); ctx.font = `${cell*0.62*apScale}px serif`; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("🐦", cx, cy); ctx.restore(); }
            continue;
          }
          if (sp === "bomb") {                  // fruit bomb: fruit + lit fuse, wiggling like it'll pop
            const ph = frame * 0.22 + (r * 7 + c * 13);       // per-cell phase offset
            const wob = Math.sin(ph);
            const sc = 1 + 0.06 * wob;                        // squishy scale pulse
            const rot = 0.08 * Math.sin(ph * 0.9 + 1);        // little wobble
            ctx.save();
            ctx.translate(cx, cy); ctx.rotate(rot); ctx.scale(sc, sc); ctx.translate(-cx, -cy);
            fruitVisual(v, cx, cy, cell * apScale);
            ctx.strokeStyle = "#6e4722"; ctx.lineWidth = cell*0.05; ctx.lineCap = "round";
            const fx = cx + rad*0.2, fy = cy - rad*0.78;
            ctx.beginPath(); ctx.moveTo(fx, fy);
            ctx.quadraticCurveTo(fx + rad*0.3, fy - rad*0.5, fx + rad*0.55, fy - rad*0.72); ctx.stroke();
            const sxp = fx + rad*0.55, syp = fy - rad*0.72;
            const spk = cell * 0.12 * (0.8 + 0.35 * Math.abs(wob));  // flickering spark
            drawStar(sxp, syp, spk, "#ffd000");
            ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(sxp, syp, cell*0.035, 0, PI2); ctx.fill();
            ctx.restore();
            continue;
          }
          if ((sp === "lineH" || sp === "lineV") && lineReady()) {   // double-arrow icon
            const S = cell * apScale;
            ctx.save(); ctx.translate(cx, cy);
            if (sp === "lineV") ctx.rotate(Math.PI / 2);
            ctx.drawImage(lineImg, -S/2, -S/2, S, S);
            ctx.restore();
            continue;
          }
          if (sp === "star" && starReady()) {    // golden star icon
            const S = cell * apScale;
            ctx.drawImage(starImg, cx - S/2, cy - S/2, S, S);
            continue;
          }
          ctx.save();
          fruitVisual(v, cx, cy, cell * apScale);    // SVG sprite if available, else procedural
          if (sp === "lineH" || sp === "lineV") {
            // white bars showing the clear direction
            ctx.strokeStyle = "#fff"; ctx.lineWidth = cell*0.07; ctx.lineCap = "round";
            for (const off of [-rad*0.4, 0, rad*0.4]) {
              ctx.beginPath();
              if (sp === "lineH") { ctx.moveTo(cx - rad*0.7, cy + off); ctx.lineTo(cx + rad*0.7, cy + off); }
              else                { ctx.moveTo(cx + off, cy - rad*0.7); ctx.lineTo(cx + off, cy + rad*0.7); }
              ctx.stroke();
            }
          } else if (sp === "star") {
            // white star overlay = the star (constellation) item
            drawStar(cx, cy, rad * 0.7, "#fff");
          }
          ctx.restore();
        }
      }
    }

    // particles (juice droplets + splash rings)
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      if (p.type === "ring") {
        p.rad += cell * 0.057; p.life -= 0.046;
        if (p.life <= 0) { particles.splice(i,1); continue; }
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life) * 0.6;
        ctx.strokeStyle = p.color; ctx.lineWidth = cell * 0.05 * p.life + 0.5;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.rad, 0, PI2); ctx.stroke();
        ctx.restore();
        continue;
      }
      p.x += p.vx; p.y += p.vy; p.vy += 0.114; p.vx *= 0.99; p.life -= 0.025;
      if (p.life <= 0) { particles.splice(i,1); continue; }
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r || cell*0.08, 0, PI2); ctx.fill();
      ctx.restore();
    }

    // line-clear waves — a ripple rolls out from the item along the row/col
    for (let i = waves.length - 1; i >= 0; i--) {
      const w = waves[i]; w.t += 0.018;            // roll
      if (w.t >= 1) { waves.splice(i, 1); continue; }
      const front = w.t * (N + 3);                 // wave front distance from origin
      ctx.save();
      ctx.fillStyle = COLORS[w.color] || "#fff";
      for (let k = 0; k < N; k++) {
        const dist = Math.abs(k - w.origin);
        const behind = front - dist;               // how long since front passed this cell
        if (behind <= 0) continue;
        const amp = Math.max(0, 1 - behind * 0.26); // longer wave train
        if (amp <= 0) continue;
        const off = Math.sin(behind * 1.5) * cell * 0.45 * amp;  // taller, longer ripple
        let x, y;
        if (w.type === "h") { const p = cellCenter(w.fixed, k); x = p[0]; y = p[1] + off; }
        else                { const p = cellCenter(k, w.fixed); x = p[0] + off; y = p[1]; }
        ctx.globalAlpha = amp * 0.85;
        ctx.beginPath(); ctx.arc(x, y, cell * 0.36 * amp, 0, PI2); ctx.fill();
      }
      ctx.restore();
    }

    // item flares — fruit silhouette pops to full fast, HOLDS, then fades; ring expands out
    for (let i = flares.length - 1; i >= 0; i--) {
      const fl = flares[i]; fl.t += 0.018;
      if (fl.t >= 1) { flares.splice(i, 1); continue; }
      const grow = Math.min(1, fl.t * 2.6);            // snappy swell (full by ~38%) to match the burst, then hold/pop
      const fruitR = fl.maxR * 0.6 * grow * (2 - grow);
      const fade = fl.t < 0.5 ? 1 : (1 - fl.t) / 0.5;  // hold bright at full size, then fade/burst
      const ringR = fl.maxR * (fl.t * (2 - fl.t));     // shockwave keeps expanding
      ctx.save();
      ctx.globalAlpha = (1 - fl.t) * 0.5;
      ctx.strokeStyle = COLORS[fl.kind] || "#fff"; ctx.lineWidth = cell * 0.14 * (1 - fl.t) + 0.5;
      ctx.beginPath(); ctx.arc(fl.cx, fl.cy, ringR, 0, PI2); ctx.stroke();
      ctx.restore();
      ctx.save();
      ctx.globalAlpha = fade * 0.7;   // bomb fruit stays ~70% translucent as it swells, then fades
      fruitVisual(fl.kind, fl.cx, fl.cy, fruitR / 0.34);   // the fruit grows & bursts (juicy)
      ctx.restore();
    }

    // star constellation — one-stroke path links same-color fruits, then 팡
    for (let i = links.length - 1; i >= 0; i--) {
      const L = links[i];
      L.prog += 0.18;                                  // nodes traversed per frame — graceful link
      const nodes = L.nodes, maxIdx = nodes.length - 1;
      const p = Math.min(L.prog, maxIdx);              // continuous position along path
      // pop fruits as the stroke reaches each node (juice)
      while (L.reached < Math.floor(p)) {
        L.reached++;
        const nd = nodes[L.reached];
        if (nd) burst(nd[0], nd[1], L.color);
      }
      const seg = Math.floor(p), frac = p - seg;
      const C = (n) => cellCenter(n[0], n[1]);
      // one-stroke line up to current progress
      ctx.save();
      ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.lineWidth = cell * 0.09;
      ctx.shadowBlur = cell * 0.3;
      ctx.beginPath();
      const [px0, py0] = C(nodes[0]); ctx.moveTo(px0, py0);
      for (let s = 1; s <= seg; s++) { const [nx, ny] = C(nodes[s]); ctx.lineTo(nx, ny); }
      if (seg < maxIdx) {                              // partial current segment
        const [ax, ay] = C(nodes[seg]), [bx, by] = C(nodes[seg+1]);
        ctx.lineTo(ax + (bx-ax)*frac, ay + (by-ay)*frac);
      }
      ctx.strokeStyle = "#fff"; ctx.shadowColor = COLORS[L.color] || "#fff";
      ctx.globalAlpha = 0.95; ctx.stroke();
      ctx.restore();
      // ghost fruits (not yet reached) + stars (reached)
      for (let j = 1; j <= maxIdx; j++) {
        const [nx, ny] = C(nodes[j]);
        if (j <= p) drawStar(nx, ny, cell * 0.2, "#fff");
        else { ctx.save(); ctx.globalAlpha = 0.9; fruitVisual(L.color, nx, ny, cell * 0.88); ctx.restore(); }
      }
      drawStar(px0, py0, cell * 0.24, "#fff");         // bright origin
      // completion -> 팡
      if (!L.done && L.prog >= maxIdx) { L.done = true; flash = 0.55; addShake(15); }
      if (L.prog >= maxIdx + 6) links.splice(i, 1);    // linger briefly after the 팡
    }

    // birds (참새) swooping along a curved path to their target fruit
    for (let i = birds.length - 1; i >= 0; i--) {
      const f = birds[i];
      f.t += 0.018;   // graceful swoop
      const tt = Math.min(1, f.t);
      const [sx, sy] = cellCenter(f.sr, f.sc);
      const [tx, ty] = cellCenter(f.tr, f.tc);
      const dx = tx - sx, dy = ty - sy, len = Math.hypot(dx, dy) || 1;
      const mx = (sx + tx) / 2, my = (sy + ty) / 2;
      const cpx = mx + (-dy / len) * len * 0.45 * f.curve;      // perpendicular swoop
      const cpy = my + ( dx / len) * len * 0.45 * f.curve - len * 0.2;
      const bez = (u) => { const v = 1 - u; return [v*v*sx + 2*v*u*cpx + u*u*tx, v*v*sy + 2*v*u*cpy + u*u*ty]; };
      const ease = (u) => u < 0.5 ? 2*u*u : 1 - Math.pow(-2*u+2, 2) / 2;  // ease-in-out
      const e = ease(tt);
      const pos = bez(e);
      const x = pos[0], y = pos[1] + Math.sin(tt * Math.PI * 7) * cell * 0.05;  // wing bob
      const p0 = bez(Math.max(0, e - 0.02)), p1 = bez(Math.min(1, e + 0.02));
      const faceRight = (p1[0] - p0[0]) >= 0;
      const bank = Math.max(-0.5, Math.min(0.5, (p1[1] - p0[1]) * 0.04));
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(faceRight ? -1 : 1, 1);          // sparrow faces left by default -> flip when going right
      ctx.rotate((faceRight ? -1 : 1) * bank);
      const S = cell * 0.9;
      if (birdReady()) {
        ctx.globalAlpha = 0.22; ctx.drawImage(birdImg, -S/2 + cell*0.26, -S/2, S, S);  // whoosh trail
        ctx.globalAlpha = 0.45; ctx.drawImage(birdImg, -S/2 + cell*0.13, -S/2, S, S);
        ctx.globalAlpha = 1;    ctx.drawImage(birdImg, -S/2, -S/2, S, S);
      } else {
        ctx.font = `${cell * 0.62}px serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.globalAlpha = 1; ctx.fillText("🐦", 0, 0);
      }
      ctx.restore();
      if (f.t >= 1) {
        if (grid[f.tr][f.tc] !== -1) {
          if (special[f.tr][f.tc] && !busy) {    // landed on an item -> detonate it
            tapItem(f.tr, f.tc);
          } else {                                // plain fruit / brick -> eat it
            const col = grid[f.tr][f.tc];
            grid[f.tr][f.tc] = -1; special[f.tr][f.tc] = null;
            burst(f.tr, f.tc, col);
            score += BIRD_SCORE; dirty = true;
            if (score > best) { best = score; localStorage.setItem("bloom_best", best); }
            updateHUD();
          }
        }
        birds.splice(i, 1);
      }
    }

    // star 팡 — white screen flash
    if (flash > 0.01) {
      ctx.save();
      ctx.globalAlpha = flash;
      ctx.fillStyle = "#fff";
      roundRect(0, 0, boardPx, boardPx, 18); ctx.fill();
      ctx.restore();
      flash *= 0.862;
    } else flash = 0;

    ctx.restore();   // end screen-shake transform
    dirty = false;
    requestAnimationFrame(draw);
  }

  // ---- main-menu ambient FX (fruits drift across full screen, pop with juice) ----
  const mfx = document.getElementById("menufx");
  const mctx = mfx.getContext("2d");
  let mfxRAF = 0, mfxFruits = [], mfxParts = [], mfxW = 0, mfxH = 0, mfxDpr = 1;

  function mfxResize() {
    mfxDpr = Math.min(2, window.devicePixelRatio || 1);
    mfxW = window.innerWidth; mfxH = window.innerHeight;
    mfx.width = Math.round(mfxW * mfxDpr);
    mfx.height = Math.round(mfxH * mfxDpr);
    mctx.setTransform(mfxDpr, 0, 0, mfxDpr, 0, 0);
  }
  function mfxLoadedSlots() {
    const s = [];
    for (let i = 0; i < fruitImg.length; i++) { const im = fruitImg[i]; if (im && im.complete && im.naturalWidth) s.push(i); }
    return s;
  }
  function mfxInit(f) {
    const slots = mfxLoadedSlots();
    f.slot = slots.length ? slots[(slots.length * Math.random()) | 0] : ((Math.random() * COLORS.length) | 0);
    // size spread heavily biased to small; big ones only occasionally (high exponent = rare large)
    f.size = 20 + Math.pow(Math.random(), 3) * 122;    // ~20–142 px, mostly small, big is rare
    f.x = Math.random() * mfxW;                        // anywhere on screen
    f.y = Math.random() * mfxH;
    const ang = Math.random() * PI2, spd = 0.65 + Math.random() * 1.05;  // gentler still: 0.65–1.7 px/frame
    f.vx = Math.cos(ang) * spd; f.vy = Math.sin(ang) * spd;
    f.rot = Math.random() * PI2; f.vr = (Math.random() - 0.5) * 0.05;
    f.age = 0; f.life = 130 + (Math.random() * 150 | 0);   // ~2.2–4.7 s, then pop
  }
  function mfxPop(f) {                                  // juice splash at fruit's spot
    const col = COLORS[f.slot] || "#fff";
    mfxParts.push({ type: "ring", x: f.x, y: f.y, life: 1, color: col, rad: f.size * 0.28 });
    const n = 16 + (Math.random() * 6 | 0);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * PI2, sp = 1.4 + Math.random() * 4.2;
      mfxParts.push({ x: f.x, y: f.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.4,
        life: 0.75 + Math.random() * 0.4, color: col, r: f.size * (0.05 + Math.random() * 0.10) });
    }
  }
  function mfxFrame() {
    mctx.clearRect(0, 0, mfxW, mfxH);
    for (const f of mfxFruits) {
      f.x += f.vx; f.y += f.vy; f.rot += f.vr; f.age++;
      // wrap around edges so they keep using the whole screen
      const m = f.size;
      if (f.x < -m) f.x += mfxW + 2 * m; else if (f.x > mfxW + m) f.x -= mfxW + 2 * m;
      if (f.y < -m) f.y += mfxH + 2 * m; else if (f.y > mfxH + m) f.y -= mfxH + 2 * m;
      let a = 0.82;
      if (f.age < 16) a *= f.age / 16;                       // fade in
      const t = f.life - f.age;
      let scale = 1;
      if (t < 14) { a *= Math.max(0, t / 14); scale = 1 + (14 - t) * 0.03; }  // swell + fade right before pop
      const img = fruitImg[f.slot];
      if (img && img.complete && img.naturalWidth && a > 0.01) {
        mctx.save();
        mctx.globalAlpha = a;
        mctx.translate(f.x, f.y); mctx.rotate(f.rot);
        const s = f.size * scale;
        mctx.drawImage(img, -s / 2, -s / 2, s, s);
        mctx.restore();
      }
      if (f.age >= f.life) { mfxPop(f); mfxInit(f); f.age = -(Math.random() * 40 | 0); }  // pop → respawn (staggered)
    }
    for (let i = mfxParts.length - 1; i >= 0; i--) {
      const p = mfxParts[i];
      if (p.type === "ring") {
        p.rad += 2.2; p.life -= 0.05;
        if (p.life <= 0) { mfxParts.splice(i, 1); continue; }
        mctx.save(); mctx.globalAlpha = Math.max(0, p.life) * 0.6; mctx.strokeStyle = p.color;
        mctx.lineWidth = 2; mctx.beginPath(); mctx.arc(p.x, p.y, p.rad, 0, PI2); mctx.stroke(); mctx.restore();
        continue;
      }
      p.vy += 0.13; p.x += p.vx; p.y += p.vy; p.life -= 0.02;
      if (p.life <= 0) { mfxParts.splice(i, 1); continue; }
      mctx.save(); mctx.globalAlpha = Math.max(0, Math.min(1, p.life)); mctx.fillStyle = p.color;
      mctx.beginPath(); mctx.arc(p.x, p.y, p.r, 0, PI2); mctx.fill(); mctx.restore();
    }
    mfxRAF = requestAnimationFrame(mfxFrame);
  }
  function mfxStart() {
    if (mfxRAF) return;
    mfxResize();
    if (!mfxFruits.length) { mfxFruits = Array.from({ length: 9 }, () => { const f = {}; mfxInit(f); f.age = (Math.random() * f.life | 0); return f; }); }
    mfxRAF = requestAnimationFrame(mfxFrame);
  }
  function mfxStop() {
    if (mfxRAF) { cancelAnimationFrame(mfxRAF); mfxRAF = 0; }
    mctx.clearRect(0, 0, mfxW, mfxH);
  }

  // ---- boot ----
  document.getElementById("btn-arcade").addEventListener("click", start);     // arcade = the game
  document.getElementById("start-btn").addEventListener("click", start);      // game-over retry
  document.getElementById("btn-menu").addEventListener("click", showMenu);    // game-over -> main
  let msgTimer = null;
  function menuMsg(txt) {
    const el = document.getElementById("menu-msg");
    el.textContent = txt;
    clearTimeout(msgTimer); msgTimer = setTimeout(() => { el.textContent = ""; }, 2200);
  }
  document.getElementById("btn-challenge").addEventListener("click", () => menuMsg("🔒 챌린지 모드는 곧 출시됩니다!"));
  document.getElementById("btn-settings").addEventListener("click", () => menuMsg("⚙️ 설정은 준비 중이에요"));
  document.getElementById("btn-ranking").addEventListener("click", () => menuMsg("🏆 랭킹은 준비 중이에요"));

  // in-game pause / back to main
  document.getElementById("pause-btn").addEventListener("click", () => {
    if (!running) return;
    paused = true;
    document.getElementById("pause").classList.remove("hidden");
  });
  document.getElementById("btn-resume").addEventListener("click", () => {
    paused = false;
    document.getElementById("pause").classList.add("hidden");
  });
  document.getElementById("btn-tomain").addEventListener("click", () => {
    paused = false; running = false;
    document.getElementById("pause").classList.add("hidden");
    showMenu();
  });

  layout();
  emptyGrid();      // init grid/glow so the render loop is safe before "시작하기"
  loadFruitArt();   // load custom SVG art -> sprite cache
  updateHUD();
  mfxStart();       // menu is visible on boot -> start ambient fruit FX
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
