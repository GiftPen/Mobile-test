      const grow = Math.min(1, fl.t * 2.6);            // snappy swell (full by ~38%) to match the burst, then hold/pop
      const fruitR = fl.maxR * 0.6 * grow * (2 - grow);
      const fade = fl.t < 0.5 ? 1 : (1 - fl.t) / 0.5;  // hold bright at full size, then fade/burst
      const ringR = fl.maxR * (fl.t * (2 - fl.t));     // shockwave keeps expanding
      ctx.save();
      ctx.globalAlpha = (1 - fl.t) * 0.5;
      ctx.strokeStyle = COLORS[fl.kind] || "#fff"; ctx.lineWidth = cell * 0.14 * (1 - fl.t) + 0.5;
      ctx.beginPath(); ctx.arc(fl.cx, fl.cy, ringR, 0, PI2); ctx.stroke();
      ctx.restore();
      ctx.save();
      ctx.globalAlpha = fade * 0.7;   // bomb fruit stays ~70% translucent as it swells, then fades
      fruitVisual(fl.kind, fl.cx, fl.cy, fruitR / 0.34);   // the fruit grows & bursts (juicy)
      ctx.restore();
    }

    // star constellation — one-stroke path links same-colour fruits, then clears them
    for (let i = links.length - 1; i >= 0; i--) {
      const L = links[i];
      L.prog += 0.19;                                  // nodes traversed per frame — star line-draw (~5% faster)
      const nodes = L.nodes, maxIdx = nodes.length - 1;
      const p = Math.min(L.prog, maxIdx);              // continuous position along path
      // pop fruits as the stroke reaches each node (juice)
      while (L.reached < Math.floor(p)) {
        L.reached++;
        const nd = nodes[L.reached];
        if (nd) {
          burst(nd[0], nd[1], L.color); popScoreText(nd[0], nd[1], L.color);
          notify("onFruitPop", { r: nd[0], c: nd[1], color: L.color });
          addCoins(starCoinMult + (nd[2] || 0), nd[0], nd[1]);   // ⭐ signature + carried coin
        }
      }
      const seg = Math.floor(p), frac = p - seg;
      const C = (n) => cellCenter(n[0], n[1]);
      // one-stroke line up to current progress
      ctx.save();
      ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.lineWidth = cell * 0.09;
      ctx.shadowBlur = cell * 0.3;
      ctx.beginPath();
      const [px0, py0] = C(nodes[0]); ctx.moveTo(px0, py0);
      for (let s = 1; s <= seg; s++) { const [nx, ny] = C(nodes[s]); ctx.lineTo(nx, ny); }
      if (seg < maxIdx) {                              // partial current segment
        const [ax, ay] = C(nodes[seg]), [bx, by] = C(nodes[seg+1]);
        ctx.lineTo(ax + (bx-ax)*frac, ay + (by-ay)*frac);
      }
      ctx.strokeStyle = "#fff"; ctx.shadowColor = COLORS[L.color] || "#fff";
      ctx.globalAlpha = 0.95; ctx.stroke();
      ctx.restore();
      // ghost fruits (not yet reached) + stars (reached)
      for (let j = 1; j <= maxIdx; j++) {
        const [nx, ny] = C(nodes[j]);
        if (j <= p) drawStar(nx, ny, cell * 0.2, "#fff");
        else { ctx.save(); ctx.globalAlpha = 0.9; fruitVisual(L.color, nx, ny, cell * 0.88); ctx.restore(); }
      }
      drawStar(px0, py0, cell * 0.24, "#fff");         // bright origin
      // the stroke reached the end
      if (!L.done && L.prog >= maxIdx) { L.done = true; flash = 0.55; addShake(15); }
      if (L.prog >= maxIdx + 6) links.splice(i, 1);    // linger briefly after it lands
    }

    // birds (참새) swooping along a curved path to their target fruit
    for (let i = birds.length - 1; i >= 0; i--) {
      const f = birds[i];
      f.t += 0.019;   // graceful swoop
      const tt = Math.min(1, f.t);
      const [sx, sy] = cellCenter(f.sr, f.sc);
      const [tx, ty] = cellCenter(f.tr, f.tc);
      const dx = tx - sx, dy = ty - sy, len = Math.hypot(dx, dy) || 1;
      const mx = (sx + tx) / 2, my = (sy + ty) / 2;
      const cpx = mx + (-dy / len) * len * 0.45 * f.curve;      // perpendicular swoop
      const cpy = my + ( dx / len) * len * 0.45 * f.curve - len * 0.2;
      const bez = (u) => { const v = 1 - u; return [v*v*sx + 2*v*u*cpx + u*u*tx, v*v*sy + 2*v*u*cpy + u*u*ty]; };
      const ease = (u) => u < 0.5 ? 2*u*u : 1 - Math.pow(-2*u+2, 2) / 2;  // ease-in-out
      const e = ease(tt);
      const pos = bez(e);
      const x = pos[0], y = pos[1] + Math.sin(tt * Math.PI * 7) * cell * 0.05;  // wing bob
      const p0 = bez(Math.max(0, e - 0.02)), p1 = bez(Math.min(1, e + 0.02));
      const faceRight = (p1[0] - p0[0]) >= 0;
      const bank = Math.max(-0.5, Math.min(0.5, (p1[1] - p0[1]) * 0.04));
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(faceRight ? -1 : 1, 1);          // sparrow faces left by default -> flip when going right
      ctx.rotate((faceRight ? -1 : 1) * bank);
      const S = cell * 0.9;
      if (birdReady()) {
        ctx.globalAlpha = 0.22; ctx.drawImage(birdImg, -S/2 + cell*0.26, -S/2, S, S);  // whoosh trail
        ctx.globalAlpha = 0.45; ctx.drawImage(birdImg, -S/2 + cell*0.13, -S/2, S, S);
        ctx.globalAlpha = 1;    ctx.drawImage(birdImg, -S/2, -S/2, S, S);
      } else {
        ctx.font = `${cell * 0.62}px serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.globalAlpha = 1; ctx.fillText("🐦", 0, 0);
      }
      ctx.restore();
      if (f.t >= 1) {
        if (!running) { birds.splice(i, 1); continue; }
        const occupied = grid[f.tr][f.tc] !== -1;
        // Landing on an item while a chain was still running used to fall through to "eat it",
        // which DELETED the item for 2 points instead of setting it off -- a star could vanish
        // without ever firing. Hover over it until the board is free, then detonate properly.
        if (occupied && special[f.tr][f.tc] && busy) { dirty = true; continue; }
        if (occupied) {
          if (special[f.tr][f.tc]) {
            tapItem(f.tr, f.tc);
          } else {                                // plain fruit / brick -> eat it
            const col = grid[f.tr][f.tc];
            const isBrick = col === BRICK;
            const beak = takeCoin(f.tr, f.tc);
            grid[f.tr][f.tc] = -1; special[f.tr][f.tc] = null; hp[f.tr][f.tc] = 0;
            if (beak) addCoins(1, f.tr, f.tc);
            burst(f.tr, f.tc, isBrick ? "#9aa0b5" : col);   // bricks burst grey, as they do elsewhere
            if (!isBrick) popScoreText(f.tr, f.tc, col);
            addScore(BIRD_SCORE); dirty = true;
            updateHUD();
          }
        } else if (!f.retried) {
          // the target got cleared mid-flight, so the bird would just fizzle out with nothing
          // to show for the item. Give it one more hop from where it is.
          const taken = {};
          for (const o of birds) if (o !== f) taken[o.tr * COLS + o.tc] = true;
          const t2 = chooseBirdTarget(taken);
          if (t2) {
            f.sr = f.tr; f.sc = f.tc; f.tr = t2[0]; f.tc = t2[1];
            f.t = 0.45; f.retried = true; f.curve = -f.curve; dirty = true;
            continue;
          }
        }
        birds.splice(i, 1);
      }
    }

    // the star finishing — white screen flash
    if (flash > 0.01) {
      ctx.save();
      ctx.globalAlpha = flash;
      ctx.fillStyle = "#fff";
      roundRect(0, 0, boardPx, boardH, 18); ctx.fill();
      ctx.restore();
      flash *= 0.855;
    } else flash = 0;

    ctx.restore();   // end screen-shake transform
    dirty = false;
    requestAnimationFrame(draw);
  }

  // ---- main-menu ambient FX (fruits drift across full screen, pop with juice) ----
  const mfx = document.getElementById("menufx");
  const mctx = mfx.getContext("2d");
  let mfxRAF = 0, mfxFruits = [], mfxParts = [], mfxW = 0, mfxH = 0, mfxDpr = 1;

  function mfxResize() {
    mfxDpr = Math.min(2, window.devicePixelRatio || 1);
    mfxW = window.innerWidth; mfxH = window.innerHeight;
    mfx.width = Math.round(mfxW * mfxDpr);
    mfx.height = Math.round(mfxH * mfxDpr);
    mctx.setTransform(mfxDpr, 0, 0, mfxDpr, 0, 0);
  }
  function mfxLoadedSlots() {
    const s = [];
    for (let i = 0; i < fruitImg.length; i++) { const im = fruitImg[i]; if (im && im.complete && im.naturalWidth) s.push(i); }
    return s;
  }
  function mfxInit(f) {
    const slots = mfxLoadedSlots();
    f.slot = slots.length ? slots[(slots.length * Math.random()) | 0] : ((Math.random() * COLORS.length) | 0);
    // size spread heavily biased to small; big ones only occasionally (high exponent = rare large)
    f.size = 20 + Math.pow(Math.random(), 3) * 122;    // ~20–142 px, mostly small, big is rare
    f.x = Math.random() * mfxW;                        // anywhere on screen
    f.y = Math.random() * mfxH;
    const ang = Math.random() * PI2, spd = 0.65 + Math.random() * 1.05;  // gentler still: 0.65–1.7 px/frame
    f.vx = Math.cos(ang) * spd; f.vy = Math.sin(ang) * spd;
    f.rot = Math.random() * PI2; f.vr = (Math.random() - 0.5) * 0.05;
    f.age = 0; f.life = 130 + (Math.random() * 150 | 0);   // ~2.2–4.7 s, then pop
  }
  function mfxPop(f) {                                  // juice splash at fruit's spot
    const col = COLORS[f.slot] || "#fff";
    mfxParts.push({ type: "ring", x: f.x, y: f.y, life: 1, color: col, rad: f.size * 0.28 });
    const n = 16 + (Math.random() * 6 | 0);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * PI2, sp = 1.4 + Math.random() * 4.2;
      mfxParts.push({ x: f.x, y: f.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.4,
        life: 0.75 + Math.random() * 0.4, color: col, r: f.size * (0.05 + Math.random() * 0.10) });
    }
  }
  function mfxFrame() {
    mctx.clearRect(0, 0, mfxW, mfxH);
    for (const f of mfxFruits) {
      f.x += f.vx; f.y += f.vy; f.rot += f.vr; f.age++;
      // wrap around edges so they keep using the whole screen
      const m = f.size;
      if (f.x < -m) f.x += mfxW + 2 * m; else if (f.x > mfxW + m) f.x -= mfxW + 2 * m;
      if (f.y < -m) f.y += mfxH + 2 * m; else if (f.y > mfxH + m) f.y -= mfxH + 2 * m;
      let a = 0.82;
      if (f.age < 16) a *= f.age / 16;                       // fade in
      const t = f.life - f.age;
      let scale = 1;
      if (t < 14) { a *= Math.max(0, t / 14); scale = 1 + (14 - t) * 0.03; }  // swell + fade right before pop
      const img = fruitImg[f.slot];
      if (img && img.complete && img.naturalWidth && a > 0.01) {
        mctx.save();
        mctx.globalAlpha = a;
        mctx.translate(f.x, f.y); mctx.rotate(f.rot);
        const s = f.size * scale;
        mctx.drawImage(img, -s / 2, -s / 2, s, s);
        mctx.restore();
      }
      if (f.age >= f.life) { mfxPop(f); mfxInit(f); f.age = -(Math.random() * 40 | 0); }  // pop → respawn (staggered)
    }
    for (let i = mfxParts.length - 1; i >= 0; i--) {
      const p = mfxParts[i];
      if (p.type === "ring") {
        p.rad += 2.2; p.life -= 0.05;
        if (p.life <= 0) { mfxParts.splice(i, 1); continue; }
        mctx.save(); mctx.globalAlpha = Math.max(0, p.life) * 0.6; mctx.strokeStyle = p.color;
        mctx.lineWidth = 2; mctx.beginPath(); mctx.arc(p.x, p.y, p.rad, 0, PI2); mctx.stroke(); mctx.restore();
        continue;
      }
      p.vy += 0.13; p.x += p.vx; p.y += p.vy; p.life -= 0.02;
      if (p.life <= 0) { mfxParts.splice(i, 1); continue; }
      mctx.save(); mctx.globalAlpha = Math.max(0, Math.min(1, p.life)); mctx.fillStyle = p.color;
      mctx.beginPath(); mctx.arc(p.x, p.y, p.r, 0, PI2); mctx.fill(); mctx.restore();
    }
    mfxRAF = requestAnimationFrame(mfxFrame);
  }
  function mfxStart() {
    if (mfxRAF) return;
    mfxResize();
    if (!mfxFruits.length) { mfxFruits = Array.from({ length: 9 }, () => { const f = {}; mfxInit(f); f.age = (Math.random() * f.life | 0); return f; }); }
    mfxRAF = requestAnimationFrame(mfxFrame);
  }
  function mfxStop() {
    if (mfxRAF) { cancelAnimationFrame(mfxRAF); mfxRAF = 0; }
    mctx.clearRect(0, 0, mfxW, mfxH);
  }


  // ---- boot ----
  // ?test=1 goes straight to the game: the suites drive the mode buttons and would otherwise
  // all be playing the tutorial. The tutorial itself is exercised by calling startTutorial()
  // directly, so it stays covered.
  const play = m => (tutorialDone() || TEST_MODE ? start(m) : startTutorial(m));
  document.getElementById("btn-arcade").addEventListener("click", () => play("arcade"));
  document.getElementById("start-btn").addEventListener("click", () => start());   // retry same mode
  document.getElementById("btn-menu").addEventListener("click", showMenu);    // game-over -> main
  let msgTimer = null;
  function menuMsg(txt) {
    const el = document.getElementById("menu-msg");
    el.textContent = txt;
    clearTimeout(msgTimer); msgTimer = setTimeout(() => { el.textContent = ""; }, 2200);
  }
  document.getElementById("btn-challenge").addEventListener("click", () => play("rush"));
  document.getElementById("btn-settings").addEventListener("click", openSettings);
  document.getElementById("s-close").addEventListener("click", closeSettings);
  document.getElementById("tut-skip").addEventListener("click", () => finishTutorial(true));
  document.getElementById("s-replay").addEventListener("click", () => {
    closeSettings();
    startTutorial(null);                   // null: finish back at the menu
  });
  document.getElementById("s-mute").addEventListener("click", () => {
    SFX.setMuted(!SFX.muted); renderMenuSettings();
    if (!SFX.muted) SFX.play("tap");
  });
  document.getElementById("s-vol").addEventListener("input", e => {
    SFX.setVolume(+e.target.value / 100);
    document.getElementById("s-vol-v").textContent = e.target.value;
  });
  document.getElementById("s-vol").addEventListener("change", () => SFX.play("coin"));
  document.getElementById("s-haptic").addEventListener("click", () => {
    setHaptics(!haptics); renderMenuSettings();
    buzz(18);                              // feel the setting you just turned on
  });
  document.getElementById("s-reset").addEventListener("click", () => {
    if (!confirm(d("resetAsk"))) return;
    try {
      for (const k of [BEST_KEYS.arcade, BEST_KEYS.rush, BEST_STAGE_KEY]) localStorage.removeItem(k);
    } catch (e) {}
    best = 0; bestStage = 0; loadBest(); updateHUD();
    menuMsg(d("resetDone"));
  });
  document.getElementById("btn-ranking").addEventListener("click", () => menuMsg(d("soonRanking")));

  // in-game pause / back to main
  document.getElementById("pause-btn").addEventListener("click", () => {
    if (!running) return;
    paused = true;
    renderSettings();
    document.getElementById("pause").classList.remove("hidden");
  });
  // ---- tutorial -------------------------------------------------------------------
  // Taught by doing, not by reading: a scripted board, one legal tap at a time, and the rest
  // of the grid dimmed so there is nothing to get wrong. Three steps is the whole of it --
  // place, pop a bigger cluster, fire an item -- because everything else in this game is a
  // number on a card the player can read when it appears.
  const TUT_KEY = "fs_tut_v1";
  let tut = null;                          // null when not running
  const tutorialDone = () => { try { return localStorage.getItem(TUT_KEY) === "1"; } catch (e) { return false; } };

  // A board that is empty except for the lesson does not look like the game, so the shapes
  // sit inside a normal-looking scatter. Everything the step depends on is protected; the
  // rest is ordinary fruit, exactly as a real early board looks.
  function tutScatter(n, keepOut) {
    const banned = new Set(keepOut.map(([r, c]) => r * COLS + c));
    const free = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const k = r * COLS + c;
      if (grid[r][c] === -1 && !banned.has(k)) free.push([r, c]);
    }
    for (let i = 0; i < n && free.length; i++) {
      const [r, c] = free.splice(randInt(free.length), 1)[0];
      grid[r][c] = pickColor();
    }
  }
  // cells that must stay clear around a target so the scatter cannot change the lesson
  const ring = (r, c) => {
    const out = [];
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) out.push([r + dr, c + dc]);
    return out;
  };

  const TUT_STEPS = [
    { // 1. the only action in the game
      text: "tut1",
      setup() {
        grid[4][3] = 0; grid[4][4] = 0;    // two cherries side by side
        const target = [4, 5];
        tutScatter(9, ring(4, 4).concat(ring(4, 5)));
        nextColor = 0; nextColor2 = 0;
        return target;
      },
    },
    { // 2. bigger cluster, bigger score
      text: "tut2",
      setup() {
        for (const [r, c] of [[3,3],[3,4],[3,5],[4,3],[4,5],[5,3],[5,4],[5,5]]) grid[r][c] = 2;
        const target = [4, 4];
        tutScatter(7, ring(4, 4).concat(ring(3, 4), ring(5, 4)));
        nextColor = 2; nextColor2 = 2;
        return target;
      },
    },
    { // 3. items are made by popping...
      text: "tut3",
      setup() {
        grid[4][4] = 6; special[4][4] = "bomb";
        for (const [r, c] of [[4,3],[4,5],[3,4],[5,4]]) grid[r][c] = 4;
        tutScatter(11, ring(4, 4));
        nextColor = 4; nextColor2 = 4;
        return [4, 4];                     // tap the bomb itself
      },
    },
    { // 4. ...and they also go off on their own when fruit pops beside them. This is the half
      //    players never discover by accident, so it gets its own step.
      text: "tut4",
      setup() {
        grid[4][5] = 6; special[4][5] = "bomb";   // a bomb sitting to the side
        grid[4][2] = 1; grid[4][3] = 1;           // a match that does NOT include the bomb
        const target = [4, 4];                    // popping here is adjacent to the bomb
        tutScatter(9, ring(4, 4).concat(ring(4, 5), ring(4, 3)));
        nextColor = 1; nextColor2 = 1;
        return target;
      },
    },
  ];

  // `thenMode` null means it was opened from settings: finish back at the menu instead of
  // dropping into a run nobody asked to start
  function startTutorial(thenMode) {
    mode = thenMode || mode || "rush";
    resetRun(); resetEffects(); applyRelics();
    running = true; busy = false; paused = false;
    tut = { i: -1, then: thenMode, target: null };
    $sh("overlay").classList.add("hidden");
    $sh("tut").classList.remove("hidden");
    document.body.classList.add("tut-on");
    nextTutStep();
  }
  function nextTutStep() {
    if (!tut) return;
    tut.i++;
    if (tut.i >= TUT_STEPS.length) { finishTutorial(true); return; }
    // a clean slate each step: the lesson is the shape on the board, not what is left over
    grid = layer(-1); special = layer(null); hp = layer(0); coinCell = layer(0);
    glow = layer(null); appear = layer(0); ghost = layer(null);
    const step = TUT_STEPS[tut.i];
    tut.target = step.setup();
    // the step sets nextColor by hand, so the preview has to be told -- otherwise it keeps
    // showing whatever the last pickNext() rolled and the fruit that lands is not the one
    // the player was looking at
    drawNextPreview(false);
    document.getElementById("tut-text").textContent = d(step.text);
    document.getElementById("hint").textContent = "";
    dirty = true; updateHUD();
  }
  function finishTutorial(completed) {
    const then = tut ? tut.then : "rush";
    tut = null;
    $sh("tut").classList.add("hidden");
    document.body.classList.remove("tut-on");
    if (completed) { try { localStorage.setItem(TUT_KEY, "1"); } catch (e) {} }
    if (then) { start(then); return; }
    running = false; busy = false;
    showMenu();                            // replayed from settings: go back, do not start a run
  }
  // the tutorial owns the board while it runs: only the highlighted cell responds
  const tutAllows = (r, c) => !tut || (tut.target && tut.target[0] === r && tut.target[1] === c);

  // ---- haptics ----
  // A tactile game deserves a tick you can feel. navigator.vibrate is Android-only (iOS
  // Safari has no equivalent), so the toggle hides itself where it cannot work rather than
  // offering a switch that does nothing.
  const HAPTICS_OK = typeof navigator !== "undefined" && typeof navigator.vibrate === "function";
  let haptics = true;
  try { haptics = localStorage.getItem("fs_haptic") !== "0"; } catch (e) {}
  function buzz(ms) { if (haptics && HAPTICS_OK) { try { navigator.vibrate(ms); } catch (e) {} } }
  function setHaptics(v) {
    haptics = !!v;
    try { localStorage.setItem("fs_haptic", haptics ? "1" : "0"); } catch (e) {}
  }

  // ---- settings ----
  // The menu panel is the full set; the pause panel keeps only what you would want to reach
  // mid-run (sound and volume). Both are driven from here so they cannot drift apart.
  function renderMenuSettings() {
    const m = document.getElementById("s-mute");
    m.classList.toggle("off", SFX.muted);
    document.getElementById("s-mute-ic").textContent = SFX.muted ? "🔇" : "🔊";
    document.getElementById("s-mute-t").textContent = d(SFX.muted ? "soundOff" : "soundOn");
    document.getElementById("s-vol-row").classList.toggle("off", SFX.muted);
    const v = document.getElementById("s-vol");
    v.value = Math.round(SFX.volume * 100); v.disabled = SFX.muted;
    document.getElementById("s-vol-v").textContent = v.value;
    const h = document.getElementById("s-haptic");
    h.parentElement.style.display = HAPTICS_OK ? "" : "none";
    h.classList.toggle("off", !haptics);
    document.getElementById("s-haptic-ic").textContent = haptics ? "📳" : "🔕";
    const wrap = document.getElementById("s-lang");
    wrap.textContent = "";
    for (const code of Object.keys(LANGS)) {
      const b = document.createElement("button");
      b.className = "lang-btn" + (code === LANG ? " on" : "");
      b.textContent = LANGS[code];
      b.addEventListener("click", () => { setLang(code); renderMenuSettings(); });
      wrap.appendChild(b);
    }
    document.getElementById("s-ver").textContent = "Fruit Star · " + BUILD_VER;
  }
  function openSettings() { renderMenuSettings(); $sh("settings").classList.remove("hidden"); }
  function closeSettings() { $sh("settings").classList.add("hidden"); }

  function renderSettings() {
    const b = document.getElementById("btn-mute");
    b.classList.toggle("off", SFX.muted);
    document.getElementById("mute-ic").textContent = SFX.muted ? "🔇" : "🔊";
    document.getElementById("mute-t").textContent = d(SFX.muted ? "soundOff" : "soundOn");
    document.getElementById("vol-row").classList.toggle("off", SFX.muted);
    const v = document.getElementById("vol");
    v.value = Math.round(SFX.volume * 100);
    v.disabled = SFX.muted;
    document.getElementById("vol-v").textContent = v.value;
  }
  // anything already on screen has to redraw in the new language, not wait for a reopen
  onLangChange(() => {
    if (!$sh("settings").classList.contains("hidden")) renderMenuSettings();
    if (!$sh("shop").classList.contains("hidden")) renderShop();
    if (!$sh("traits").classList.contains("hidden")) renderTraits();
    if (!$sh("info").classList.contains("hidden")) renderInfo();
    renderItemShop();
    if (running) updateHUD();
  });

  document.getElementById("btn-mute").addEventListener("click", () => {
    SFX.setMuted(!SFX.muted);
    renderSettings();
    if (!SFX.muted) SFX.play("tap");        // hearing it come back is the confirmation
  });
  document.getElementById("vol").addEventListener("input", e => {
    SFX.setVolume(+e.target.value / 100);
    document.getElementById("vol-v").textContent = e.target.value;
  });
  document.getElementById("vol").addEventListener("change", () => SFX.play("coin"));
  renderSettings();

  document.getElementById("btn-resume").addEventListener("click", () => {
    paused = false;
    document.getElementById("pause").classList.add("hidden");
  });
  document.getElementById("rush-next").addEventListener("click", endStageEarly);
  document.getElementById("sh-next").addEventListener("click", closeShop);
  document.getElementById("sh-info").addEventListener("click", () => openInfo("relics"));
  document.getElementById("tr-info").addEventListener("click", () => openInfo("fruits"));
  document.getElementById("tr-reroll").addEventListener("click", () => {
    if (traitRerolls <= 0) return;
    traitRerolls--;
    SFX.play("reroll");
    traitOffers = rollTraits();
    graftArmed = doubles > 0;           // a fresh three, still armed -- rerolling is not opting out
    renderTraits();
  });
  document.getElementById("tr-double").addEventListener("click", () => {
    if (doubles <= 0) return;
    graftArmed = !graftArmed;           // armed, not spent -- picking an unscalable trait keeps it
    renderTraits();
  });
  document.getElementById("info-btn").addEventListener("click", () => openInfo());
  document.getElementById("info-close").addEventListener("click", closeInfo);
  document.getElementById("info-body").addEventListener("scroll", syncInfoFade, { passive: true });
  for (const b of document.querySelectorAll(".itab"))
    b.addEventListener("click", () => openInfo(b.dataset.tab));
  document.getElementById("sh-reroll").addEventListener("click", () => {
    if (coins < shopReroll || !shopOffers.length) return;
    coins -= shopReroll; coinsShown = coins;
    SFX.play("reroll");
    shopReroll += 2;                    // rerolling again in the same shop costs more
    shopOffers = rollOffers(shelfSize());
    shopSold = new Set();
    renderShop();
    announceOffers();                   // a reroll can turn one up too
  });

  document.getElementById("btn-tomain").addEventListener("click", () => {
    paused = false; running = false;
    document.getElementById("shop").classList.add("hidden");
    document.getElementById("pause").classList.add("hidden");
    showMenu();
  });

  // The test dock places pieces straight onto the board and RETURNS before the queue is
  // read, so an accidental tap on it silently replaces every placement with that item while
  // the preview keeps showing the real next fruit. Dev-only from here: ?dev=1.
  if (location.search.includes("dev=1")) document.getElementById("dock").classList.remove("hidden");

  loadBest();
  applyStaticText();   // fill every data-i18n before the first paint
  checkViewport();  // a landscape phone or a half-folded flip is told before it sees a board
  resetRun();       // init the board layers so the render loop is safe before "시작하기"
  loadFruitArt();   // load custom SVG art -> sprite cache
  updateHUD();
  mfxStart();       // menu is visible on boot -> start ambient fruit FX
  // ---- test hook ----
  // Deliberately the LAST thing in the file. It used to sit mid-script, which meant every
  // symbol declared below it had to be wrapped in a getter or the object literal died in
  // the TDZ -- four separate times. Down here everything is already initialised.
  // ?test=1 exposes the pure rule helpers so headless checks can assert the formulas
  // directly. End-to-end replay can't verify them: draw() consumes Math.random() for
  // screen-shake every frame, so a seeded run desyncs with frame timing.
  if (TEST_MODE)
    window.__fs = {
      scorePop, fruitScore, chainBonus, streakMult, pickColor, addScore,
      resetRun, serializeRun, restoreRun, FRUIT_POINTS, COLS,
      MODES, activeColors, spawnCount, brickHpLevel, computeMaxLevel,
      RELICS, notify, modify, applyRelics, activeRelics, relicCap, stageTouches, RELIC_SLOTS,
      settleSlots, tickRelicLife, lifeUnitLabel, TIERS, TIER_KEYS, relicTier,
      get birdFlock() { return birdFlock; }, get crossLine() { return crossLine; },
      get relicLife() { return relicLife; }, set relicLife(v) { relicLife = v; },
      get fruitFlat() { return fruitFlat; },
      openShop, closeShop, buyRelic, discardRelic, renderShop, rollOffers,
      openInfo, closeInfo, renderInfo,
      endStageEarly, leftoverCoins, takeCoin, updateHUD, closeStage, gameOver, COIN_FRUIT_CHANCE, COIN_PER_LEFTOVER, COIN_PAYOUT,
      TRAITS, STAGES_PER_ROUND, stageLabel, traitEffects, rollTraits, openTraits, pickTrait, renderTraits,
      SHOP_OFFERS, SHOP_OFFERS_MAX, shelfSize,
      get shopSold() { return shopSold; },
      get traitRerolls() { return traitRerolls; }, set traitRerolls(v) { traitRerolls = v; },
      get traits() { return traits; }, set traits(v) { traits = v; },
      get doubles() { return doubles; }, set doubles(v) { doubles = v; },
      get offerBonus() { return offerBonus; },
      get traitOffers() { return traitOffers; }, set traitOffers(v) { traitOffers = v; },
      get graftArmed() { return graftArmed; }, set graftArmed(v) { graftArmed = v; },
      get coinCell() { return coinCell; }, set coinCell(v) { coinCell = v; },
      get shopOffers() { return shopOffers; }, set shopOffers(v) { shopOffers = v; },
      get touchBonus() { return touchBonus; }, get spawnBonus() { return spawnBonus; },
      get slotBonus()  { return slotBonus; }, get brickChance() { return brickChance; },
      get chainStep() { return chainStep; }, get coinFruitBonus() { return coinFruitBonus; },
      get starCoinMult() { return starCoinMult; }, get payoutMult() { return payoutMult; },
      bombRadius, BOMB_RADIUS_MAX, itemNeed, ITEM_NEED_MIN,
      gridMult, MULT_GRID, STREAK_STEP_BASE, CHAIN_STEP, multLabel,
      syncRows, ROWS_BASE, ROWS_MAX, layout, COLS, BOARD_MIN, BOARD_MAX,
      checkViewport, MIN_PLAY_H, insets, usableH, usableW,
      SFX, setLang, LANGS, PACKS, d, L, applyStaticText, nameOf,
      renderSettings, openTraits, openInfo, openSettings, closeSettings, renderMenuSettings,
      setHaptics, BUILD_VER, startTutorial, finishTutorial, nextTutStep, tutorialDone,
      TUT_KEY, TUT_STEPS, tutAllows, get tut() { return tut; },
      get previewShows() { return previewShows; },
      HAPTICS_OK, get haptics() { return haptics; },
      get LANG() { return LANG; },
      rollZones, zoneAt, zoneCount, fruitScoreAt, ZONE_BASE,
      announceOffers,
      get zoneCells() { return zoneCells; }, get zoneMult() { return zoneMult; },
      get zoneCoin() { return zoneCoin; }, get zoneBonus() { return zoneBonus; },
      emptyCells, ITEM_PRICES, canBuyItem, armItem, placeBoughtItem, renderItemShop,
      filledCount, get paused() { return paused; }, set paused(v) { paused = v; },
      get armedItem() { return armedItem; }, set armedItem(v) { armedItem = v; },
      get grid() { return grid; }, get special() { return special; },
      get hp() { return hp; }, get coinCell() { return coinCell; },
      BIRD_THRESHOLD, LINE_THRESHOLD, BOMB_THRESHOLD, STAR_THRESHOLD,
      get bombRadiusBonus() { return bombRadiusBonus; }, get itemEase() { return itemEase; },
      get STREAK_CAP() { return STREAK_CAP; }, get STREAK_STEP() { return STREAK_STEP; },
      get relics() { return relics; }, set relics(v) { relics = v; },
      get mode() { return mode; }, set mode(v) { mode = v; },
      get ROWS()        { return ROWS; },        set ROWS(v)        { ROWS = v; },
      get grid()        { return grid; },        set grid(v)        { grid = v; },
      get special()     { return special; },     set special(v)     { special = v; },
      get hp()          { return hp; },          set hp(v)          { hp = v; },
      get glow()        { return glow; },        set glow(v)        { glow = v; },
      get appear()      { return appear; },      set appear(v)      { appear = v; },
      get nextColor()   { return nextColor; },   set nextColor(v)   { nextColor = v; },
      get nextColor2()  { return nextColor2; },  set nextColor2(v)  { nextColor2 = v; },
      get score()       { return score; },       set score(v)       { score = v; },
      get streak()      { return streak; },      set streak(v)      { streak = v; },
      get touchCount()  { return touchCount; },  set touchCount(v)  { touchCount = v; },
      get stage()       { return stage; },       set stage(v)       { stage = v; },
      get stageScore()  { return stageScore; },  set stageScore(v)  { stageScore = v; },
      get touchesLeft() { return touchesLeft; }, set touchesLeft(v) { touchesLeft = v; },
      get coins()       { return coins; },       set coins(v)       { coins = v; },
      get bestStage()   { return bestStage; },   set bestStage(v)   { bestStage = v; },
      fitVal, setQuota, fmtNum, fmtShort, NUM_LOCALE, COMPACT_FROM,
      recordStage, BEST_STAGE_KEY,
      addCoins, COIN_PAYOUT,
      rushQuota, RUSH_TOUCHES, RUSH_SPAWNS, RUSH_BUDS, RUSH_QUOTA_1,
      RUSH_STAGE_MUL, RUSH_ROUND_MUL, RUSH_ROUND_ACCEL, roundSpan, roundMul, rules,
      get busy()        { return busy; },        set busy(v)        { busy = v; },
      get running()     { return running; },     set running(v)     { running = v; },
      get birds()       { return birds; },
      get floats()      { return floats; },
      get links()       { return links; },
      tapItem, spawnBird, chooseBirdTarget,
      // headless Chrome produces no frames under --virtual-time-budget, so rAF never ticks.
      // Item landings live in draw(); tests pump it by hand to advance them.
      draw,
      get oddsMult()    { return oddsMult; },    set oddsMult(v)    { oddsMult = v; },
      colorOdds, BASE_ODDS,
      get fruitMult()   { return fruitMult; },   set fruitMult(v)   { fruitMult = v; },
      get fruitStack()  { return fruitStack; },  set fruitStack(v)  { fruitStack = v; },
      get fruitBoost()  { return fruitBoost; },  set fruitBoost(v)  { fruitBoost = v; },
      fruitScore,
    };

  requestAnimationFrame(draw);
})();
