<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Fruit Star</title>
<style>
  :root {
    --bg: #0f1018;
    --panel: #171a26;
    --cell: #1e2130;
    --text: #e8eaf2;
    --muted: #8b90a6;
  }
  @font-face { font-family: 'Maplestory'; font-weight: 700; font-style: normal; font-display: swap;
    src: url('https://cdn.jsdelivr.net/gh/fonts-archive/Maplestory/Maplestory-Bold.woff2') format('woff2'); }
  @font-face { font-family: 'Maplestory'; font-weight: 400; font-style: normal; font-display: swap;
    src: url('https://cdn.jsdelivr.net/gh/fonts-archive/Maplestory/Maplestory-Light.woff2') format('woff2'); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    box-sizing: border-box;
    background: radial-gradient(120% 100% at 50% 0%, #1a1d2e 0%, var(--bg) 60%);
    color: var(--text);
    font-family: 'Maplestory', -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    overflow: hidden; user-select: none;
    display: flex; flex-direction: column; align-items: center;
  }
  /* Insets go on BODY ONLY. Putting them on html as well applied the notch twice, which on an
     iPhone 14 Pro is 118px of padding where 59 was wanted. env() is 0 where there is no notch. */
  body {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
  }
  /* fixed elements are positioned against the viewport, not the padded body, so the bar on the
     bottom edge has to clear the home indicator itself. The value is set from insets() in
     layout() rather than another env() here: one place reads the insets, everything else asks
     it -- which also makes it checkable, since env() cannot be simulated in a test. */
  #tut { padding-bottom: 18px; }
  #top {
    width: 100%; max-width: 520px; padding: 14px 18px 6px;
    /* equal 1fr side columns keep the center (score) truly centered no matter how wide
       the preview grows (future "예지" relic can add more preview slots) */
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
  }
  /* exactly one of .score-box / .rush-box is in the #top grid at a time -- display:none
     keeps the hidden one out of the flow, or it would claim a column and wrap the preview */
  .score-box, .rush-box { display: flex; flex-direction: column; }
  .score-box.hidden, .rush-box.hidden { display: none; }
  .score-box.center, .rush-box.center { justify-self: center; align-items: center; text-align: center; }
  .score-label { font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  .score-val { font-size: 34px; font-weight: 700; line-height: 1; }
  .best-line { font-size: 12px; color: var(--muted); margin-top: 4px; letter-spacing: .5px; }
  .best-line b { color: var(--text); font-weight: 700; }
  #next-wrap { justify-self: end; display: flex; align-items: center; justify-content: center; gap: 3px;
    padding: 5px 7px; background: var(--cell); border-radius: 16px; overflow: hidden; }
  #np-now  { width: 50px; height: 50px; display: block; }
  #np-next { width: 32px; height: 32px; display: block; opacity: .72; }
  #stats {
    width: 100%; max-width: 520px; padding: 4px 18px 0;
    display: flex; align-items: center; gap: 8px;
  }
  .chip {
    background: var(--panel); border-radius: 999px; padding: 4px 10px;
    font-size: 12px; color: var(--muted); white-space: nowrap;
  }
  .chip b { color: var(--text); font-weight: 800; }
  .chip.lvl { color: var(--text); font-weight: 800; background: #232744; }
  .chip.coin { color: #ffd23e; background: rgba(255,190,40,.12); border: 1px solid rgba(255,190,60,.35); }
  .chip.coin b { color: #ffe9a0; }
  .chip.coin.bump { animation: coinBump .22s ease-out; }
  @keyframes coinBump { 0% { transform: scale(1); } 45% { transform: scale(1.22); } 100% { transform: scale(1); } }
  .chip.lvl .lvmax { color: #ffd23e; margin-left: 4px; font-size: 10px; letter-spacing: 1px; }
  .chip.lvl .lvmax.hidden { display: none; }
  #stats.hidden { display: none; }
  /* ---- Star Rush contract band ----
     The run total is not what you play against turn to turn -- the quota and the touches
     left are, so they are the only "big" tier and get a full-width row of their own. In
     #top's centre column they collided with the next-piece preview under about 400px.
     No progress bar: "0/40" already says it, and a second bar right above the board-fill
     gauge just read as two similar bars meaning different things. */
  #rush { width: 100%; max-width: 520px; padding: 2px 18px 2px; }
  #rush.hidden { display: none; }
  .rb-row { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .rb-cell { display: flex; flex-direction: column; align-items: center; }
  /* the goal takes every spare pixel instead of being sized by its own text. Measured: as the
     score gained digits the 남은 터치 cell slid 149.7 -> 278.3px, live, on every touch -- and
     by round 10 the chips collided and the row was one ⚠️ away from wrapping the board down.
     Absorbing the slack here pins everything to its right. */
  /* overflow:hidden is what actually decouples the box from its text -- with flex alone the
     cell still crept 251 -> 271px on a 10-digit goal and shoved the chips */
  /* max-width also clamps the cell's intrinsic contribution, which is what stops a 10-digit
     goal from widening the whole page -- body here is shrink-to-fit, so without a cap the
     text propagates all the way up. fitVal shrinks the font to match. */
  #rb-quota-cell { flex: 1 1 0; min-width: 0; max-width: 232px; overflow: hidden; }
  #rb-quota { white-space: nowrap; max-width: 100%; }
  .rb-val { font-size: clamp(21px, 6.4vw, 28px); font-weight: 800; line-height: 1;
    letter-spacing: -.5px; white-space: nowrap; }
  /* fixed line box: the ✓ in "목표 달성 ✓" sits taller than the Korean glyphs and grew the
     whole band by 2px the moment the quota was met, nudging the board and dock */
  .rb-lab { font-size: 10px; color: var(--muted); letter-spacing: 1px; margin-top: 3px;
    white-space: nowrap; line-height: 13px; height: 13px; }
  .rb-div { width: 1px; align-self: stretch; margin: 3px 0 6px; background: #2b3048; }
  .rb-chips { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  /* timed relics have to be readable without opening a panel -- they are gone in a stage or
     two and that is exactly when you need to know */
  /* its own row with a reserved height: slipping these into the chip row wrapped the band
     and shoved the board 42px down the moment a timed relic was bought */
  #rs-timed { display: flex; align-items: center; gap: 4px; height: 22px; margin-top: 4px;
    overflow: hidden; }
  .chip.timed { padding: 3px 7px; font-size: 12px; font-weight: 800; color: #ffd6a0;
    background: rgba(255,180,60,.14); border: 1px solid rgba(255,180,60,.4); }
  .chip.timed.last { color: #ff9db0; background: rgba(255,90,110,.16);
    border-color: rgba(255,110,130,.55); animation: lastPulse 1s ease-in-out infinite; }
  @keyframes lastPulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } }
  .rb-stage { font-size: 15px; font-weight: 800; color: var(--text); letter-spacing: .3px; }
  .rb-stage b { color: #ffd23e; }
  #rb-quota-cell.met .rb-val { color: #ffd23e; }
  #rb-quota-cell.met .rb-lab { color: #ffd23e; opacity: .9; }
  #rb-touch-cell.warn .rb-val, #rb-touch-cell.warn .rb-lab { color: #ffab3d; }
  #rb-touch-cell.low  .rb-val, #rb-touch-cell.low  .rb-lab { color: #ff5a5f; }
  #danger-label2 { font-size: 12px; font-weight: 800; color: #ff5a5f; }
  #danger-label2.hidden { display: none; }
  #danger-label { margin-left: auto; font-size: 12px; font-weight: 800; color: #ff5a5f; }
  #danger-label.hidden { display: none; }
  /* segmented board-fill / danger gauge (merges 남은블록 + 위기) */
  #fillgauge {
    width: 100%; max-width: 520px; height: 18px; margin: 6px auto 0;
    display: flex; gap: 2px; padding: 3px; background: #14151d; border-radius: 8px;
  }
  #fillgauge .seg {
    flex: 1; border-radius: 3px; background: #24273a;
    transition: background .15s ease, box-shadow .15s ease;
  }
  #fillgauge .seg.on { box-shadow: inset 0 0 3px rgba(255,255,255,.35); }
  @keyframes segShake { 0%,100%{transform:translateY(0)} 25%{transform:translateY(-2.5px)} 75%{transform:translateY(2.5px)} }
  #fillgauge.danger { box-shadow: 0 0 0 1px rgba(255,70,70,.55); }
  #fillgauge.danger .seg.frontier { animation: segShake .28s ease-in-out infinite; }
  #stage-wrap { position: relative; margin-top: 8px; }
  canvas { display: block; border-radius: 18px; touch-action: none; }
  .gain-pop {
    position: absolute; transform: translate(-50%,-50%);
    font-weight: 900; pointer-events: none; z-index: 5; white-space: nowrap;
    text-align: center; text-shadow: 0 2px 6px rgba(0,0,0,.7), 0 0 2px rgba(0,0,0,.5);
  }
  /* the multipliers are the "why" behind the total, so they get pills of their own rather
     than a faint grey line -- at 12px/80% they flashed past unread */
  .gain-pop .gp-sub { display: flex; gap: 5px; justify-content: center; margin-top: 5px;
    font-size: 0; text-shadow: none; }
  .gain-pop .gp-sub b { font-size: 14px; font-weight: 900; letter-spacing: .2px;
    padding: 2px 9px; border-radius: 999px; white-space: nowrap;
    background: rgba(10,12,20,.72); }
  .gain-pop .gp-chain { color: #9fd6ff; border: 1px solid rgba(90,160,255,.55); }
  .gain-pop .gp-combo { color: #ffcaa0; border: 1px solid rgba(255,140,60,.6); }
  /* fixed height reserved always -> toggling never reflows the board (no up/down jump) */
  #streak-badge {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 22px; margin-top: 5px; font-size: 12px; font-weight: 800;
  }
  #streak-badge.on {
    padding: 1px 9px; border-radius: 999px; color: #ffcaa0;
    background: rgba(255,120,40,.16); border: 1px solid rgba(255,140,60,.5);
  }
  #hint { color: var(--muted); font-size: 13px; margin-top: 10px; height: 16px; }
  /* only appears once the quota is met: bank the touches you did not need, or play on for score */
  /* fixed height, not padding: the enabled and disabled states measured 2px apart and that
     was enough to nudge the board and the dock every time it unlocked */
  #rush-next { margin-top: 8px; height: 44px; padding: 0 22px; font-size: 15px; border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center; line-height: 1;
    background: linear-gradient(90deg,#ffc93c,#43d17a); }
  #rush-next.hidden { display: none; }
  #rush-next:disabled { background: #232842; color: #6a7089; cursor: default; }
  #rush-next span { font-weight: 900; opacity: .75; margin-left: 4px; }
  #rush-next:disabled span { opacity: .5; }
  /* height is fixed and the row is always present: this sits directly under the board, and
     anything that resized with affordability would shove the board on every coin gained */
  #ishop { display: flex; justify-content: center; gap: 8px; height: 54px; margin-top: 8px;
    width: 100%; max-width: 520px; }
  #ishop.hidden { display: none; }
  .ib { margin: 0; width: 62px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 2px; padding: 0; border-radius: 13px; border: 1px solid #2b3048;
    background: #1c2032; color: var(--text); box-shadow: none; font-family: inherit; }
  .ib-ic { font-size: 21px; line-height: 1; }
  .ib-p  { font-size: 11px; font-weight: 800; color: #ffd23e; line-height: 1; }
  .ib:disabled { opacity: .38; }
  .ib:disabled .ib-p { color: #8a93ad; }
  .ib.armed { border-color: #ffd23e; background: #3a3316; }
  .ib.armed .ib-ic { transform: scale(1.12); }
  /* A portrait game cannot force rotation from the web, so it says so. Keyed on HEIGHT, not
     orientation: a tablet in landscape (820 tall) plays fine, a phone in landscape (390) does
     not. Also catches Flip flex mode and cover screens, which are short for the same reason. */
  /* wraps: four language chips do not fit one row on a 320px phone, and a fifth will fit
     even less. The label keeps its own line width so it never squeezes to one glyph. */
  .set-row { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 280px;
    margin: 0 auto 8px; flex-wrap: wrap; }
  .set-toggle { flex: 1; margin: 0; padding: 12px; font-size: 15px; font-weight: 800;
    background: #1e2130; color: var(--text); border-radius: 12px; box-shadow: none; }
  .set-toggle.off { color: var(--muted); }
  .set-lab { font-size: 13px; color: var(--muted); min-width: 46px; text-align: left;
    white-space: nowrap; }
  .lang-picker { flex: 1 1 100%; display: flex; gap: 6px; flex-wrap: wrap; }
  .lang-btn { flex: 1 1 calc(50% - 3px); margin: 0; padding: 9px 6px; font-size: 13px; font-weight: 800;
    background: #1e2130; color: var(--muted); border-radius: 10px; box-shadow: none; }
  .lang-btn.on { background: #3a3316; color: #ffd23e; }
  .set-val { font-size: 13px; color: var(--muted); width: 28px; text-align: right; }
  #vol, #s-vol { flex: 1; accent-color: #ffd23e; }
  #vol-row.off, #s-vol-row.off { opacity: .35; }
  /* The tutorial does NOT cover the board -- it has to be tapped. Only the bubble and the
     skip button are real elements; the dimming and the ring around the cell you may touch are
     drawn on the canvas itself, so they line up with the grid at any board size. */
  /* the lesson is the board. Quota, touch budget, the item bar and the next-stage button all
     belong to a game that has not started yet, and reading them is not the thing being taught */
  body.tut-on #rush, body.tut-on #stats, body.tut-on #ishop,
  body.tut-on #rush-next, body.tut-on #fillgauge { visibility: hidden; }
  #tut { position: fixed; left: 0; right: 0; bottom: 0; z-index: 26; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 0 16px 18px; }
  #tut.hidden { display: none; }
  #tut-bubble { pointer-events: none; max-width: 360px; width: 100%;
    background: rgba(22,25,38,.96); border: 1px solid #2b3048; border-radius: 16px;
    padding: 14px 16px; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  #tut-text { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.5; color: var(--text);
    text-align: center; }
  #tut-skip { pointer-events: auto; margin: 0; padding: 9px 18px; font-size: 13px; }
  #settings { position: fixed; inset: 0; z-index: 30; background: rgba(8,9,15,.92);
    backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center;
    padding: 18px; }
  #settings.hidden { display: none; }
  .set-card { width: 100%; max-width: 340px; max-height: 92vh; overflow-y: auto;
    scrollbar-width: none; -ms-overflow-style: none;
    background: #161926; border-radius: 20px; padding: 18px; border: 1px solid #262b40;
    text-align: center; }
  .set-card h2 { margin: 0 0 14px; font-size: 22px; font-weight: 900; }
  .set-card .ghost-btn.wide { width: 100%; max-width: 280px; margin: 0 auto; }
  .set-ver { font-size: 11px; color: var(--muted); margin: 12px 0 10px; letter-spacing: .5px; }
  .set-toggle.off { color: var(--muted); }
  #rotate { position: fixed; inset: 0; z-index: 40; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: #0b0d16; text-align: center; padding: 20px; }
  #rotate.on { display: flex; }
  .rot-ic { font-size: 44px; transform: rotate(90deg); }
  .rot-t { font-size: 19px; font-weight: 800; color: var(--text); }
  .rot-s { font-size: 13px; color: var(--muted); }
  #dock.hidden { display: none; }
  #dock {
    display: flex; align-items: center; flex-wrap: wrap; justify-content: center;
    gap: 6px; margin-top: 10px; max-width: 520px;
    padding: 8px 10px; background: var(--panel); border-radius: 14px;
  }
  .dock-label { font-size: 11px; color: var(--muted); margin-right: 2px; width: 100%; text-align: center; }
  .dock-btn {
    margin: 0; padding: 5px 9px; font-size: 20px; line-height: 1;
    background: #1e2130; color: #fff; border-radius: 10px; box-shadow: none;
  }
  .dock-btn.fruit { padding: 4px; }
  .dock-btn.fruit img { width: 26px; height: 26px; display: block; }
  .dock-btn.sel { background: linear-gradient(90deg,#ffc93c,#43d17a); color: #12131a; transform: scale(1.08); }
  #overlay {
    position: fixed; inset: 0;
    background: radial-gradient(120% 90% at 50% 0%, #1a1d2e 0%, #0f1018 62%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center; padding: 24px; z-index: 10; overflow: hidden;
    font-family: 'Maplestory', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  }
  #overlay.hidden { display: none; }
  #menu.hidden, #gameover.hidden { display: none; }
  #overlay .big { font-size: 20px; color: var(--text); font-weight: 700; }
  button {
    margin-top: 8px; padding: 14px 34px; font-size: 17px; font-weight: 800;
    border: none; border-radius: 999px; color: #12131a; cursor: pointer;
    background: linear-gradient(90deg,#ffc93c,#43d17a);
    box-shadow: 0 8px 24px rgba(67,209,122,.35);
  }
  button:active { transform: scale(.97); }

  /* ---- main menu ---- */
  #menu { position: relative; z-index: 1; width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; }
  #hero { position: relative; width: 100%; height: 46vh; min-height: 300px; max-height: 430px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .burst { position: absolute; left: 4%; top: 3%; width: 92%; height: 94%; z-index: 0;
    filter: drop-shadow(0 12px 26px rgba(0,0,0,.45)); }
  /* layering inside #menu: burst(0) < fruits(1) < title & buttons(2). fruits float in FRONT of the burst backdrop */
  #menufx { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  #menu > .mode-btn, #menu > .menu-icons, #menu > #menu-msg, #menu > .ver { position: relative; z-index: 2; }
  .title { position: relative; z-index: 2; line-height: .92; }
  /* depth: shadow cast upward, glyph face lit from the top.
     drop-shadow, not text-shadow -- text-shadow paints ON a background-clip:text fill
     (a transparent fill covers nothing), which darkened each glyph's own bottom edge. */
  .title .t1, .title .t2 { font-size: 58px; font-weight: 700;
    filter: drop-shadow(0 -5px 7px rgba(0,0,0,.55)); }
  .title .t1 { letter-spacing: 2px;
    background:
      linear-gradient(180deg, rgba(255,255,255,.36) 0%, rgba(255,255,255,.05) 40%, rgba(0,0,0,.10) 64%, rgba(0,0,0,.28) 100%),
      linear-gradient(90deg,#f5325b,#ff8a1f,#ffc93c,#43d17a,#4d8bff,#a66cff);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .title .t2 { letter-spacing: 5px;
    background: linear-gradient(180deg,#ffffff 0%,#ffffff 46%,#c9cede 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .tagline { position: relative; z-index: 2; color: var(--muted); font-size: 14px; margin: 16px 0 0; }
  .mode-btn { width: 100%; max-width: 320px; margin-top: 14px; padding: 18px; font-size: 20px; font-weight: 800;
    border: none; border-radius: 18px; color: #fff; cursor: pointer; }
  .mode-btn.arcade { background: #e5484d; box-shadow: 0 6px 0 #a3282c; }
  .mode-btn.challenge { background: #7c5cff; box-shadow: 0 6px 0 #503aa8; }
  .mode-btn:active { transform: translateY(3px); box-shadow: none; }
  .menu-icons { display: flex; gap: 34px; margin-top: 42px; }
  .icon-btn { background: none; box-shadow: none; margin: 0; padding: 0; display: flex; flex-direction: column;
    align-items: center; gap: 6px; color: var(--muted); }
  .icon-btn .ic { width: 56px; height: 56px; border-radius: 50%; background: #1e2130; font-size: 24px;
    display: flex; align-items: center; justify-content: center; }
  .icon-btn .lb { font-size: 12px; }
  #menu-msg { min-height: 18px; margin-top: 16px; color: #ffd23e; font-size: 13px; font-weight: 700; }
  .ver { position: fixed; bottom: 14px; left: 0; right: 0; color: #555; font-size: 12px; }
  /* ---- game over ---- */
  #gameover { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .ov-best { font-size: 15px; color: #ffd23e; }
  .ov-best b { color: #ffe9a0; }
  .ov-why { font-size: 14px; opacity: .7; }
  .go-title { font-size: 40px; margin: 0; font-weight: 900;
    background: linear-gradient(90deg,#ff5a7a,#ffc93c,#43d17a,#4d8bff);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .ghost-btn { background: #1e2130 !important; color: var(--text) !important; box-shadow: none !important; }
  /* ---- in-game pause ---- */
  #pause-btn, #info-btn { width: 42px; height: 42px;
    margin: 0; padding: 0; border-radius: 12px; background: #1e2130; color: var(--text);
    font-size: 18px; box-shadow: none; }
  #info-btn { margin: 0; }
  #pause { position: fixed; inset: 0; z-index: 11; background: rgba(10,11,18,.85); backdrop-filter: blur(6px);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  #pause.hidden { display: none; }
  /* ---- between-stage shop ---- */
  /* trait picks stay a list -- they are read, not compared at a glance like relic cards */
  #traits { position: fixed; inset: 0; z-index: 12; background: rgba(8,9,15,.9); backdrop-filter: blur(5px);
    display: flex; align-items: center; justify-content: center; padding: 18px; }
  #traits.hidden { display: none; }
  .trait-row { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
    margin: 0 0 8px; padding: 12px; border: 1px solid #2b3048; border-radius: 14px;
    background: #1c2032; color: var(--text); box-shadow: none; font-family: inherit; cursor: pointer; }
  .trait-row .tr-ic { font-size: 26px; line-height: 1; }
  .trait-row .tr-body { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
  .trait-row .tr-body b { font-size: 14px; font-weight: 800; }
  .trait-row .tr-body span { font-size: 11px; color: var(--muted); line-height: 1.4; white-space: normal; }
  .trait-row.boost { border-color: #6f5bd6; background: #221f3a; }
  .trait-row.boost .tr-body span { color: #c4b6ff; }
  #tr-double, #tr-info { margin: 0 0 0 6px; padding: 7px 12px; font-size: 12px; border-radius: 999px; }
  #tr-double.on { background: linear-gradient(90deg,#a66cff,#6f5bd6) !important; color: #fff !important; }
  #tr-double.hidden { display: none; }
  #shop { position: fixed; inset: 0; z-index: 12; background: rgba(8,9,15,.9); backdrop-filter: blur(5px);
    display: flex; align-items: center; justify-content: center; padding: 18px; }
  #shop.hidden { display: none; }
  .shop-card { width: 100%; max-width: 400px; max-height: 92vh; overflow-y: auto;
    scrollbar-width: none; -ms-overflow-style: none;
    background: #161926; border-radius: 20px; padding: 16px; border: 1px solid #262b40; }
  .shop-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .shop-title { font-size: 17px; font-weight: 800; color: var(--text); }
  .shop-title b { color: #ffd23e; }
  /* cards, laid out 2 + 1 for three offers and 2 + 2 for four (a "+1 offer" trait later) */
  .offer-grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .offer { width: calc(50% - 5px); display: flex; flex-direction: column; align-items: center;
    gap: 6px; margin: 0; padding: 12px 10px; border: 1px solid #2b3048; border-radius: 16px;
    background: #1c2032; color: var(--text); box-shadow: none; font-family: inherit;
    cursor: pointer; text-align: center; }
  .offer.off { opacity: .42; cursor: default; }
  .offer.sold { opacity: .3; cursor: default; filter: grayscale(1); }
  .offer.sold .of-price { color: #8a93ad; }
  /* rare and legendary announce themselves -- a slow breathing glow, not a flash */
  .offer.shine { position: relative; overflow: hidden; }
  .offer.shine::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
    background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.16) 50%, transparent 65%);
    transform: translateX(-120%); animation: sheen 2.6s ease-in-out infinite;
  }
  .offer.shine-rare   { box-shadow: 0 0 0 1px rgba(196,139,255,.5), 0 0 18px rgba(196,139,255,.28);
    animation: pulseRare 2.4s ease-in-out infinite; }
  /* rare's sweep hangs back so legendary's has somewhere to go */
  .offer.shine-rare::after { animation-duration: 3.4s; opacity: .5; }

  /* Legendary is a 1% draw, so it reads as a different KIND of card rather than a brighter
     rare: gold body, doubled rim, a fast bright sweep, a breathing icon and a shimmering
     label. Same glow in two colours was landing as the same grade at a glance. */
  .offer.shine-legend { border-width: 2px;
    background: linear-gradient(155deg, rgba(84,64,16,.55) 0%, #1c2032 58%);
    box-shadow: 0 0 0 1px rgba(255,201,60,.6), 0 0 22px rgba(255,201,60,.36);
    animation: pulseLegend 2.1s ease-in-out infinite; }
  .offer.shine-legend::after { animation-duration: 1.9s;
    background: linear-gradient(115deg, transparent 30%, rgba(255,233,160,.34) 50%, transparent 70%); }
  .offer.shine-legend .of-ic { animation: legendIcon 2.1s ease-in-out infinite; }
  .offer.shine-legend .of-tier {
    background: linear-gradient(90deg, #ffc93c 0%, #fff8d6 45%, #ffc93c 90%);
    background-size: 220% 100%; -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; animation: tierShimmer 2.4s linear infinite; }
  .offer.sold.shine::after { animation: none; }
  .offer.sold.shine-rare, .offer.sold.shine-legend { box-shadow: none; animation: none; }
  /* sold is sold: grayscale alone left the gold body and the moving parts alive */
  .offer.sold.shine-legend { background: #1c2032; border-width: 1px; }
  .offer.sold.shine-legend .of-ic { animation: none; }
  .offer.sold.shine-legend .of-tier { animation: none; -webkit-text-fill-color: currentColor; }
  @keyframes sheen { 0% { transform: translateX(-120%); } 55%, 100% { transform: translateX(120%); } }
  @keyframes pulseRare {
    0%, 100% { box-shadow: 0 0 0 1px rgba(196,139,255,.5), 0 0 14px rgba(196,139,255,.22); }
    50%      { box-shadow: 0 0 0 1px rgba(196,139,255,.8), 0 0 26px rgba(196,139,255,.45); } }
  @keyframes pulseLegend {
    0%, 100% { box-shadow: 0 0 0 1px rgba(255,201,60,.55), 0 0 16px rgba(255,201,60,.28);
               transform: scale(1); }
    50%      { box-shadow: 0 0 0 2px rgba(255,201,60,1), 0 0 40px rgba(255,201,60,.75);
               transform: scale(1.022); } }
  @keyframes legendIcon {
    0%, 100% { transform: scale(1);    filter: drop-shadow(0 0 3px rgba(255,201,60,.45)); }
    50%      { transform: scale(1.12); filter: drop-shadow(0 0 12px rgba(255,201,60,.95)); } }
  @keyframes tierShimmer { 0% { background-position: 120% 0; } 100% { background-position: -120% 0; } }
  .of-tier { font-size: 10px; font-weight: 800; letter-spacing: 1px; }
  .of-name { font-size: 14px; font-weight: 800; }
  .of-ic { font-size: 40px; line-height: 1.1; }
  .of-desc { font-size: 11px; color: var(--muted); line-height: 1.4; white-space: normal;
    min-height: 31px; }
  .of-price { font-size: 13px; font-weight: 800; color: #ffd23e; white-space: nowrap; }
  .of-price.nofit { color: #ff8fa3; }
  .shop-empty { padding: 14px; text-align: center; color: var(--muted); font-size: 13px; }

  /* ---- info popup: what am I carrying, and what are the odds right now ---- */
  #info { position: fixed; inset: 0; z-index: 13; background: rgba(8,9,15,.92);
    backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; padding: 18px; }
  #info.hidden { display: none; }
  /* Fixed height with the list scrolling inside. Sizing to content meant the card jumped
     every time you changed tab -- the odds table is seven rows and the help is three screens. */
  .info-card { width: 100%; max-width: 380px; height: min(86vh, 620px);
    display: flex; flex-direction: column;
    background: #161926; border-radius: 20px; padding: 14px; border: 1px solid #262b40; }
  .info-tabs { display: flex; gap: 6px; margin-bottom: 10px; flex: none; }
  /* min-width:0 is what actually makes them equal: without it the longest label sets the
     basis and that one tab grows wider than the rest */
  .itab { flex: 1 1 0; min-width: 0; white-space: nowrap; overflow: hidden;
    margin: 0; padding: 9px 4px; font-size: 12px; font-weight: 800; border-radius: 12px;
    background: #1c2032; color: var(--muted); box-shadow: none; font-family: inherit; }
  .itab.on { background: #2a2f4d; color: var(--text); }
  .inf-row { display: flex; align-items: center; gap: 10px; padding: 9px 10px; margin-bottom: 6px;
    background: #1c2032; border-radius: 12px; }
  .inf-row.inert { opacity: .38; }
  .inf-ic { font-size: 24px; }
  .inf-fruit { width: 30px; height: 30px; display: block; flex: none; }
  .ftab-row { display: grid; grid-template-columns: 30px 1fr 68px 60px; align-items: center;
    gap: 10px; padding: 8px 12px; margin-bottom: 5px; background: #1c2032; border-radius: 12px; }
  .ftab-row.ftab-head { background: none; padding: 0 12px 4px; margin-bottom: 2px;
    font-size: 10px; color: var(--muted); letter-spacing: 1px; }
  .ftab-head span:nth-child(3), .ftab-head span:nth-child(4) { text-align: right; }
  .ft-name { font-size: 13px; font-weight: 800; }
  .ft-score, .ft-odds { font-size: 14px; font-weight: 800; text-align: right; }
  .ft-score { color: var(--text); }
  .ft-score.up { color: #7ee0a0; }        /* a relic or trait raised it */
  .ft-odds { color: #ffd23e; }
  .ft-odds.up { color: #ffa94d; }
  .inf-body { flex: 1; min-width: 0; }
  .inf-body b { display: block; font-size: 13px; font-weight: 800; color: var(--text); }
  .inf-body span { font-size: 11px; color: var(--muted); line-height: 1.35; }
  .inf-num { font-size: 13px; font-weight: 800; color: #ffd23e; white-space: nowrap; }
  /* green, and a plus sign: this hands coins back, it does not charge for them */
  .inf-drop { margin: 0 0 0 8px; padding: 6px 10px; font-size: 11px; font-weight: 800;
    border-radius: 999px; background: #1e3328; color: #7ee0a0; box-shadow: none;
    border: 1px solid rgba(126,224,160,.35); font-family: inherit; white-space: nowrap; }
  .inf-empty { padding: 16px; text-align: center; color: var(--muted); font-size: 13px; }
  .inf-count { padding: 2px 2px 8px; font-size: 12px; font-weight: 800; color: var(--muted);
    letter-spacing: .5px; }
  .help-h { font-size: 12px; font-weight: 800; color: #ffd23e; letter-spacing: 1px;
    margin: 14px 2px 6px; }
  .help-h:first-child { margin-top: 2px; }
  .help-p { font-size: 13px; line-height: 1.6; color: var(--text); margin: 0 2px 7px; }
  .help-p b { color: #ffd23e; }
  /* hold the taller tab's height (7 fruit rows) so switching tabs doesn't resize the card
     under your thumb -- it jumped 537px -> 177px before */
  /* A scrollbar sitting in a help panel looks like a document, not a game. The bar is hidden
     and dragging still works; a fade at the bottom edge says there is more, and goes away at
     the end -- which is the job the bar was doing, without the chrome. */
  .noscroll { scrollbar-width: none; -ms-overflow-style: none; }
  .noscroll::-webkit-scrollbar, .set-card::-webkit-scrollbar, .shop-card::-webkit-scrollbar {
    width: 0; height: 0; display: none; }
  .fade-wrap { position: relative; flex: 1; min-height: 0; display: flex; }
  .fade-wrap::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 34px;
    pointer-events: none; opacity: 0; transition: opacity .18s;
    background: linear-gradient(to bottom, rgba(22,25,38,0), rgba(22,25,38,.97)); }
  .fade-wrap.more::after { opacity: 1; }
  #info-body { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #info-close { width: 100%; margin-top: 8px; flex: none; }
  .top-left { justify-self: start; display: flex; gap: 6px; }
  .shop-actions { display: flex; gap: 8px; margin-top: 10px; }
  .shop-actions button { flex: 1; margin: 0; padding: 12px 8px; font-size: 14px; border-radius: 14px; }
  .shop-actions button:disabled { opacity: .4; }
  #pause h2 { color: var(--text); font-size: 30px; margin: 0 0 6px; font-weight: 900; }
  #pause button { width: 220px; }
</style>

  // 1.4000000000000001, so rounding at the source is the only way a second decimal can never
  // exist. Every relic that moves these must move them by a multiple of 0.1.
  const MULT_GRID = 10;
  const gridMult = v => Math.round(v * MULT_GRID) / MULT_GRID;
  const STREAK_STEP_BASE = 0.1;

  const STAGES_PER_ROUND = 3;  // a round is 1-1, 1-2, 1-3; traits land when a round ends

  const RUSH_SPAWNS    = 2;    // per turn. base 2 -> relic +1 -> trait +1 tops out at 4

  // a bigger step when a round turns over. A single x1.5 per stage made round 1 free

  const RUSH_ROUND_MUL = 1.25; // step across the FIRST round boundary

                                 // compounds, so a fixed round step gets outrun by round 4.
  // A whole round advances by its internal steps AND the boundary jump, so the round
  // multiplier compounds on the END of the previous round -- otherwise the quota drops
  // when a round turns over.
  const roundMul = r => RUSH_ROUND_MUL + RUSH_ROUND_ACCEL * r;   // r = boundary index, 0-based

  // ---- canvas / layout ----
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  let cell, pad, dpr, boardPx, boardH;

  const BOARD_MIN = 260, BOARD_MAX = 520, CHROME_H = 220;
  // below this the HUD, board and item bar cannot all fit at any board size
  const MIN_PLAY_H = 520;
  function checkViewport() {
    const bad = usableH() < MIN_PLAY_H;
    document.getElementById("rotate").classList.toggle("on", bad);
    return !bad;

  // viewport-fit=cover means innerHeight/innerWidth INCLUDE the area behind the notch and the
  // home indicator, which is not usable. Read what the browser actually resolved env() to and
  // take it off, or the board is sized against space it cannot have.
  function insets() {
    const cs = getComputedStyle(document.body);
    const t = parseFloat(cs.paddingTop) || 0, b = parseFloat(cs.paddingBottom) || 0;
    const l = parseFloat(cs.paddingLeft) || 0, r = parseFloat(cs.paddingRight) || 0;
    return { top: t, bottom: b, left: l, right: r, x: l + r, y: t + b };

    const maxW = Math.min(usableW() - 24, BOARD_MAX, byHeight);

    // licence to overflow: at 320x568 with a grown 12-row board it pushed the item bar 28px
    // off the bottom. Clamp it back under the height budget.
    boardPx = Math.min(Math.max(BOARD_MIN, maxW), Math.max(byHeight, 200));

    if (!rules().touchBudget || stage <= bestStage) return;
    bestStage = stage;
    localStorage.setItem(BEST_STAGE_KEY, bestStage);
  }

  // ---- run state ----
  // One run's worth of state, declared in one place. Everything listed in serializeRun()
  // is JSON-safe, so a long Star Rush run can survive the phone evicting the tab. Session
  // flags (running/busy/paused), effect buffers (particles/waves/...) and layout are
  // deliberately NOT run state -- they are rebuilt, not restored.
  const TEST_MODE = location.search.includes("test=1");
  const BUILD_VER = "0.9";   // shown in settings so a bug report can name a build
  const RUN_VERSION = 1;
  const layer = fill => Array.from({ length: ROWS }, () => Array(COLS).fill(fill));

  function resetRun() {
    ROWS = 8;                              // Star Rush grows this mid-run; runs start at 8
    grid = layer(-1); special = layer(null); hp = layer(0);
    coinCell = layer(0);
    glow = layer(null); appear = layer(0); ghost = layer(null);   // display-only layers
    nextColor = null; nextColor2 = null;   // null queue -> pickNext refills both slots
    score = 0; streak = 0; touchCount = 0;
    stage = 1; stageScore = 0; touchesLeft = RUSH_TOUCHES;
    touchBonus = 0; spawnBonus = 0; slotBonus = 0; brickChance = 0; offerBonus = 0;
    chainStep = 0; coinFruitBonus = 0; starCoinMult = 1; payoutMult = 1;
    bombRadiusBonus = 0; itemEase = 0; birdFlock = 1; crossLine = false;
    zoneMult = 1; zoneCoin = false; zoneBonus = 0; zoneCells = new Set();
    STREAK_STEP = STREAK_STEP_BASE; STREAK_CAP = 2.0;
    traits = []; doubles = 0; armedItem = null;
    coins = 0; coinsShown = 0; coinFly = [];
    oddsMult = [0, 0, 0, 0, 0, 0, 0];
    fruitMult = [1, 1, 1, 1, 1, 1, 1];
    fruitStack = [0, 0, 0, 0, 0, 0, 0];
    fruitBoost = [1, 1, 1, 1, 1, 1, 1];
    fruitFlat  = [0, 0, 0, 0, 0, 0, 0];
    relics = []; relicLife = {};
    layout();                              // ROWS may have changed -> resize the board
  }
  function serializeRun() {
    return { v: RUN_VERSION, mode, rows: ROWS, grid, special, hp, coinCell,
             nextColor, nextColor2, score, streak, touchCount,
             stage, stageScore, touchesLeft, coins, oddsMult, fruitMult,
             fruitStack, fruitBoost, relics, relicLife, traits, doubles };
  }
  function restoreRun(o) {
    if (!o || o.v !== RUN_VERSION) return false;   // unknown/older save -> caller starts fresh
    mode = MODES[o.mode] ? o.mode : "arcade";     // a saved rush run must come back as rush
    ROWS = o.rows;
    ({ grid, special, hp, coinCell, nextColor, nextColor2, score, streak, touchCount,
       stage, stageScore, touchesLeft, coins, oddsMult, fruitMult,
       fruitStack, fruitBoost, relics, relicLife, traits, doubles } = o);
    coinsShown = coins; coinFly = [];
    glow = layer(null); appear = layer(0); ghost = layer(null);
    layout(); dirty = true;
    return true;
  }
  function resetEffects() {
    particles = []; birds = []; flares = []; waves = []; links = []; floats = []; coinFly = [];
    shake = 0; flash = 0; dirty = true;
  }
  function randInt(n) { return Math.floor(Math.random() * n); }
  // staged difficulty: milestone m unlocks, in order, brick / color / spawn (cycling)
  function milestone() { return Math.floor(score / MILESTONE_STEP); }
  function level() { return Math.min(MAX_LEVEL, milestone() + 1); }   // Lv.1 at score 0

  // ---- mode rules ----
  // The two modes share the whole board mechanic and differ only in the knobs below.
  // Keeping the differences in one table stops `if (mode === "rush")` from being sprayed
  // through the engine, which is what makes a second mode expensive to add.
  //   Arcade: difficulty climbs with your score (colours 4->7, spawns 1->4, bricks unlock).
  //   Rush:   the board stays flat and difficulty comes from stage quotas and relics,
  //           with all 7 colours from the first turn (design doc 10-4).
  const MODES = {
    arcade: {
      startBuds: START_BUDS,
      scaleWithScore: true,                                 // HUD shows a Lv. chip
      touchBudget: false,                                   // no touch limit; play till the board fills
      odds:    () => null,                                  // uniform, as arcade has always been
      colors:  m => Math.min(MAX_COLORS, BASE_COLORS + Math.floor((m + 1) / 3)),
      spawns:  m => Math.min(SPAWN_MAX, SPAWN_BASE + Math.floor(m / 3)),
      brickHp: m => Math.min(3, Math.floor((m + 2) / 3)),   // 0 = none, else 1..3
    },
    rush: {
      startBuds: RUSH_BUDS,
      scaleWithScore: false,
      touchBudget: true,                                    // a stage is N touches to hit a quota
      quota: rushQuota,
      touches: RUSH_TOUCHES,
      colors:  () => MAX_COLORS,                            // 7 from the start
      odds:    () => BASE_ODDS,                             // rare fruit = valuable fruit
      spawns:  () => RUSH_SPAWNS,                           // relics raise this, not the score
      brickHp: () => 0,                                     // bricks arrive via risk relics
    },
  };
  let mode = "arcade";
  const rules = () => MODES[mode];

  // difficulty knobs (accept an explicit milestone m; default = current)
  function brickHpLevel(m = milestone()) { return rules().brickHp(m); }
  function activeColors(m = milestone()) { return rules().colors(m); }
  function spawnCount(m = milestone()) { return rules().spawns(m) + spawnBonus; }
  function stageTouches() { return rules().touches + touchBonus; }
  // max meaningful level = milestone where every arcade knob first reaches its cap (+1).
  // Arcade-only: it drives the Lv. chip, and rush has no score-driven ramp.
  function computeMaxLevel() {
    const a = MODES.arcade;
    for (let m = 0; m < 200; m++)
      if (a.colors(m) === MAX_COLORS && a.spawns(m) === SPAWN_MAX && a.brickHp(m) === 3)
        return m + 1;
    return 10;
  }
  MAX_LEVEL = computeMaxLevel();
  function addShake(a) { shake = Math.min(SHAKE_MAX, shake + a); }

  // ---- spawn-colour chokepoint ----
  // Odds always total 100%. A relic gives a fruit N more helpings of its OWN base share:
  // oddsMult[banana] = 1 means "one more banana's worth", 6% -> 12%, and the untouched
  // fruits shrink proportionally to pay for it. Stating it in multiples rather than
  // percentage points is what lets a relic just say "바나나가 1만큼 더 등장합니다" -- the
  // exact percentage belongs in the fruit table, not in every relic's description.
  // ACCUMULATED, not derived: these grow through play and must survive a recompute, unlike
  // fruitMult which applyRelics() rebuilds from the owned relics every time.
  let fruitStack = [0, 0, 0, 0, 0, 0, 0];  // base points earned by popping that fruit
  let fruitBoost = [1, 1, 1, 1, 1, 1, 1];  // "double its current value" effects, banked
  let fruitFlat  = [0, 0, 0, 0, 0, 0, 0];  // flat points from relics -- derived, so selling
                                           // one (or letting it expire) takes them back
  let relics = [];                         // ids of the relics owned this run
  let relicLife = {};                      // id -> charges left, for the ones that expire
  // derived from the owned relics -- never written directly, always recomputed by applyRelics()
  let touchBonus = 0, spawnBonus = 0, slotBonus = 0, brickChance = 0, offerBonus = 0;
  // more knobs for relics to turn. All derived: applyRelics() resets them every recompute.
  let chainStep = 0, coinFruitBonus = 0, starCoinMult = 1, payoutMult = 1,
      bombRadiusBonus = 0, itemEase = 0, birdFlock = 1, crossLine = false;
  // Bonus zones. Marked cells that pay extra when you pop on them -- the map layer the design
  // called for and nothing had built. They exist only while a zone relic is owned, so a run
  // without one plays exactly as before. Stored as flat r*COLS+c indices, which stay valid
  // when 개간 appends a row (COLS is fixed).
  const ZONE_BASE = 3;
  let zoneCells = new Set(), zoneMult = 1, zoneCoin = false, zoneBonus = 0;
  const zoneOn = () => zoneMult > 1 || zoneCoin;
  const zoneCount = () => zoneOn() ? Math.min(ROWS * COLS, ZONE_BASE + zoneBonus) : 0;
  const zoneAt = (r, c) => zoneCells.has(r * COLS + c);
  // a fruit is worth more on a marked cell
  const fruitScoreAt = (r, c, colorIdx) => {
    const base = fruitScore(colorIdx);
    return zoneAt(r, c) ? Math.round(base * zoneMult) : base;
  };
  // Rerolled every stage. Pinned for the whole run they would just become "never place there",
  // and a zone you cannot reach is a zone that never pays.
  function rollZones() {
    zoneCells = new Set();
    const n = zoneCount(); if (!n) return;
    const all = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) all.push(r * COLS + c);
    for (let i = 0; i < n && all.length; i++) zoneCells.add(all.splice(randInt(all.length), 1)[0]);
  }
  let traits = [];                         // [{id, amount}] -- amount may have been doubled
  let doubles = 0;                         // unspent "next trait x2" charges
  const RELIC_SLOTS = 8;                   // base carry limit (doc 6)
  const relicCap = () => RELIC_SLOTS + slotBonus;
  // over the cap, the extras are carried but inert (doc 6): losing a slot must not destroy
  // a relic, and which ones go quiet is then a decision rather than a deletion
  const activeRelics = () => relics.slice(0, relicCap());
  let oddsMult = [0, 0, 0, 0, 0, 0, 0];         // extra helpings of each fruit's base share
  function colorOdds() {
    const n = activeColors();
    const base = rules().odds();
    const out = new Array(n);
    let baseSum = 0;
    for (let i = 0; i < n; i++) { out[i] = base ? base[i] : 1; baseSum += out[i]; }
    for (let i = 0; i < n; i++) out[i] = out[i] / baseSum * 100;   // normalise to 100

    let boosted = 0, restBase = 0;
    for (let i = 0; i < n; i++) {
      if (oddsMult[i] > 0) boosted += out[i] * (1 + oddsMult[i]);
      else restBase += out[i];
    }
    if (boosted <= 0) return out;
    if (boosted >= 100) {                        // boosts ate the whole pool -> split it
      for (let i = 0; i < n; i++)
        out[i] = oddsMult[i] > 0 ? out[i] * (1 + oddsMult[i]) / boosted * 100 : 0;
      return out;
    }
    const scale = restBase > 0 ? (100 - boosted) / restBase : 0;
    for (let i = 0; i < n; i++)
      out[i] = oddsMult[i] > 0 ? out[i] * (1 + oddsMult[i]) : out[i] * scale;
    return out;
  }
  function pickColor() {
    const p = colorOdds();
    let t = Math.random() * 100;
    for (let i = 0; i < p.length; i++) { t -= p[i]; if (t < 0) return i; }
    return p.length - 1;                         // float rounding guard
  }

  // ---- scoring chokepoint ----
  // Every point earned flows through addScore(), and pop scoring is assembled from the
  // named terms of the Star Rush formula (doc 3-2). Relics bend a term here instead of
  // patching scattered `score +=` sites -- which is how a relic quietly misses a path.
  // 0.2, not the 0.15 it was: halving the combo step to land it on the 0.1 grid cost about
  // half a run's reach, and this is the only lever that gives it back without leaving the
  // grid. Measured over 6 bot runs the median stage came back to where it was.
  const CHAIN_STEP = 0.2;                  // chain-size bonus per extra cleared cell
  let fruitMult = [1, 1, 1, 1, 1, 1, 1];   // per-colour multiplier; all 1.0 today
  function chainBonus(cleared) {
    return gridMult(1 + Math.max(0, cleared - 1) * (CHAIN_STEP + chainStep));
  }
  // (base + what popping it has banked) x banked doublings x the relics you carry
  function fruitScore(colorIdx) {          // one fruit's worth, before chain/streak
    const base = (FRUIT_POINTS[colorIdx] || 1) + (fruitStack[colorIdx] || 0)
               + (fruitFlat[colorIdx] || 0);
    // rounded here so multipliers can never leak a decimal onto the board
    return Math.round(base * (fruitBoost[colorIdx] || 1) * (fruitMult[colorIdx] || 1));
  }
  function addScore(amount) {
    if (!(amount > 0)) return 0;
    score += amount;
    stageScore += amount;        // quota progress; reset at each stage, unlike `score`
    if (score > best) { best = score; localStorage.setItem(BEST_KEYS[mode], best); }
    return amount;
  }
  // basePts = summed fruitScore of everything credited; cleared = group size for the bonus
  // Number display. Two jobs, two rules -- and the split is the whole point.
  //   HUD goal/score : every digit. This is the readout you check to decide "one more touch
  //                    or bank it", so "2.4만/3.9만" is useless -- the gap is what you read.
  //   fruit pops     : compact past 10,000. Precision there is decoration, the space is one
  //                    cell, and a dozen land at once.
  // Locale picks the suffix, so K-vs-만 is not a design choice: ko gives 만/억, en gives K/M,
  // ja/zh group by four digits like ko. The threshold is ours, not Intl's -- Intl compacts
  // Korean from 1,000 as 천, and "1.1천" reads worse than "1,100"; nobody says it. Starting
  // at 10,000 skips 천 entirely and lands straight on 만.
  const NUM_LOCALE = (navigator.languages && navigator.languages[0]) || navigator.language || "ko";
  const fmtNum = n => Math.round(n).toLocaleString(NUM_LOCALE);
  const COMPACT_FROM = 10000;
  // old WebViews accept `notation` and silently ignore it, so prove it actually compacts
  const mkCompact = digits => {
    try {
      const f = new Intl.NumberFormat(NUM_LOCALE, { notation: "compact", maximumFractionDigits: digits });
      if (f.format(12345) !== (12345).toLocaleString(NUM_LOCALE)) return f;
    } catch (e) {}
    return null;                     // unsupported: full digits everywhere, still readable
  };
  const compactFmt = mkCompact(1), compactFmt0 = mkCompact(0);
  const fmtShort = n => {
    n = Math.round(n);
    return compactFmt && Math.abs(n) >= COMPACT_FROM ? compactFmt.format(n) : fmtNum(n);
  };

  // a fixed box still has to hold a number that keeps growing, so shrink to fit rather than
  // clip. Runs once per touch, not per frame.
  // Returns false if fitting would push the text below `floor`.
  function fitVal(el, floor) {
    el.style.fontSize = "";                    // measure at the CSS size, not last turn's
    const box = el.parentElement.clientWidth, w = el.scrollWidth;
    if (!box || !w || w <= box) return true;
    const base = parseFloat(getComputedStyle(el).fontSize) || 21;
    const want = base * box / w;
    el.style.fontSize = Math.max(floor, want) + "px";
    return want >= floor;
  }

  // Full digits are worth real estate here -- the goal chip is what you read to decide "one
  // more touch or bank it", and 2.4만/3.9만 hides exactly the gap you are judging. But on a
  // 320px phone `99,994/161,280` only fits by dropping to 14px, which is not readable. So:
  // full digits while they fit legibly, compact the moment they do not. Big screens keep the
  // precision, small ones stay readable, and the locale picks 만 or K on its own.
  const QUOTA_MIN_PX = 18;
  function setQuota(el, cur, goal) {
    el.textContent = `${fmtNum(cur)}/${fmtNum(goal)}`;
    if (fitVal(el, QUOTA_MIN_PX)) return;
    el.textContent = `${fmtShort(cur)}/${fmtShort(goal)}`;
    if (fitVal(el, QUOTA_MIN_PX) || !compactFmt0) return;
    // last resort, and it is a real case: round 10 on a 320px phone. Dropping the decimal
    // buys back more width than any font step can -- 248.9만/401.5만 -> 249만/402만.
    const c0 = n => Math.abs(n) >= COMPACT_FROM ? compactFmt0.format(Math.round(n)) : fmtNum(n);
    el.textContent = `${c0(cur)}/${c0(goal)}`;
    fitVal(el, 13);
  }

  function scorePop(basePts, cleared) {
    if (streak > 0) SFX.play("combo", streak);
    const raw = basePts * chainBonus(cleared) * streakMult();
    return addScore(Math.round(modify("pop", raw, { basePts, cleared })));
  }

  // ---- relics ----
  // Two ways a relic acts. notify() fires at a named moment (drop a coin, bump a counter);
  // modify() folds a value through every owned relic in order, so score/odds bonuses stack
  // without each one having to know about the others. Passive effects that just set up the
  // run (spawn weights, fruit multipliers, extra rows) belong in apply(), run once at start.
  // RELICS is empty until Phase 2 -- with no relics owned, both calls are a no-op.
  // Traits are DATA, not closures: every effect declares {stat, target, amount} so a
  // "double the next trait" consumable can just scale `amount` (doc 7). scalable:false marks
  // the ones where doubling has no meaning. Multiplier effects are additive for the same
  // ---- language --------------------------------------------------------------------
  // Descriptions are written as CALLS INTO the language pack, not as sentences. 70% of the
  // 84 relic/trait descriptions share a phrasing with at least one other ("F 점수 배율 +N"
  // alone covers 13), so a new relic that reuses a pattern is translated in every language
  // the moment it is added -- no new strings to write, nothing to forget.
  //
  // Two rules keep it safe as the game grows:
  //   1. every lookup falls back ko -> key, so a missing translation shows Korean, never blank
  //   2. tools/i18n-test.py fails on any key present in ko and missing elsewhere
  const LANGS = { ko: "한국어", en: "English", ja: "日本語", zh: "简体中文" };

  const FRUIT_KO = ["체리", "오렌지", "키위", "레몬", "포도", "복숭아", "바나나"];
  const FRUIT_EN = ["Cherry", "Orange", "Kiwi", "Lemon", "Grape", "Peach", "Banana"];
  const FRUIT_JA = ["さくらんぼ", "オレンジ", "キウイ", "レモン", "ぶどう", "もも", "バナナ"];
  const FRUIT_ZH = ["樱桃", "橙子", "猕猴桃", "柠檬", "葡萄", "桃子", "香蕉"];
  const listJa = a => a.join("・");
  const listZh = a => a.join("和");
  const listKo = a => a.join("·");
  // Korean object particle: 레몬 takes 을, 체리 takes 를. Getting this wrong is the most
  // obvious possible tell that text was assembled by a machine, and it is one line of code.
  const hasJong = w => {
    const c = w.charCodeAt(w.length - 1);
    return c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 !== 0;
  };
  const eul = w => w + (hasJong(w) ? "을" : "를");
  const listEn = a => a.length < 2 ? a[0] : a.slice(0, -1).join(", ") + " and " + a[a.length - 1];
  const n1 = v => +(+v).toFixed(2);

  const PACKS = {
    ko: {
      _fruit: FRUIT_KO, _list: listKo,
      // --- shared description patterns (the 70%) ---
      fruitFlat:  (f, n) => `${FRUIT_KO[f]} 점수 +${n}`,
      fruitMult:  (f, n) => `${FRUIT_KO[f]} 점수 배율 +${n1(n)}`,
      fruitsMult: (fs, n) => `${listKo(fs.map(i => FRUIT_KO[i]))} 점수 배율 +${n1(n)}`,
      odds:       (fs, n) => `${listKo(fs.map(i => FRUIT_KO[i]))} ${n1(n)}만큼 더 등장`,
      stackOnPop: (f, n) => `${eul(FRUIT_KO[f])} 터뜨릴 때마다 ${FRUIT_KO[f]} 점수 +${n}`,
      anyStackOnPop: n => `과일을 터뜨릴 때마다 그 과일 점수 +${n}`,
      allFlat:    n => `모든 과일 점수 +${n}`,
      allMult:    n => `모든 과일 점수 배율 +${n1(n)}`,
      touch:      n => `스테이지마다 터치 +${n}`,
      spawn:      n => `매 턴 과일 +${n}`,
      payoutFlat: n => `스테이지 정산 코인 +${n}`,
      payoutPct:  n => `스테이지 정산 코인 +${n}%`,
      coinFruit:  n => `코인 달린 과일 확률 +${n}%p`,
      popMult:    n => `터뜨린 점수 ×${n1(n)}`,
      popMultRun: n => `터뜨린 점수 ×${n1(n)} · 런 내내`,
      bigPop:     (k, m) => `${k}개 이상 터뜨리면 점수 ×${n1(m)}`,
      brickDeal:  (pct, br) => `터뜨린 점수 +${pct}% · 새 과일의 ${br}%가 벽돌`,
      clusterStep:(add, from, to) => `덩어리 보너스 +${n1(add)} (${n1(from)} → ${n1(to)})`,
      comboStep:  (add, from, to) => `콤보 증가폭 +${n1(add)} (${n1(from)} → ${n1(to)})`,
      comboCap:   (from, to) => `콤보 상한 ×${n1(from)} → ×${n1(to)}`,
      slots:      n => `유물 칸 +${n}`,
      offers:     n => `상점 진열 +${n}`,
      // 한 줄 / 두 줄, not 1줄 / 2줄 -- Korean counts small numbers of things with native
      // numerals, and the board can only ever grow by four
      rows:       n => `판이 ${["", "한", "두", "세", "네"][n] || n} 줄 넓어집니다`,
      startFruit: n => `스테이지를 시작할 때 과일 ${n}개가 더 놓입니다`,
      bombRadius: n => `폭탄 폭발 범위 +${n}`,
      bombSize:   n => `폭탄이 ${n}×${n}로 터집니다`,
      itemEase:   n => `아이템이 ${n}개 적게 터뜨려도 생깁니다`,
      birds:      n => `참새가 ${n}마리씩 날아갑니다`,
      birdsMore:  n => `참새가 ${n}마리 더 날아갑니다`,
      starCoin:   (a, b) => `별이 과일당 코인 ${a}개 → ${b}개`,
      starCoinUp: n => `별이 과일당 코인 +${n}`,
      crossLine:  () => "라인이 항상 가로세로 동시에 생깁니다",
      zoneMult:   n => `표시된 칸에서 터뜨리면 그 과일 점수 ×${n1(n)}`,
      zoneCoin:   n => `표시된 칸에서 터뜨리면 코인 +${n}`,
      zoneMore:   n => `표시된 칸 +${n}`,
      boostBest:  n => `지금 가장 비싼 과일의 값어치를 ${n1(n)}배로`,
      nextDouble: () => "다음 특성 선택을 2배로",
      // relic and trait names: one per id, no pattern to share. A name with no
      // translation falls back to Korean rather than vanishing.
      _names: {
        avalanche: "쏟아짐",
        banana_bite: "바나나 한 입",
        banana_cellar: "바나나 저장고",
        banana_grove: "바나나 농장",
        banana_hunter: "바나나 사냥꾼",
        banana_master: "바나나 숙성가",
        banana_taste: "바나나 취향",
        basket: "바구니",
        bell: "종소리",
        big_pocket: "넓은 주머니",
        big_pop: "대량 보너스",
        big_reclaim: "대개간",
        blast: "폭심",
        bomb_mod: "폭탄 개조",
        bonanza: "노다지",
        breather: "한 숨",
        brick_deal: "벽돌 계약",
        chain_master: "덩치",
        change_purse: "잔돈주머니",
        cherry_pick: "체리 편애",

    let want = ROWS_BASE;
    for (const id of activeRelics()) want += (RELICS[id] && RELICS[id].rows) || 0;
    for (const t of traits) {
      const T = TRAITS[t.id]; if (!T) continue;
      for (const e of traitEffects(T, t.amount)) if (e.stat === "rows") want += e.amount;
    }
    want = Math.min(ROWS_MAX, want);
    if (want <= ROWS) return false;
    // cell size comes from the width alone, so every existing r/c -> pixel mapping survives
    // a row being appended; only the canvas gets taller
    while (ROWS < want) {
      ROWS++;
      for (const [lyr, fill] of [[grid,-1],[special,null],[hp,0],[coinCell,0],
                                 [glow,null],[appear,0],[ghost,null]])
        if (lyr) lyr.push(Array(COLS).fill(fill));
    }
    layout();
    return true;
  }
  // a group of 3 is the smallest thing that pops, so eased thresholds stop there -- with a
  // relic and a doubled trait both easing them, 참새 would otherwise trigger on every pop
  const ITEM_NEED_MIN = 3;
  const itemNeed = t => Math.max(ITEM_NEED_MIN, t - itemEase);

  function applyRelics() {
    oddsMult = [0, 0, 0, 0, 0, 0, 0];
    fruitMult = [1, 1, 1, 1, 1, 1, 1];
    fruitFlat = [0, 0, 0, 0, 0, 0, 0];
    touchBonus = 0; spawnBonus = 0; brickChance = 0; offerBonus = 0;
    chainStep = 0; coinFruitBonus = 0; starCoinMult = 1; payoutMult = 1;
    bombRadiusBonus = 0; itemEase = 0; birdFlock = 1; crossLine = false;
    zoneMult = 1; zoneCoin = false; zoneBonus = 0;
    STREAK_STEP = STREAK_STEP_BASE; STREAK_CAP = 2.0;      // relics may raise these; reset first
    slotBonus = settleSlots();                // must be known before activeRelics() is read
    syncRows();                               // grows the board if a 개간 relic is active
    for (const id of activeRelics()) {
      const a = RELICS[id] && RELICS[id].apply;
      if (a) a();
    }
    // traits are data, so one generic loop applies every one of them
    for (const t of traits) {
      const T = TRAITS[t.id]; if (!T) continue;
      for (const e of traitEffects(T, t.amount)) {
        if (e.stat === "fruitMult")       fruitMult[e.target] += e.amount;
        else if (e.stat === "oddsMult")   oddsMult[e.target]  += e.amount;
        else if (e.stat === "touchBonus") touchBonus += e.amount;
        else if (e.stat === "spawnBonus") spawnBonus += e.amount;
        else if (e.stat === "slotBonus")  { /* handled by settleSlots() */ }
        else if (e.stat === "offerBonus") offerBonus += e.amount;
        else if (e.stat === "bombRadius") bombRadiusBonus += e.amount;
        else if (e.stat === "itemEase")   itemEase += e.amount;
        else if (e.stat === "birdFlock")  birdFlock += e.amount;
        else if (e.stat === "starCoin")   starCoinMult += e.amount;
      }
    }
  }
  // The carry limit is circular: which relics are active depends on the cap, and a relic can
  // raise the cap. Resolving it in the same pass made a satchel in the last slot cut itself
  // off and never grant its +2. Settle it to a fixed point first, then apply everything else.
  function settleSlots() {
    let fromTraits = 0;
    for (const t of traits) {
      const T = TRAITS[t.id]; if (!T) continue;
      for (const e of traitEffects(T, t.amount)) if (e.stat === "slotBonus") fromTraits += e.amount;
    }
    let bonus = fromTraits;
    for (let pass = 0; pass < relics.length + 2; pass++) {
      let fromRelics = 0;
      for (const id of relics.slice(0, RELIC_SLOTS + bonus)) {
        const R = RELICS[id];
        if (R && R.slots) fromRelics += R.slots;
      }
      const next = fromTraits + fromRelics;
      if (next === bonus) break;              // stable
      bonus = next;
    }
    return bonus;
  }

  // a trait's effects at a given scale (x2 when a graft charge is spent on it)
  function traitEffects(T, mult = 1) {
    const m = T.scalable ? mult : 1;
    return T.effects.map(e => ({ ...e, amount: e.amount * m }));
  }

  function emptyCells() {
    const out = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++)
      if (grid[r][c] === -1) out.push([r, c]);
    return out;
  }
  function filledCount() {
    let n = 0;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (grid[r][c] !== -1) n++;
    return n;
  }

  function spawnBuds(k) {
    for (let i = 0; i < k; i++) {
      const e = emptyCells();
      if (!e.length) return;
      const [r, c] = e[randInt(e.length)];
      if (brickChance > 0 && Math.random() < brickChance) {        // the brick contract's cost
        grid[r][c] = BRICK; special[r][c] = null; hp[r][c] = 1; appear[r][c] = 1;
        continue;
      }
      grid[r][c] = pickColor(); appear[r][c] = 1;
      if (Math.random() < COIN_FRUIT_CHANCE + coinFruitBonus) coinCell[r][c] = 1;
      notify("onSpawn", { r, c, color: grid[r][c] });
    }
  }

  function spawnBrick(level) {
    const e = emptyCells();
    if (!e.length) return;
    const [r, c] = e[randInt(e.length)];
    grid[r][c] = BRICK; special[r][c] = null; hp[r][c] = level; appear[r][c] = 1;
  }

  function pickNext() {
    if (nextColor2 == null) {                    // fresh game: fill both queue slots
      nextColor = pickColor();
      nextColor2 = pickColor();
      drawNextPreview(false);
    } else {                                     // advance: the lookahead becomes the placeable
      nextColor = nextColor2;
      nextColor2 = pickColor();
      drawNextPreview(true);                      // slide/push motion
    }
  }

  // render one queued fruit (color bubble + ring + sprite) into a preview canvas
  function drawPreviewInto(cv, colorIdx) {
    const g = cv.getContext("2d");
    const w = cv.width, h = cv.height, cx = w / 2, cy = h / 2;
    g.clearRect(0, 0, w, h);
    if (colorIdx == null) return;
    const col = COLORS[colorIdx] || "#fff";
    const grd = g.createRadialGradient(cx, cy, w * 0.06, cx, cy, w * 0.5);
    grd.addColorStop(0, col + "66");
    grd.addColorStop(1, col + "12");
    g.fillStyle = grd;
    g.beginPath(); g.arc(cx, cy, w * 0.48, 0, PI2); g.fill();
    g.strokeStyle = col + "cc"; g.lineWidth = w * 0.045;
    g.beginPath(); g.arc(cx, cy, w * 0.455, 0, PI2); g.stroke();
    const sp = fruitSprite[colorIdx];
    if (sp) {
      const s = w * 0.74;
      g.drawImage(sp, cx - s / 2, cy - s / 2, s, s);
    } else {
      g.fillStyle = col;
      g.beginPath(); g.arc(cx, cy, w * 0.3, 0, PI2); g.fill();
    }
  }
  let previewShows = null;      // what the preview last actually drew, so a stale one is visible
  function drawNextPreview(animatePush) {
    previewShows = nextColor;
    if (nextColor == null) return;
    const now = document.getElementById("np-now");
    const nxt = document.getElementById("np-next");
    drawPreviewInto(now, nextColor);
    drawPreviewInto(nxt, nextColor2);
    if (animatePush && now.animate) {   // "push": next slides up into the now-slot, a fresh one fades in behind
      now.animate([{ transform: "translateX(16px) scale(.62)", opacity: .25 }, { transform: "none", opacity: 1 }],
        { duration: 280, easing: "cubic-bezier(.2,.85,.25,1)" });
      nxt.animate([{ transform: "translateX(12px)", opacity: 0 }, { opacity: .72, transform: "none" }],
        { duration: 300, easing: "cubic-bezier(.2,.85,.25,1)" });
    }
  }

  // ---- game start ----
  function start(next = mode) {
    mode = MODES[next] ? next : "arcade";
    document.getElementById("shop").classList.add("hidden");
    document.getElementById("traits").classList.add("hidden");
    loadBest();
    resetRun();
    resetEffects();
    applyRelics();                     // passives land before the first fruit is dealt
    notify("onRunStart", { mode });
    spawnBuds(rules().startBuds);
    pickNext();
    updateHUD();
    running = true; busy = false;
    mfxStop();
    document.getElementById("overlay").classList.add("hidden");
    document.getElementById("hint").textContent = rules().touchBudget
      ? d("hintStage", "1-1", rules().quota(1), touchesLeft)
      : d("hintArcade");
  }

  // build the segmented gauge once
  let gaugeSegs = [];
  function buildGauge() {
    const g = document.getElementById("fillgauge");
    if (gaugeSegs.length) return;
    for (let i = 0; i < FILL_SEGS; i++) {
      const s = document.createElement("div");
      s.className = "seg";
      g.appendChild(s); gaugeSegs.push(s);
    }
  }
  function segColor(i) {                 // left=blue(safe) -> right=red(danger)
    const hue = 220 - (i / (FILL_SEGS - 1)) * 230;   // 220(blue) .. -10(red)
    return `hsl(${(hue + 360) % 360} 85% 58%)`;
  }
  // the counter ticks up toward `coins` instead of snapping, so the flying coins look like
  // they are what is filling it
  let coinBumpTimer = null;
  function paintCoins() {
    for (const id of ["st-coin-v", "rs-coin-v"]) {
      const el = document.getElementById(id);
      if (el) el.textContent = coinsShown;
    }
    const chip = document.getElementById(rules().touchBudget ? "rs-coin" : "st-coin");
    if (chip) {
      chip.classList.remove("bump");
      void chip.offsetWidth;                 // restart the animation
      chip.classList.add("bump");
      clearTimeout(coinBumpTimer);
      coinBumpTimer = setTimeout(() => chip.classList.remove("bump"), 260);
    }
  }
  function tickCoins() {
    if (coinsShown === coins) return;
    const d = coins - coinsShown;
    coinsShown += Math.sign(d) * Math.max(1, Math.ceil(Math.abs(d) * 0.18));
    if (Math.sign(coins - coinsShown) !== Math.sign(d)) coinsShown = coins;
    paintCoins();
  }

  function updateHUD() {
    document.getElementById("score").textContent = fmtNum(score);
    document.getElementById("best").textContent = fmtNum(best);
    updateStreakBadge();

    // arcade shows the difficulty ramp; rush shows the stage contract. Swap whole blocks
    // rather than relabelling shared ones -- the two modes want different hierarchies.
    const rush = rules().touchBudget;
    document.getElementById("stats").classList.toggle("hidden", rush);
    document.getElementById("rush").classList.toggle("hidden", !rush);
    document.getElementById("arcade-box").classList.toggle("hidden", rush);
    document.getElementById("rush-box").classList.toggle("hidden", !rush);
    if (rush) {
      const q = rules().quota(stage);
      const met = stageScore >= q;
      // once met, keep counting past the quota -- the overflow is the reward for playing on
      setQuota(document.getElementById("rb-quota"), stageScore, q);
      document.getElementById("rb-quota-cell").classList.toggle("met", met);
      document.getElementById("rb-quota-lab").textContent = d(met ? "goalMet" : "goal");
      document.getElementById("rb-touch").textContent = touchesLeft;
      document.getElementById("rb-score").textContent = fmtNum(score);
      document.getElementById("rb-best").textContent = fmtNum(best);
      const tc = document.getElementById("rb-touch-cell");
      tc.classList.toggle("warn", touchesLeft <= 5 && touchesLeft > 3);
      tc.classList.toggle("low", touchesLeft <= 3);
      document.getElementById("rs-stage").textContent = stageLabel(stage);
      document.getElementById("rs-spawn").textContent = spawnCount();

      const timed = document.getElementById("rs-timed");
      timed.textContent = "";
      const running_ = relics.filter(id => relicLife[id]);
      for (const id of running_.slice(0, 4)) {
        const R = RELICS[id], left = relicLife[id];
        const sp = document.createElement("span");
        sp.className = "chip timed" + (left <= 1 ? " last" : "");
        sp.textContent = `${R.icon}${left}`;
        sp.title = `${R.name} — ${d("lifeLeft", left, lifeUnitLabel(R.life.unit))}`;
        timed.appendChild(sp);
      }
      if (running_.length > 4) {                 // the rest are in the relic panel
        const more = document.createElement("span");
        more.className = "chip timed"; more.textContent = `+${running_.length - 4}`;
        timed.appendChild(more);
      }
    }
    // The button holds its place for the whole stage and only enables once the quota is met:
    // appearing on demand pushed everything below it down mid-play.
    const rn = document.getElementById("rush-next");
    rn.classList.toggle("hidden", !rush);
    if (rush) {
      const canLeave = running && !busy && stageScore >= rules().quota(stage);
      rn.disabled = !canLeave;
      document.getElementById("rn-coin").textContent = `🪙 +${leftoverCoins()}`;
    }
    // NOT snapped to `coins` here -- tickCoins() eases it so the flying coins look like
    // they are what fills the counter
    for (const id of ["st-coin-v", "rs-coin-v"]) {
      const el = document.getElementById(id);
      if (el) el.textContent = coinsShown;
    }
    const lv = level();
    document.getElementById("st-level").textContent = lv;
    document.getElementById("st-max").classList.toggle("hidden", lv < MAX_LEVEL);
    document.getElementById("st-touch").textContent = touchCount;
    document.getElementById("st-spawn").textContent = spawnCount();

    renderItemShop();                      // affordability moves with every coin
    // segmented board-fill / danger gauge
    buildGauge();
    const ratio = filledCount() / (ROWS * COLS);          // fill vs the whole board
    const lit = Math.round(ratio * FILL_SEGS);
    for (let i = 0; i < FILL_SEGS; i++) {
      const on = i < lit;
      gaugeSegs[i].classList.toggle("on", on);
      gaugeSegs[i].classList.toggle("frontier", on && i === lit - 1);
      gaugeSegs[i].style.background = on ? segColor(i) : "";
    }
    const danger = ratio >= 0.85;
    if (danger && !wasDanger) SFX.play("danger");   // only on the way in, not every frame
    wasDanger = danger;
    document.getElementById("fillgauge").classList.toggle("danger", danger);
    document.getElementById("danger-label").classList.toggle("hidden", !danger || rush);
    document.getElementById("danger-label2").classList.toggle("hidden", !danger || !rush);
  }

  // ---- input ----
  function cellFromEvent(ev) {
    const rect = canvas.getBoundingClientRect();
    const x = (ev.clientX - rect.left - pad) / cell;
    const y = (ev.clientY - rect.top - pad) / cell;
    const c = Math.floor(x), r = Math.floor(y);
    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return null;
    return [r, c];
  }

  canvas.addEventListener("pointerdown", (ev) => {
    ev.preventDefault();
    if (!running || busy || paused) return;
    const rc = cellFromEvent(ev);
    if (!rc) return;
    const [r, c] = rc;
    // belt and braces: even with the dock open, a stale selection cannot hijack a placement
    // once the dock is hidden
    if (selectedItem && !document.getElementById("dock").classList.contains("hidden")) {
      if (grid[r][c] === -1) placeTestItem(r, c, selectedItem);
      return;
    }
    if (armedItem) {                       // a bought item goes down instead of a fruit
      placeBoughtItem(r, c);
      return;
    }
    if (!tutAllows(r, c)) { buzz(8); return; }            // tutorial: one legal tap at a time
    if (grid[r][c] === -1) plant(r, c, nextColor);        // empty -> place next color
    else if (special[r][c]) tapItem(r, c);                // item bud -> trigger it
    // normal fruit or brick -> nothing
  });

  // ---- sound ---------------------------------------------------------------------
  // Synthesised, not sampled. No files to fetch, nothing to license, the single-HTML build
  // stays single, and the pitch of a pop is a number in this file rather than something to
  // re-record. play() is the only door, so an individual sound can be swapped for a real
  // buffer later without touching a single call site.
  const SFX = (() => {
    let ctx = null, master = null, armed = false, noiseBuf = null;
    let muted = false, volume = 0.7, voices = 0;
    // A cluster is the main event, so the ceiling has to fit one. At 14 a pop (two voices)
    // filled it after seven fruit and every later pop went silent -- the bigger the cluster
    // the quieter it got, leaving only the combo accent audible.
    // 33, not 26: the 3-layer pop style would otherwise only fit 8 at once. Simple oscillator
    // + gain + filter nodes are cheap; the cluster is what this game is about.
    const MAX_VOICES = 33;
    // ...and pops must never be starved by a coin or a combo blip, so accents get less room
    const ACCENT_VOICES = 14;
    try { muted = localStorage.getItem("fs_mute") === "1"; } catch (e) {}
    // +null is 0, and 0 passes a 0..1 range check -- so reading an unset key this way set the
    // volume to silent on every fresh install. Test for the missing key before converting.
    try {
      const raw = localStorage.getItem("fs_vol");
      if (raw !== null && raw !== "") { const v = +raw; if (v >= 0 && v <= 1) volume = v; }
    } catch (e) {}

    function boot() {
      if (ctx) return ctx;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ctx = new AC(); } catch (e) { return null; }
      master = ctx.createGain();
      master.gain.value = muted ? 0 : volume;
      master.connect(ctx.destination);
      return ctx;
    }
    // iOS and Chrome both keep a context suspended until a real gesture, so the first tap
    // anywhere wakes it. Until then every play() is a no-op rather than an error.
    function unlock() {
      const c = boot(); if (!c) return;
      if (c.state === "suspended" && c.resume) c.resume();
      armed = true;
    }
    const live = () => armed && !muted && ctx && ctx.state === "running";

    // A voice slot must come back even if onended never fires. Relying on that event alone
    // means one missed callback costs a slot forever, and after MAX_VOICES of them the game
    // goes permanently silent. The timer is the floor; whichever lands first wins, once.
    function claim(seconds) {
      voices++;
      let done = false;
      const release = () => { if (!done) { done = true; voices--; } };
      setTimeout(release, Math.max(60, seconds * 1000 + 120));
      return release;
    }
    function shape(src, t0, att, hold, rel, peak) {
      const g = ctx.createGain();
      const p = Math.max(0.0001, peak);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(p, t0 + att);
      g.gain.setValueAtTime(p, t0 + att + hold);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + att + hold + rel);
      src.connect(g); g.connect(master);
      return att + hold + rel;
    }
    function tone(o) {
      if (!live() || voices >= (o.lead ? MAX_VOICES : ACCENT_VOICES)) return;
      const t0 = ctx.currentTime + (o.delay || 0);
      const osc = ctx.createOscillator();
      osc.type = o.type || "sine";
      osc.frequency.setValueAtTime(o.f, t0);
      if (o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, t0 + (o.dur || 0.1));
      const span = shape(osc, t0, o.att || 0.004, o.hold || 0, o.dur || 0.1, o.vol == null ? 0.3 : o.vol);
      osc.onended = claim(span + (o.delay || 0));
      osc.start(t0); osc.stop(t0 + span + 0.03);
    }
    function noise(o) {
      if (!live() || voices >= (o.lead ? MAX_VOICES : ACCENT_VOICES)) return;
      if (!noiseBuf) {
        noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.4, ctx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      const t0 = ctx.currentTime + (o.delay || 0);
      const src = ctx.createBufferSource(); src.buffer = noiseBuf;
      const f = ctx.createBiquadFilter();
      f.type = o.filter || "lowpass";
      f.frequency.setValueAtTime(o.f || 1200, t0);
      if (o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, t0 + (o.dur || 0.15));
      f.Q.value = o.q || 1;
      src.connect(f);
      const span = shape(f, t0, o.att || 0.003, o.hold || 0, o.dur || 0.15, o.vol == null ? 0.25 : o.vol);
      src.onended = claim(span + (o.delay || 0));
      src.start(t0); src.stop(t0 + span + 0.03);
    }

    // Fruit pops sit on a pentatonic scale ordered by what the fruit is worth, cheapest
    // lowest. Bursts already fire staggered by distance, so a big cluster plays itself as a
    // rising arpeggio -- the bigger the cluster, the grander it sounds, for free.
    const PENTA = [0, 2, 4, 7, 9, 12, 16];
    const FRUIT_NOTE = [0, 2, 3, 1, 4, 5, 6];   // fruit index -> rung, by FRUIT_POINTS order
    const hz = semi => 330 * Math.pow(2, semi / 12);

    // Five takes on "과즙이 터진다". The physical reference matters: a bubble or droplet
    // collapsing sweeps its resonance UP, not down -- a falling sweep reads as a thud. The
    // first version here swept down, which is most of why it did not sound wet.
    const POP_STYLES = {
      drop: { name: "물방울", play(f) {          // bubble collapse: sine, sweeping up, fast decay
        tone({ f: f * 0.55, f2: f * 1.9, dur: 0.075, vol: 0.55, type: "sine", lead: true });
        noise({ f: f * 6, dur: 0.012, vol: 0.16, filter: "highpass", lead: true });
      } },
      splat: { name: "과즙", play(f) {           // wet squish: resonant lowpass slamming shut
        noise({ f: 6500, f2: f * 0.8, dur: 0.09, vol: 0.42, filter: "lowpass", q: 7, lead: true });
        tone({ f: f * 0.8, f2: f * 0.45, dur: 0.09, vol: 0.30, type: "sine", lead: true });
      } },
      cork: { name: "뽁", play(f) {              // cork out of a bottle: tight resonant blip
        noise({ f: f * 1.6, dur: 0.035, vol: 0.40, filter: "bandpass", q: 9, lead: true });
        tone({ f: f * 0.5, f2: f * 1.4, dur: 0.055, vol: 0.42, type: "sine", lead: true });
      } },
      burst: { name: "톡+과즙", play(f) {        // click, rising body, wet tail
        noise({ f: f * 8, dur: 0.01, vol: 0.22, filter: "highpass", lead: true });
        tone({ f: f * 0.6, f2: f * 2.1, dur: 0.07, vol: 0.5, type: "sine", lead: true });
        noise({ f: 3000, f2: f, dur: 0.06, vol: 0.20, filter: "lowpass", q: 4, lead: true });
      } },
      old: { name: "이전(하강)", play(f) {
        tone({ f: f * 1.5, f2: f * 0.92, dur: 0.13, vol: 0.52, type: "triangle", lead: true });
        noise({ f: f * 3.2, f2: f * 1.1, dur: 0.055, vol: 0.26, filter: "bandpass", q: 1.2, lead: true });
      } },
    };
    const POP_KEYS = Object.keys(POP_STYLES);
    let popStyle = POP_KEYS[0];
    try { const p = localStorage.getItem("fs_pop"); if (POP_STYLES[p]) popStyle = p; } catch (e) {}

    const S = {
      tap:    () => tone({ f: 520, f2: 380, dur: 0.05, vol: 0.10, type: "triangle" }),
      // putting a fruit down is half the feel of the game: a soft thud with a little body
      plant:  () => {
        tone({ f: 300, f2: 165, dur: 0.10, vol: 0.42, type: "triangle", lead: true });
        noise({ f: 800, f2: 260, dur: 0.05, vol: 0.16, filter: "lowpass", lead: true });
      },
      // The main sound, and still being chosen -- see POP_STYLES. ?pop=1 cycles them on a
      // phone, because this is the one thing that cannot be judged from the code.
      pop: i => POP_STYLES[popStyle].play(hz(PENTA[FRUIT_NOTE[i] == null ? 0 : FRUIT_NOTE[i]]) * 2),
      gain: size => {                       // the payoff, fuller with the cluster but under it
        const k = Math.min(1, size / 12);
        tone({ f: 330, dur: 0.20 + k * 0.12, vol: 0.11 + k * 0.10, type: "triangle" });
        tone({ f: 495, dur: 0.18 + k * 0.12, vol: 0.08 + k * 0.07, type: "sine", delay: 0.03 });
      },
      // an accent under the pops, not over them. A square wave at 0.16 carries far more
      // energy than a sine at 0.26, which is why this was the only thing audible.
      combo: n => {
        const s = PENTA[Math.min(PENTA.length - 1, n)];
        tone({ f: hz(s) * 2, dur: 0.07, vol: 0.07, type: "triangle" });
      },
